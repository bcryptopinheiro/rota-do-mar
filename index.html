    $('#mp-falta').textContent = falta ? 'Faltam ' + falta + (falta === 1 ? ' legenda.' : ' legendas.') : 'Tudo legendado.'; ok.disabled = falta > 0; };
  estado();
  ctx.body.querySelectorAll('.leg select').forEach(s => s.onchange = () => { resp[s.dataset.i] = s.value; estado(); if (aoMudar) aoMudar(Object.assign({}, resp)); });
  ok.onclick = () => {
    const res = F.pontos.map((p, i) => ({ r:resp[i], certo:p.r, ok:resp[i] === p.r }));
    const linhas = ctx.body.querySelectorAll('.leg-row');
    res.forEach((x, i) => { linhas[i].classList.add(x.ok ? 'right' : 'wrong'); if (!x.ok) linhas[i].insertAdjacentHTML('beforeend', '<span class="corr">Certo: ' + esc(x.certo) + '</span>'); });
    ctx.body.querySelectorAll('.leg select').forEach(s => s.disabled = true);
    ok.remove(); $('#mp-falta').remove();
    const certas = res.filter(x => x.ok).length;
    if (ctx.modo !== 'teste'){ if (certas === res.length) acerto(); else erro(); }
    const fb = ctx.body.querySelector('.fb');
    fb.hidden = false; fb.className = 'fb pop-in ' + (certas === res.length ? 'is-ok' : 'is-info');
    fb.innerHTML = '<p class="fb-msg">' + certas + ' de ' + res.length + ' certas.</p><button class="btn primary" type="button">Continuar</button>';
    fb.querySelector('button').onclick = () => done(certas / res.length, res);
    try { fb.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch(e){}
  };
}

/* =====================================================================
   SIMULAÇÃO DO TESTE (formato do teste real: grupos I a VII)
   Fica guardada a meio: perguntas sorteadas, respostas, legendas e textos (guardados enquanto se escreve).
   ===================================================================== */
function virgula(n){ return (Math.round(n * 10) / 10).toFixed(1).replace('.', ','); }
const SG = () => C.simulacao.grupos;
function faseSim(st){
  const G = SG();
  if (st.r1.length < G[0].n) return ['q1', 'Grupo I, pergunta ' + (st.r1.length + 1) + ' de ' + G[0].n];
  if (st.r2.length < G[1].n) return ['q2', 'Grupo II, pergunta ' + (st.r2.length + 1) + ' de ' + G[1].n];
  if (st.r3.length < G[2].n) return ['q3', 'Grupo III, frase ' + (st.r3.length + 1) + ' de ' + G[2].n];
  if (st.r4a == null) return ['lig', 'Grupo IV (associação)'];
  if (st.r4b == null) return ['ord', 'Grupo IV (ordenação)'];
  if (st.r5 == null) return ['map', 'Grupo V (legendar)'];
  const c = st.curtas.find(id => !st.dev[id] || !st.dev[id].feito);
  if (c) return ['curta:' + c, 'Grupo VI, resposta ' + (st.curtas.indexOf(c) + 1) + ' de ' + st.curtas.length];
  return ['ext', 'Grupo VII (resposta extensa)'];
}
function descreverSim(st){ return faseSim(st)[1]; }
function simValida(st){
  const S2 = C.simulacao;
  return !!st && st.v === 2 && st.g1.concat(st.g2, st.g3).every(id => ITENS[id]) && !!C.ligar[st.lig] && !!C.ordenar[st.ord] && !!C.figuras[st.mapa] &&
    st.curtas.every(id => S2.curtas.some(d => d.id === id)) && S2.extensas.some(d => d.id === st.ext);
}
function novaSim(){
  const G = SG(), S2 = C.simulacao;
  const comDoc = baralhar(C.perguntas.filter(p => p.t === 'mc' && p.doc)).slice(0, G[0].nDoc);
  const semDoc = baralhar(C.perguntas.filter(p => p.t === 'mc' && !p.doc)).slice(0, G[0].n - comDoc.length);
  return { v:2,
    g1:comDoc.concat(semDoc).map(p => p.id),
    g2:baralhar(C.perguntas.filter(p => p.t === 'vf')).slice(0, G[1].n).map(p => p.id),
    g3:baralhar(C.perguntas.filter(p => p.t === 'completa')).slice(0, G[2].n).map(p => p.id),
    lig:sorte(S2.ligar), ord:sorte(S2.ordenar), mapa:sorte(S2.mapas),
    curtas:baralhar(S2.curtas).slice(0, G[5].n).map(d => d.id), ext:sorte(S2.extensas).id,
    r1:[], r2:[], r3:[], r4a:null, r4b:null, mapaResp:{}, r5:null, r5res:null, dev:{}
  };
}

function simulacao(){
  combo = 0;
  const SIM = C.simulacao, G = SIM.grupos;
  let st = S.prog.sim;
  if (!simValida(st)){ delete S.prog.sim; st = novaSim(); }
  const total = G[0].n + G[1].n + G[2].n + 3 + G[5].n + 1;
  const ctx = palco('Simulação do Teste', 'teste', 'sim');
  const titulo = t => { const el = $app.querySelector('.pb-title'); if (el) el.textContent = t; };
  const gravar = () => { S.prog.sim = st; guardar(); };
  const feitos = () => st.r1.length + st.r2.length + st.r3.length + (st.r4a != null) + (st.r4b != null) + (st.r5 != null) + st.curtas.filter(id => st.dev[id] && st.dev[id].feito).length;
  const mostrarProg = () => { const f = feitos(); ctx.prog(f / total, Math.min(f + 1, total) + '/' + total); };

  if (S.prog.sim) return continuar();
  ctx.prog(0, '');
  ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">Simulação do Teste</p><h2 class="qtext">Igual ao teste real</h2>' +
    '<p class="lead">Responde como no teste: não há explicações até ao fim. Há documentos (gráficos, textos, mapas e esquemas), como nas fichas. No final tens a nota de 0 a 20 valores e a correção. Se saíres a meio, fica guardado, incluindo o que escreveste.</p>' +
    '<ol class="grupos">' + G.map(g => '<li><span class="gn">' + g.nome + '</span><span>' + esc(g.tipo) + (g.n > 1 ? ' · ' + g.n + (g.k === 'assoc' ? ' exercícios' : ' perguntas') : '') + '</span><span class="gc">' + g.cotacao + ' val.</span></li>').join('') + '</ol>' +
    '<button class="btn primary big" id="sim-go" type="button">Começar o teste</button></article>';
  $('#sim-go').onclick = () => { gravar(); continuar(); };

  function continuar(){
    topo(); mostrarProg();
    const nResp = st.r1.length + st.r2.length + st.r3.length;
    ctx.setAnterior(nResp > 0, () => verSim(nResp - 1));
    ctx.setVoltar(() => nResp > 0 ? verSim(nResp - 1) : ctx.sair());
    const f = faseSim(st)[0];
    if (f === 'q1') return pergunta(0, st.g1, st.r1);
    if (f === 'q2') return pergunta(1, st.g2, st.r2);
    if (f === 'q3') return pergunta(2, st.g3, st.r3);
    if (f === 'lig'){ titulo('Simulação · Grupo IV · Associação'); return telaLigar(ctx, st.lig, c => { st.r4a = c; gravar(); continuar(); }); }
    if (f === 'ord'){ titulo('Simulação · Grupo IV · Ordenação'); return telaOrdem(ctx, st.ord, c => { st.r4b = c; gravar(); continuar(); }); }
    if (f === 'map'){ titulo('Simulação · Grupo V · Legendar'); return telaMapa(ctx, st.mapa, st.mapaResp, r => { st.mapaResp = r; gravar(); }, (c, res) => { st.r5 = c; st.r5res = res; gravar(); continuar(); }); }
    if (f.indexOf('curta:') === 0){ const id = f.slice(6), d = SIM.curtas.find(x => x.id === id);
      titulo('Simulação · Grupo VI · Resposta curta');
      return telaDesenvolvimento(ctx, d, est(id), gravar, () => { st.dev[id].feito = true; gravar(); continuar(); }, G[5].nome, G[5].cotacao / G[5].n, false); }
    const d = SIM.extensas.find(x => x.id === st.ext);
    titulo('Simulação · Grupo VII · Resposta extensa');
    telaDesenvolvimento(ctx, d, est(st.ext), gravar, fim, G[6].nome, G[6].cotacao, true);
  }
  function verSim(j){ // rever e, se quiseres, mudar uma resposta dos grupos I a III
    topo();
    const gi = j < G[0].n ? 0 : j < G[0].n + G[1].n ? 1 : 2, base = gi === 0 ? 0 : gi === 1 ? G[0].n : G[0].n + G[1].n;
    const idx = j - base, lista = gi === 0 ? st.g1 : gi === 1 ? st.g2 : st.g3, dest = gi === 0 ? st.r1 : gi === 1 ? st.r2 : st.r3;
    const it = ITENS[lista[idx]], Q = preparar(it), antes = Q.opts.findIndex(o => o.txt === dest[idx].esc);
    const nResp = st.r1.length + st.r2.length + st.r3.length, ultimo = j + 1 >= nResp;
    const seguinte = () => ultimo ? continuar() : verSim(j + 1);
    titulo('Simulação · ' + G[gi].nome + ' · a rever');
    ctx.setAnterior(j > 0, () => verSim(j - 1));
    ctx.setVoltar(() => j > 0 ? verSim(j - 1) : ctx.sair());
    telaPergunta(ctx, it, (ok, Q2, i) => { dest[idx] = { id:Q2.id, ok, esc:Q2.opts[i].txt }; gravar(); seguinte(); },
      { Q, escolhido:antes, tag:G[gi].nome + ' · ' + (idx + 1) + ' de ' + lista.length + ' · podes mudar a resposta' });
    ctx.body.querySelector('.q').insertAdjacentHTML('beforeend', '<div class="acts"><button class="btn ghost" id="rv-seg" type="button">' + (ultimo ? 'Voltar ao passo onde ias →' : 'Seguinte sem mudar →') + '</button></div>');
    $('#rv-seg').onclick = seguinte;
  }
  function est(id){ if (!st.dev[id]) st.dev[id] = { texto:'', submetido:false, marcados:[], feito:false }; return st.dev[id]; }
  function pergunta(gi, lista, dest){
    const k = dest.length;
    titulo('Simulação · ' + G[gi].nome + ' · ' + G[gi].tipo);
    telaPergunta(ctx, ITENS[lista[k]], (ok, Q, i) => { dest.push({ id:Q.id, ok, esc:Q.opts[i].txt }); gravar(); continuar(); });
    ctx.body.querySelector('.tag').textContent = G[gi].nome + ' · ' + (k + 1) + ' de ' + lista.length;
  }

  function fim(){
    delete S.prog.sim;
    const R = { g1:st.r1.map(desResposta), g2:st.r2.map(desResposta), g3:st.r3.map(desResposta) };
    const c1 = R.g1.filter(x => x.ok).length, c2 = R.g2.filter(x => x.ok).length, c3 = R.g3.filter(x => x.ok).length;
    const n1 = c1 * G[0].cotacao / G[0].n, n2 = c2 * G[1].cotacao / G[1].n, n3 = c3 * G[2].cotacao / G[2].n;
    const n4 = (st.r4a + st.r4b) / 2 * G[3].cotacao, n5 = st.r5 * G[4].cotacao;
    const fr = id => { const d = SIM.curtas.concat(SIM.extensas).find(x => x.id === id), e = st.dev[id], tot = d.pontos.length + (SIM.extensas.indexOf(d) >= 0 ? SIM.pontos.length : 0);
      return { d, e, tot, f:e.marcados.length / tot }; };
    const curtas = st.curtas.map(fr), ext = fr(st.ext);
    const n6 = curtas.reduce((s, x) => s + x.f, 0) / curtas.length * G[5].cotacao, n7 = ext.f * G[6].cotacao;
    const nota = Math.round((n1 + n2 + n3 + n4 + n5 + n6 + n7) * 10) / 10;
    const certas = c1 + c2 + c3;
    S.xp += certas * 10;
    const e1 = R.g1.filter(x => !x.ok), e2 = R.g2.filter(x => !x.ok), e3 = R.g3.filter(x => !x.ok);
    e1.concat(e2, e3).forEach(x => { S.erros[x.Q.id] = { s:0 }; });
    S.simulacao = { melhor:Math.max(S.simulacao ? S.simulacao.melhor : 0, nota), ultima:nota };
    guardar();
    const msg = nota >= 18 ? 'Excelente! Estás pronto para o teste.' : nota >= 14 ? 'Muito bom! Revê o que falhaste e chegas lá acima.' : nota >= 9.5 ? 'Positiva! Usa a revisão dos erros para subir a nota.' : 'Ainda não chegaste à positiva, mas agora sabes exatamente o que rever.';
    const itemQ = x => { const certa = x.Q.opts.find(o => o.ok).txt;
      return '<div class="revitem"><p class="qq">' + esc(x.Q.q.replace('___', '______')) + '</p><p class="tu">A tua resposta: ' + esc(x.Q.opts[x.i].txt) + '</p><p class="ce">Resposta certa: ' + esc(certa) + '</p>' + (x.Q.e ? '<p>' + esc(x.Q.e) + '</p>' : '') + '</div>'; };
    const bloco = (t, arr, f) => arr.length ? '<p class="col-h">' + t + ' (' + arr.length + ')</p>' + arr.map(f).join('') : '';
    const mapaErr = (st.r5res || []).filter(x => !x.ok);
    const faltou = curtas.concat([ext]).map(x => { const pts = x.d.pontos.concat(SIM.extensas.indexOf(x.d) >= 0 ? SIM.pontos : []);
      const f = pts.filter((p, i) => x.e.marcados.indexOf(i) < 0); return f.length ? '<div class="revitem"><p class="qq">' + esc(x.d.pergunta) + '</p>' + f.map(p => '<p>• ' + esc(p) + '</p>').join('') + '</div>' : ''; }).join('');
    const cota = (n, g, txt) => '<div><b>' + virgula(n) + '/' + g.cotacao + '</b><span>' + g.nome + ' · ' + txt + '</span></div>';
    limpar(); topo();
    $app.innerHTML = '<div class="wrap"><section class="res pop-in"><p class="eyebrow">Simulação do Teste</p><p class="big">' + virgula(nota) + '<small> valores</small></p><h2>' + esc(msg) + '</h2>' +
      '<div class="cotas">' +
        cota(n1, G[0], c1 + '/' + G[0].n + ' certas') + cota(n2, G[1], c2 + '/' + G[1].n + ' certas') + cota(n3, G[2], c3 + '/' + G[2].n + ' certas') +
        cota(n4, G[3], Math.round((st.r4a + st.r4b) / 2 * 100) + '%') + cota(n5, G[4], Math.round(st.r5 * 100) + '% certo') +
        cota(n6, G[5], curtas.reduce((s, x) => s + x.e.marcados.length, 0) + '/' + curtas.reduce((s, x) => s + x.tot, 0) + ' pontos') + cota(n7, G[6], ext.e.marcados.length + '/' + ext.tot + ' pontos') +
      '</div>' +
      '<div class="stats"><span>+' + (certas * 10) + ' XP</span><span>melhor: ' + virgula(S.simulacao.melhor) + ' valores</span></div>' +
      '<div class="revlist">' +
        bloco('Grupo I · erradas', e1, itemQ) + bloco('Grupo II · erradas', e2, itemQ) + bloco('Grupo III · erradas', e3, itemQ) +
        (mapaErr.length ? '<p class="col-h">Grupo V · legendas erradas</p><div class="revitem">' + mapaErr.map(x => '<p>• Puseste «' + esc(x.r || '—') + '»; era <b>' + esc(x.certo) + '</b></p>').join('') + '</div>' : '') +
        (faltou ? '<p class="col-h">Grupos VI e VII · pontos que faltaram</p>' + faltou : '') +
      '</div>' +
      htmlRespostas(R.g1.concat(R.g2, R.g3).map(x => Object.assign({ c:x.ok ? 1 : 0 }, x)), 'Ver todas as respostas dos grupos I a III') +
      '<div class="acts"><button class="btn primary" id="s-rep" type="button">Fazer outra simulação</button>' + (e1.length + e2.length + e3.length ? '<button class="btn" id="s-rev" type="button">Rever os erros</button>' : '') + '<button class="btn ghost" id="s-ini" type="button">Início</button></div></section></div>';
    $('#s-rep').onclick = simulacao;
    const rv = $('#s-rev'); if (rv) rv.onclick = revisao;
    $('#s-ini').onclick = inicio;
    if (nota >= 18) setTimeout(confetis, 250);
  }
}

/* Resposta escrita dentro de um mundo: conta como uma pergunta, com a fração de pontos que o aluno marcou */
function telaEscrita(ctx, id, done){
  const dev = C.escritas.find(e => e.id === id);
  if (!dev) return done(0);
  S.rascunhos = S.rascunhos || {};
  const st = S.rascunhos[id] || (S.rascunhos[id] = { texto:'', submetido:false, marcados:[] });
  telaDesenvolvimento(ctx, dev, st, guardar, () => {
    const c = st.marcados.length / dev.pontos.length;
    if (c >= 0.99) acerto(); else if (c < 0.5) erro();
    const fez = { texto:st.texto, marcados:st.marcados.slice() };
    delete S.rascunhos[id]; guardar(); done(c, fez);
  }, 'Resposta escrita', null, false);
}

/* Respostas escritas (curta ou extensa): texto guardado enquanto se escreve, resposta-modelo e checklist */
function telaDesenvolvimento(ctx, dev, st, gravar, done, grupo, cot, extensa){
  const SIM = C.simulacao, pontos = dev.pontos.concat(extensa ? SIM.pontos : []);
  if (st.submetido) return corrigir();
  ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">' + grupo + (cot != null ? ' · ' + virgula(cot) + ' valores' : '') + '</p>' + (dev.doc ? htmlDoc(dev.doc) : '') + '<h2 class="qtext' + (dev.pergunta.length > 150 ? ' longa' : '') + '">' + esc(dev.pergunta) + '</h2>' +
    '<p class="lead">' + (extensa ? 'Escreve um texto organizado, com vários parágrafos, como no teste.' : 'Responde em poucas frases, com os termos geográficos certos.') + ' O texto fica guardado enquanto escreves. Depois comparas com a resposta-modelo e marcas os pontos que incluíste.</p>' +
    '<label class="col-h" for="resp-dev">A tua resposta</label><textarea class="dev" id="resp-dev" style="min-height:' + (extensa ? 260 : 150) + 'px"></textarea>' +
    '<p class="small muted" id="dev-n"></p><p class="small" id="dev-aviso" hidden></p>' +
    '<button class="btn primary big" id="dev-ok" type="button">Submeter resposta</button></article>';
  const ta = $('#resp-dev');
  ta.value = st.texto || '';
  const palavras = () => (ta.value.trim().match(/\S+/g) || []).length;
  const contar = () => { const n = palavras(); $('#dev-n').textContent = n + (n === 1 ? ' palavra' : ' palavras'); };
  contar();
  ta.oninput = () => { st.texto = ta.value; gravar(); contar(); };
  let avisado = false;
  $('#dev-ok').onclick = () => {
    const minimo = extensa ? 40 : 12;
    if (palavras() < minimo && !avisado){
      avisado = true; const a = $('#dev-aviso'); a.hidden = false;
      a.textContent = 'A tua resposta está muito curta para ' + (extensa ? 'uma resposta extensa' : 'esta pergunta') + '. Carrega outra vez em Submeter se quiseres continuar assim.';
      return;
    }
    st.texto = ta.value.trim(); st.submetido = true; gravar();
    corrigir();
  };
  function corrigir(){
    topo();
    ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">' + grupo + ' · Autoavaliação</p>' + (dev.doc ? htmlDoc(dev.doc) : '') + '<h2 class="qtext longa">' + esc(dev.pergunta) + '</h2>' +
      '<p class="col-h">A tua resposta</p><div class="caixa">' + (st.texto ? esc(st.texto) : '<span class="muted">(sem resposta)</span>') + '</div>' +
      '<p class="col-h">Resposta-modelo</p><div class="caixa modelo">' + esc(dev.modelo) + '</div>' +
      '<p class="col-h">Marca cada ponto que a tua resposta inclui</p><div class="check">' +
      pontos.map((p, i) => '<label><input type="checkbox" data-i="' + i + '"' + (st.marcados.indexOf(i) >= 0 ? ' checked' : '') + '><span>' + esc(p) + '</span></label>').join('') + '</div>' +
      '<p class="small muted">Sê honesto: só marcas o que escreveste mesmo.' + (cot != null ? ' Cada ponto vale ' + virgula(cot / pontos.length) + ' valores.' : ' No teste, uma resposta só tem a cotação toda se tiver todos os pontos.') + '</p>' +
      '<button class="btn primary big" id="dev-fim" type="button">' + (extensa ? 'Ver a nota final' : 'Continuar') + '</button></article>';
    const marcados = () => Array.from(ctx.body.querySelectorAll('.check input:checked')).map(x => +x.dataset.i);
    ctx.body.querySelectorAll('.check input').forEach(x => x.onchange = () => { st.marcados = marcados(); gravar(); });
    $('#dev-fim').onclick = () => { st.marcados = marcados(); gravar(); done(); };
  }
}

/* =====================================================================
   MATÉRIA (lições) — explicada antes das perguntas

function htmlLicao(n){
  const L = C.licoes[n]; if (!L) return '';

/* Uma secção da lição (usada na matéria toda e nas partes dentro dos mundos) */
function htmlSeccao(s){
  const tabela = t => '<p class="li-sub">' + esc(t.titulo) + '</p><div class="li-tabwrap"><table class="li-tab"><thead><tr>' + t.cab.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
    t.linhas.map(l => '<tr>' + l.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';

/* Minijogo dentro da lição: um caso de cada vez, com explicação (os cliques tratam-se em baixo) */
function htmlQuiz(key, ordem, k, certas){
  const set = C.classificar[key];
  ordem = ordem || baralhar(set.itens.map((_, i) => i)); k = k || 0; certas = certas || 0;
  const dados = ' data-set="' + key + '" data-ordem="' + ordem.join(',') + '" data-k="' + k + '" data-certas="' + certas + '"';
  if (k >= ordem.length) return '<div class="lq"' + dados + '><p class="fb-msg">Acertaste ' + certas + ' de ' + ordem.length + '.</p><p class="lead small">' + (certas === ordem.length ? 'Perfeito: já dominas esta parte.' : 'Relê a matéria acima e tenta outra vez.') + '</p><button class="btn primary lq-rep" type="button">Repetir com outra ordem</button></div>';
  const it = set.itens[ordem[k]];
  return '<div class="lq"' + dados + '><p class="lq-n">Caso ' + (k + 1) + ' de ' + ordem.length + '</p><p class="lq-caso">' + esc(it.x) + '</p>' +
    '<div class="lq-ops">' + set.cats.map(c => '<button class="opt lq-b" data-c="' + c.k + '" type="button"><span>' + esc(c.l) + '</span></button>').join('') + '</div><div class="fb" hidden></div></div>';
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.lq-b, .lq-next, .lq-rep'); if (!b) return;
  const box = b.closest('.lq'), key = box.dataset.set, set = C.classificar[key];
  const ordem = box.dataset.ordem.split(',').map(Number), k = +box.dataset.k, certas = +box.dataset.certas;
  if (b.classList.contains('lq-rep')){ box.outerHTML = htmlQuiz(key); return; }
  if (b.classList.contains('lq-next')){ box.outerHTML = htmlQuiz(key, ordem, k + 1, certas); return; }
  if (box.dataset.feito) return; box.dataset.feito = '1';

  if (!ok) b.classList.add('wrong');
  if (ok){ acerto(); box.dataset.certas = certas + 1; } else erro(it.id);
  const fb = box.querySelector('.fb'); fb.hidden = false; fb.className = 'fb pop-in ' + (ok ? 'is-ok' : 'is-bad');
  fb.innerHTML = '<p class="fb-msg">' + (ok ? 'Certo!' : 'Ainda não.') + '</p><p class="fb-e">' + esc(it.e || set.porque[it.c]) + '</p><button class="btn primary lq-next" type="button">' + (k + 1 < ordem.length ? 'Próximo caso' : 'Ver resultado') + '</button>';
});

/* =====================================================================
   CARTÕES DE ESTUDO
   ===================================================================== */
function cartoes(filtro){
  limpar(); topo();
  const porTema = /^m\d+$/.test(filtro), tema = porTema ? +filtro.slice(1) : 0;
  const lista = C.cartoes.filter(c => filtro === 'todos' || (porTema ? c.m === tema : filtro === 'abertas' ? c.aberta : !c.aberta));
  const ordenar = arr => baralhar(arr).sort((a, b) => a.m - b.m); // pela ordem da matéria
  let fila = ordenar(lista.filter(c => S.cartoes[c.id] !== 1)).concat(ordenar(lista.filter(c => S.cartoes[c.id] === 1)));
  let virado = false;
  const sabidos = () => lista.filter(c => S.cartoes[c.id] === 1).length;
  const filtros = [['todos','Todos'], ['abertas','Respostas abertas'], ['conceitos','Conceitos']].concat(C.mundos.map(m => ['m' + m.n, m.letra + ' ' + m.curto]));

  $app.innerHTML = '<div class="wrap" style="gap:14px"><header class="playbar"><button class="icon-btn" id="sair" type="button" aria-label="Sair para o início">✕</button>' +
    '<button class="icon-btn" id="cant" type="button" aria-label="Ver o cartão anterior" title="Cartão anterior" hidden>←</button>' +
    '<div class="pb-mid"><p class="pb-title">Cartões de estudo</p><div class="bar"><i id="pbar"></i></div></div><span></span><div class="pb-right"><span id="pcount"></span></div></header>' +
    '<div class="filtros">' + filtros.map(f => '<button class="mini-b ' + (f[0] === filtro ? 'on' : '') + '" data-f="' + f[0] + '" type="button" aria-pressed="' + (f[0] === filtro) + '">' + esc(f[1]) + '</button>').join('') + '</div>' +
    (porTema ? '<p class="aviso">Primeiro lê a matéria deste tema e só depois tenta os cartões. <button class="link-b" id="c-ler" type="button">Ler a matéria do Mundo ' + tema + '</button></p>' : '') +
    '<main class="stage" id="stage"></main></div>';
  $('#sair').onclick = inicio;
  $app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => cartoes(b.dataset.f));
  const ler = $('#c-ler'); if (ler) ler.onclick = () => abrirMateria(tema);
  const stage = $('#stage');

  const vistos = [], pa = $('#cant');
  const armar = (pode, fn) => { pa.hidden = !pode; pa.onclick = fn; armarVoltar(pode ? fn : inicio); };
  function verCartao(j){ // rever um cartão que já passou
    const c = vistos[j], ultimo = j + 1 >= vistos.length; let v = false;
    armar(j > 0, () => verCartao(j - 1));
    stage.innerHTML = '<p class="small muted">Cartão que já viste (' + (j + 1) + ' de ' + vistos.length + ')</p><div class="cartao"><button class="face pop-in" id="face" type="button" aria-label="Virar cartão">' + frente(c) + '</button></div>' +
      '<div class="acts"><button class="btn primary" id="cv-seg" type="button">' + (ultimo ? 'Voltar ao cartão onde ias →' : 'Seguinte →') + '</button></div>' +
      '<button class="btn ghost" id="c-mat" type="button">Ler a matéria deste tema (Mundo ' + c.m + ')</button>';
    const face = $('#face');
    face.onclick = () => { v = !v; face.innerHTML = v ? verso(c) : frente(c); face.classList.toggle('verso', v); };
    $('#cv-seg').onclick = () => ultimo ? render() : verCartao(j + 1);
    $('#c-mat').onclick = () => abrirMateria(c.m);
  }
  const atualizar = () => { $('#pbar').style.width = (sabidos() / lista.length * 100) + '%'; $('#pcount').textContent = sabidos() + '/' + lista.length; };
  const render = () => {
    atualizar(); virado = false;
    armar(vistos.length > 0, () => verCartao(vistos.length - 1));
    if (!fila.length){
      stage.innerHTML = '<section class="res pop-in"><p class="eyebrow">Baralho terminado</p><p class="big">' + sabidos() + '<small>/' + lista.length + '</small></p><h2>Já sabes ' + sabidos() + ' de ' + lista.length + ' cartões.</h2>' +
        '<div class="acts"><button class="btn primary" id="c-rep" type="button">Recomeçar baralho</button><button class="btn ghost" id="c-ini" type="button">Início</button></div></section>';
      $('#c-rep').onclick = () => cartoes(filtro); $('#c-ini').onclick = inicio;
      if (sabidos() === lista.length) confetis();
      return;
    }
    const c = fila[0];
    stage.innerHTML = '<div class="cartao"><button class="face pop-in" id="face" type="button" aria-label="Virar cartão">' + frente(c) + '</button></div><div class="acts" id="c-acts"></div>' +
      '<button class="btn ghost" id="c-mat" type="button">Ainda não sei: ler a matéria deste tema (Mundo ' + c.m + ')</button>';
    $('#face').onclick = virar;
    $('#c-mat').onclick = () => abrirMateria(c.m);
  };
  const frente = c => '<p class="tag">' + (c.aberta ? 'Resposta aberta (estilo teste)' : 'Conceito') + ' · Mundo ' + c.m + '</p><p class="ft' + (c.frente.length > 140 ? ' longa' : '') + '">' + esc(c.frente) + '</p><p class="hint-t">Pensa na resposta e toca para a ver</p>';
  const verso = c => '<p class="tag">Resposta</p><p class="vt">' + esc(c.verso) + '</p>' + (c.exemplo ? '<p class="ex"><b>Exemplo: </b>' + esc(c.exemplo) + '</p>' : '') + '<p class="hint-t">Toca para voltar à pergunta</p>';
  const virar = () => {
    const face = $('#face'), c = fila[0];
    face.classList.remove('pop-in'); face.classList.add('flip-out');
    setTimeout(() => {
      virado = !virado;
      face.innerHTML = virado ? verso(c) : frente(c);
      face.classList.toggle('verso', virado); face.classList.remove('flip-out');
      if (virado && !$('#c-acts').children.length){
        $('#c-acts').innerHTML = '<button class="btn" id="c-rev" type="button">Rever outra vez</button><button class="btn primary" id="c-sei" type="button">Já sei</button>';
        $('#c-sei').onclick = () => { vistos.push(c); S.cartoes[c.id] = 1; guardar(); fila.shift(); fila = fila.filter(x => x !== c); render(); };
        $('#c-rev').onclick = () => {
          vistos.push(c); S.cartoes[c.id] = 0; guardar(); fila.shift();
          fila.splice(Math.min(fila.length, 3), 0, c);
          if (fila.length > 6) fila.push(c);
          render();
        };
      }
    }, 160);
  };
  render();
}

/* =====================================================================
   CONFETTIS
   ===================================================================== */
function confetis(){
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch(e){}
  const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
  const g = cv.getContext('2d'); if (!g){ cv.remove(); return; }
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cores = ['--accent','--gold','--ok','--bad','--sky'].map(v => cs.getPropertyValue(v).trim() || '#f0b400');
  const ps = Array.from({ length:150 }, () => ({ x:W / 2 + (Math.random() - .5) * W * .4, y:H * .3, vx:(Math.random() - .5) * 13, vy:-Math.random() * 13 - 4, r:Math.random() * 7 + 5, a:Math.random() * 6, va:(Math.random() - .5) * .3, c:sorte(cores) }));
  const t0 = performance.now();
  (function f(t){
    g.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(f); else cv.remove();
  })(t0);
}

/* =====================================================================
   SONS ASMR (Web Audio, sem ficheiros) — desligados por defeito
   Bolhas suaves ao acertar, «ploc» baixinho ao errar, harpa ao subir de nível,
   «pop» ao rebentar bolhas, toque leve nos botões e, se quiseres, o som das ondas.
   ===================================================================== */
// Os sons ficam entre 300 e 3000 Hz: é o que os altifalantes dos telemóveis conseguem tocar.
let AC = null;
function audio(){
  if (!AC){ const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; AC = new A(); }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
// iPhone/Android: o som só arranca depois de um toque, por isso "acorda-se" o áudio no primeiro toque
document.addEventListener('pointerdown', e => {
  if (!S.def.som) return;
  try { audio(); marAmbiente(); } catch(err){}
  const b = e.target.closest && e.target.closest('.opt, .seg-b, .lk, .peca, .slot-b, .sp-b, .mini-b, .leg select');
  if (b && !b.disabled) tocar('tique');
}, { passive:true, capture:true });

/* Desenha um som num contexto de áudio (também serve para o testar sem colunas, com OfflineAudioContext) */
function desenharSom(ac, dest, t, tipo){
  const out = ac.createGain(); out.gain.value = 0.85; out.connect(dest);
  const tom = (atraso, f0, f1, dur, vol, forma) => {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = t + atraso;
    o.type = forma || 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + dur + 0.03);
  };
  const ruido = (f0, f1, dur, vol) => { // água: ruído filtrado muito curto
    const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    n.buffer = buf; f.type = 'bandpass'; f.Q.value = 2;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.value = vol; n.connect(f); f.connect(g); g.connect(out); n.start(t);
  };
  if (tipo === 'certo'){ // duas bolhas a subir
    tom(0, 480, 820, 0.09, 0.22); tom(0.08, 660, 1250, 0.12, 0.17); ruido(2400, 1600, 0.05, 0.1);
  } else if (tipo === 'errado'){ // «ploc» grave e suave
    tom(0, 320, 210, 0.26, 0.2); tom(0.03, 250, 190, 0.22, 0.07, 'triangle');
  } else if (tipo === 'nivel'){ // harpa
    [523, 659, 784, 1047, 1319].forEach((f, i) => tom(i * 0.1, f, f * 1.002, 0.55, 0.14, 'triangle'));
  } else if (tipo === 'tique'){ // toque leve num botão
    tom(0, 1700, 1300, 0.03, 0.06, 'triangle');
  } else { // «pop» de uma bolha
    tom(0, 360, 1500, 0.06, 0.3); ruido(3600, 1800, 0.03, 0.16);
  }
}
function tocar(tipo){
  if (!S.def.som) return;
  try { const ac = audio(); if (ac) desenharSom(ac, ac.destination, ac.currentTime + 0.01, tipo); } catch(e){}
}
function somSquish(){ tocar('pop'); }
function vibrar(ms){ if (S.def.vibrar && navigator.vibrate) try { navigator.vibrate(ms); } catch(e){} }

/* Som das ondas: ruído suave que sobe e desce devagar, como o mar a chegar à praia */
let MAR = null;
function marAmbiente(){
  const quer = S.def.som && S.def.mar && !document.hidden;
  if (!quer){
    if (MAR && AC){ const m = MAR; MAR = null; try { m.out.gain.setTargetAtTime(0, AC.currentTime, 0.4); } catch(e){} setTimeout(() => { try { m.src.stop(); m.lfo.stop(); m.lfo2.stop(); } catch(e){} }, 2000); }
    return;
  }
  if (MAR) return;
  const ac = audio(); if (!ac || ac.state !== 'running') return; // espera pelo primeiro toque
  const len = ac.sampleRate * 6, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  let b = 0;
  for (let i = 0; i < len; i++){ const w = Math.random() * 2 - 1; b = (b + 0.03 * w) / 1.03; d[i] = b * 2.5 + w * 0.12; }
  const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), lp = ac.createBiquadFilter(), g = ac.createGain(), out = ac.createGain();
  src.buffer = buf; src.loop = true;
  bp.type = 'bandpass'; bp.frequency.value = 800; bp.Q.value = 0.5;
  lp.type = 'lowpass'; lp.frequency.value = 2400;
  g.gain.value = 0.1; out.gain.value = 0;
  const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 0.09; lg.gain.value = 0.08; lfo.connect(lg); lg.connect(g.gain);
  const lfo2 = ac.createOscillator(), lg2 = ac.createGain(); lfo2.frequency.value = 0.13; lg2.gain.value = 300; lfo2.connect(lg2); lg2.connect(bp.frequency);
  src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(out); out.connect(ac.destination);
  src.start(); lfo.start(); lfo2.start();
  out.gain.setTargetAtTime(0.9, ac.currentTime, 1.2);
  MAR = { src, lfo, lfo2, out };
}
document.addEventListener('visibilitychange', () => { try { marAmbiente(); } catch(e){} });

/* =====================================================================
   FUNDO ASMR — ondas lentas no fundo do ecrã e bolhas que sobem devagar.
   Toca numa bolha para a rebentar (som «pop» e vibração, se estiverem ligados).
   Ao acertar, o mar ondula e sobem bolhas novas. Durante a matéria, o fundo fica mais discreto.
   ===================================================================== */
const FUNDO = (() => {
  let cv, g, W = 0, H = 0, raf = 0, last = 0, t = 0, onda = 0, reduz = false, pronto = false, escuro = false;
  let bolhas = [], pops = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const nova = y => ({ x:rnd(0, W), y:y == null ? rnd(0, H) : y, r:rnd(5, 20), v:rnd(9, 22), f:rnd(.5, 1.3), p:rnd(0, 6.28) });
  const ONDAS = ['120,200,222', '70,165,196', '30,120,155'];

  function iniciar(){
    try {
      cv = document.createElement('canvas'); cv.id = 'fundo'; cv.setAttribute('aria-hidden', 'true');
      document.body.insertBefore(cv, document.body.firstChild);
      g = cv.getContext('2d'); if (!g) return;
    } catch(e){ return; }
    try {
      const mq = matchMedia('(prefers-reduced-motion: reduce)'); reduz = mq.matches;
      const md = matchMedia('(prefers-color-scheme: dark)'); escuro = md.matches;
      const muda = () => { reduz = mq.matches; escuro = md.matches; aplicar(); };
      [mq, md].forEach(q => { if (q.addEventListener) q.addEventListener('change', muda); else if (q.addListener) q.addListener(muda); });
    } catch(e){}
    addEventListener('resize', medir);
    document.addEventListener('visibilitychange', aplicar);
    document.addEventListener('pointerdown', toque, { passive:true });
    pronto = true; medir();
    bolhas = Array.from({ length:16 }, () => nova());
    aplicar();
  }

  function medir(){
    if (!pronto) return;
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    bolhas.forEach(b => { if (b.x > W) b.x = rnd(0, W); });
    if (S.def.fundo) desenhar();
  }

  function desenhar(){
    if (!pronto || !W) return;
    g.clearRect(0, 0, W, H);
    // três camadas de ondas, lentas, no fundo do ecrã
    for (let k = 0; k < 3; k++){
      const amp = (8 + k * 4) * (1 + onda * 1.5), y0 = H * (0.82 + k * 0.055);
      g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W + 12; x += 12) g.lineTo(x, y0 + Math.sin(x * 0.011 + t * (0.45 + k * 0.17) + k * 1.7) * amp + Math.sin(x * 0.025 - t * 0.3 + k) * amp * 0.4);
      g.lineTo(W, H); g.closePath();
      g.fillStyle = 'rgba(' + ONDAS[k] + ',' + ((escuro ? 0.16 : 0.11) + k * 0.08) + ')'; g.fill();
    }
    // bolhas
    const traco = escuro ? '220,245,255' : '40,130,160';
    bolhas.forEach(b => {
      const x = b.x + Math.sin(t * b.f + b.p) * 7, y = b.y;
      const rg = g.createRadialGradient(x - b.r * .3, y - b.r * .3, b.r * .1, x, y, b.r);
      rg.addColorStop(0, 'rgba(255,255,255,0.05)'); rg.addColorStop(.8, 'rgba(' + traco + ',0.08)'); rg.addColorStop(1, 'rgba(' + traco + ',0.22)');
      g.fillStyle = rg; g.beginPath(); g.arc(x, y, b.r, 0, 6.2832); g.fill();
      g.strokeStyle = 'rgba(' + traco + ',0.45)'; g.lineWidth = 1.2; g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.85)'; g.beginPath(); g.ellipse(x - b.r * .38, y - b.r * .42, b.r * .2, b.r * .11, -0.7, 0, 6.2832); g.fill();
    });
    // bolhas a rebentar: anel que alarga e gotinhas
    pops.forEach(p => {
      const k = Math.min(1, (t - p.t) / 0.45), a = 1 - k;
      g.strokeStyle = 'rgba(' + traco + ',' + (0.6 * a) + ')'; g.lineWidth = 2 * a + .5;
      g.beginPath(); g.arc(p.x, p.y, p.r * (1 + k * 1.4), 0, 6.2832); g.stroke();
      g.fillStyle = 'rgba(' + traco + ',' + (0.7 * a) + ')';
      for (let i = 0; i < 7; i++){ const an = i / 7 * 6.2832 + p.r; g.beginPath(); g.arc(p.x + Math.cos(an) * p.r * (1 + k * 2.2), p.y + Math.sin(an) * p.r * (1 + k * 2.2), 2.2 * a + .3, 0, 6.2832); g.fill(); }
    });
  }

  function frame(ts){
    raf = requestAnimationFrame(frame);
    if (!last){ last = ts; return; }
    if (ts - last < 33) return; // ~30 fps chega para movimento lento e poupa bateria
    const dt = Math.min(0.06, (ts - last) / 1000); last = ts; t += dt;
    onda *= Math.pow(0.3, dt);
    for (let i = bolhas.length - 1; i >= 0; i--){
      const b = bolhas[i]; b.y -= b.v * dt * (1 + onda);
      if (b.y < -30){ if (b.extra) bolhas.splice(i, 1); else bolhas[i] = nova(H + 30); }
    }
    pops = pops.filter(p => t - p.t < 0.45);
    desenhar();
  }
  function parar(){ if (raf) cancelAnimationFrame(raf); raf = 0; last = 0; }

  function aplicar(){
    if (!pronto) return;
    const on = !!S.def.fundo;
    document.body.classList.toggle('com-fundo', on);
    cv.hidden = !on;
    if (on && !reduz && !document.hidden){ if (!raf) raf = requestAnimationFrame(frame); }
    else { parar(); if (on) desenhar(); }
  }

  // Ao acertar: o mar ondula e sobem umas bolhas mais rápidas
  function squishTodos(){
    if (!pronto || !raf) return;
    onda = 1;
    for (let i = 0; i < 6; i++) bolhas.push(Object.assign(nova(H + rnd(10, 90)), { r:rnd(4, 10), v:rnd(70, 120), extra:true }));
  }
  function toque(e){
    if (!raf || !e.target || !e.target.closest) return;
    if (e.target.closest('button, a, input, select, textarea, label, .q, .mini, .res, .player, .mundo, .acao, .sp-card, .face, .playbar, .hero, .rodape, .aviso, .sheet, .confirma, .plano, .dobra, .continuar')) return;
    let alvo = -1, melhor = 1e9;
    bolhas.forEach((b, i) => { const x = b.x + Math.sin(t * b.f + b.p) * 7, d = Math.hypot(e.clientX - x, e.clientY - b.y); if (d < b.r + 18 && d < melhor){ melhor = d; alvo = i; } });
    if (alvo < 0) return;
    const b = bolhas[alvo];
    pops.push({ x:b.x + Math.sin(t * b.f + b.p) * 7, y:b.y, r:b.r, t });
    if (b.extra) bolhas.splice(alvo, 1); else bolhas[alvo] = nova(H + 30);
    somSquish(); vibrar(8);
  }

  return { iniciar, aplicar, squishTodos };
})();

FUNDO.iniciar();
inicio();
if ('serviceWorker' in navigator && location.protocol !== 'file:'){ addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
