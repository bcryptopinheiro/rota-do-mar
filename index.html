    { id:'m1-10', m:1, s:1, t:'mc', q:'A ZEE portuguesa divide-se em três áreas:', o:['Continente, Açores e Madeira','Norte, Centro e Sul','Mar territorial, zona contígua e alto mar','Atlântico, Mediterrâneo e Índico'], e:'A ZEE reparte-se por Continente, Açores e Madeira.' },
    { id:'m1-11', m:1, s:2, t:'mc', q:'Se a proposta de alargamento da plataforma continental for aprovada pela ONU…', o:['97% do território português passará a ser mar','Portugal passará a ter soberania total sobre a água até às 350 mn','o mar territorial português passará das 12 para as 24 milhas náuticas','a ZEE dos Açores e da Madeira deixará de pertencer a Portugal'], e:'O manual (p. 243) diz que, se aprovada, 97% do território português passará a ser mar, com direito exclusivo à exploração dos recursos do fundo.' },
    { id:'m1-12', m:1, s:2, t:'mc', q:'A proposta portuguesa de alargamento da plataforma continental para lá das 200 mn foi apresentada à ONU em…', o:['2009, e reformulada em 2017','1982, e reformulada em 2009','2017, e aprovada em 2021','1986, quando Portugal entrou na CEE'], e:'Foi apresentada em 2009 e reformulada em 2017 (manual, p. 243).' },
    { id:'m1-13', m:1, s:2, t:'mc', q:'Duas atividades que podem ganhar potencial com o alargamento da plataforma continental são…', o:['a exploração de recursos minerais do fundo e a biotecnologia marinha','a pesca do largo em águas internacionais e o turismo de praia no Algarve','a aquicultura nas rias e a salicultura nas salinas do Centro e do Algarve','a construção de portos de pesca e de esporões ao longo do litoral continental'], e:'O alargamento dá direitos sobre o solo e subsolo marinhos: recursos minerais, biotecnologia, investigação.' },
    { id:'m1-14', m:1, s:1, t:'vf', q:'A zona contígua vai das 12 às 24 milhas náuticas.', a:true, e:'Verdadeiro: a zona contígua fica entre o fim do mar territorial (12 mn) e as 24 mn.' },
    { id:'m1-15', m:1, s:1, t:'vf', q:'Na ZEE, o Estado costeiro tem soberania total, tal como no mar territorial.', a:false, e:'Falso: na ZEE tem direitos de exploração, investigação e gestão dos recursos, não soberania total.' },
    { id:'m1-16', m:1, s:0, t:'vf', q:'As distâncias das zonas marítimas medem-se a partir da linha de base, que corresponde à linha da baixa-mar.', a:true, e:'Verdadeiro: a linha de base é a linha da baixa-mar (maré baixa).' },
    { id:'m1-17', m:1, s:2, t:'vf', q:'A plataforma continental, no sentido jurídico, inclui a coluna de água.', a:false, e:'Falso: inclui só o leito (solo) e o subsolo marinhos.' },
    { id:'m1-18', m:1, s:0, t:'vf', q:'Segundo o manual, Portugal é o Estado costeiro da União Europeia com maior extensão de zonas marítimas.', a:true, e:'Verdadeiro (manual, p. 242).' },
    { id:'m1-19', m:1, s:2, t:'vf', q:'A plataforma continental geológica pode chegar aos 2000 m de profundidade.', a:false, e:'Falso: no sentido geológico, a profundidade máxima é de 200 m.' },
    { id:'m1-20', m:1, s:1, t:'completa', q:'O mar territorial vai até às ___ milhas náuticas.', o:['12','24','200','6'], e:'O mar territorial vai até às 12 mn: aí o Estado tem soberania sobre o fundo, a água e o espaço aéreo.' },
    { id:'m1-21', m:1, s:1, t:'completa', q:'A ZEE termina nas ___ milhas náuticas.', o:['200','24','12','350'], e:'A ZEE vai do limite do mar territorial até às 200 mn (cerca de 370 km).' },
    { id:'m1-22', m:1, s:1, t:'completa', q:'Na ___, o Estado pode fiscalizar infrações às suas leis entre as 12 e as 24 mn.', o:['zona contígua','ZEE','plataforma continental','linha de base'], e:'Zona contígua: das 12 às 24 mn, o Estado pode fiscalizar para prevenir ou reprimir infrações às suas leis.' },
    { id:'m1-23', m:1, s:2, t:'mc', q:'Analisa as afirmações:\nI. O mar territorial inclui o espaço aéreo sobrejacente.\nII. A zona contígua começa na linha de base.\nIII. A ZEE inclui o solo e o subsolo marinhos e a coluna de água.\nIV. A plataforma continental jurídica pode ir para lá das 200 mn.\nSeleciona a opção correta.', o:['I, III e IV','I e II','II e III','II, III e IV'], e:'II é falsa: a zona contígua começa nas 12 mn. As outras estão certas.' },
    { id:'m1-24', m:1, s:1, t:'mc', doc:'zonas', q:'No esquema, o número 2 corresponde à…', o:['zona contígua','zona económica exclusiva','plataforma continental','linha de base'], e:'Da costa para o largo: 1 mar territorial, 2 zona contígua, 3 ZEE, 4 alto mar.' },

    /* ---------------- Mundo 2: linha de costa e ação do mar ---------------- */
    { id:'m2-01', m:2, s:1, t:'mc', destaque:true, q:'No Continente, predomina a costa…', o:['de arriba (rochosa)','de praia (arenosa)','de fajãs e deltas lávicos','de ilhas-barreira e lagunas'], e:'Segundo o manual, no Continente predomina a costa de arriba, talhada em rochas duras (granito, xisto, calcário).' },
    { id:'m2-02', m:2, s:0, t:'mc', q:'A linha de costa portuguesa tem, no Continente, cerca de…', o:['1200 km','600 km','2600 km','5000 km'], e:'Cerca de 1200 km no Continente e 1360 km nos arquipélagos (cerca de 2600 km no total).' },
    { id:'m2-03', m:2, s:1, t:'mc', destaque:true, q:'Podemos indicar como troços de costa de arriba e de costa de praia, respetivamente:', o:['o barlavento e o sotavento algarvios','o sotavento e o barlavento algarvios','de Espinho a São Pedro de Moel e o barlavento algarvio','o estuário do Tejo e o cabo de São Vicente'], e:'Exercício do manual (p. 254): o barlavento algarvio é costa de arriba; o sotavento é costa de praia.' },
    { id:'m2-04', m:2, s:1, t:'mc', q:'A costa de praia (litoral baixo) é predominante…', o:['de Espinho a São Pedro de Moel','da Nazaré à foz do Tejo','do cabo de Sines ao de São Vicente','no barlavento algarvio'], e:'Litoral baixo: Espinho–São Pedro de Moel, estuário do Tejo, foz do Sado–Sines e sotavento algarvio.' },
    { id:'m2-05', m:2, s:1, t:'mc', q:'A costa de arriba alta e escarpada surge…', o:['do cabo de Sines ao de São Vicente','de Espinho a São Pedro de Moel','no sotavento algarvio, até Vila Real de Santo António','da foz do Sado até ao cabo de Sines'], e:'Arriba alta: Nazaré–foz do Tejo, cabo Espichel–foz do Sado, cabo de Sines–São Vicente e barlavento algarvio.' },
    { id:'m2-06', m:2, s:1, t:'mc', q:'Entre Caminha e Esposende, a costa é…', o:['de arriba baixa ou rochas, numa estreita faixa de costa de emersão','de arriba alta e escarpada de calcário, como no barlavento algarvio','de praia, com ilhas-barreira e lagunas de água salobra','de costa de submersão, formada pelo avanço recente do mar'], e:'De Caminha a Esposende há arriba baixa ou rochas: uma estreita faixa de costa de emersão.' },
    { id:'m2-07', m:2, s:2, t:'mc', destaque:true, q:'A abrasão marinha é…', o:['a erosão marinha reforçada pelo arremesso de areia e fragmentos rochosos contra as arribas','a acumulação de areias e seixos na base das arribas, que forma as praias','o transporte de areias ao longo da costa pela aproximação oblíqua das ondas','o recuo do mar que faz emergir áreas antes submersas, formando costas de emersão'], e:'Abrasão marinha: as ondas atiram areia e pedras contra a arriba e desgastam-na, como uma lixa.' },
    { id:'m2-08', m:2, s:2, t:'mc', q:'As três etapas da erosão marinha são…', o:['desgaste, transporte e acumulação','emersão, submersão e regressão','evaporação, condensação e precipitação','captura, descarga e venda'], e:'Desgaste (as ondas fragmentam as rochas), transporte (ondas e correntes) e acumulação.' },
    { id:'m2-09', m:2, s:2, t:'mc', destaque:true, q:'Uma arriba morta é uma arriba que…', o:['já não está sujeita à abrasão marinha, porque recuou ou o nível do mar baixou','está em contacto direto com o mar e continua a ser desgastada na base','foi totalmente destruída pelo mar e deu lugar a uma plataforma de abrasão','deixou de ter vegetação por causa do pisoteio e da construção no topo'], e:'Arriba morta: deixou de sofrer abrasão marinha.' },
    { id:'m2-10', m:2, s:3, t:'mc', q:'A plataforma de abrasão é…', o:['a faixa entre o mar e a arriba, submersa na maré alta e visível na maré baixa','a zona mais afastada, sempre submersa, onde se acumulam os fragmentos','a parte superior da arriba, que fica sem apoio e acaba por desmoronar-se','a parte submersa da placa continental, até cerca de 200 m de profundidade'], e:'A plataforma de abrasão fica entre o mar e a arriba e emerge na maré baixa.' },
    { id:'m2-11', m:2, s:3, t:'mc', q:'A plataforma de acumulação forma-se com…', o:['fragmentos rochosos acumulados na base da arriba, sempre submersos','areias trazidas pelo vento, que formam dunas junto ao topo da arriba','lava que arrefeceu ao chegar ao mar e formou piscinas naturais','sedimentos dos rios depositados numa laguna atrás de uma restinga'], e:'É a acumulação de fragmentos sempre submersa (D na Fig. 2, p. 246).' },
    { id:'m2-12', m:2, s:4, t:'mc', q:'Os cabos formam-se em rochas…', o:['mais resistentes à abrasão','mais brandas, que recuam depressa','sempre de areia','apenas vulcânicas'], e:'As rochas mais duras recuam mais devagar e ficam salientes: formam cabos.' },
    { id:'m2-13', m:2, s:4, t:'mc', destaque:true, q:'A corrente de deriva litoral é…', o:['uma corrente induzida pela aproximação oblíqua das ondas à praia, que transporta areias ao longo da costa','uma corrente de águas profundas e frias, ricas em nutrientes, que sobe à superfície junto à costa','o ramo da Deriva do Atlântico Norte que passa ao largo de Portugal, de norte para sul','um vento forte de norte que sopra no litoral no verão e afasta as águas superficiais'], e:'A deriva litoral é provocada pelas ondas que chegam de lado (oblíquas) e transporta areias, poluentes e objetos ao longo da costa.' },
    { id:'m2-14', m:2, s:4, t:'mc', q:'Na costa ocidental portuguesa, a deriva litoral transporta as areias sobretudo…', o:['de norte para sul','de sul para norte','de oeste para este','do mar para os rios'], e:'As ondas chegam de noroeste, por isso a deriva é Norte-Sul: os molhes retêm areia a norte e há menos a sul.' },
    { id:'m2-15', m:2, s:4, t:'mc', q:'Uma transgressão marinha acontece quando…', o:['o mar avança e submerge áreas continentais','o mar recua e áreas antes submersas emergem','uma arriba viva deixa de sofrer abrasão marinha','um rio deposita sedimentos e assoreia a sua foz'], e:'Transgressão = o mar avança (costas de submersão). Regressão = o mar recua.' },
    { id:'m2-16', m:2, s:1, t:'mc', q:'Uma costa de emersão é uma área do litoral que…', o:['emergiu por efeito do recuo do mar','foi submersa pelo avanço recente do mar','resultou da acumulação de areias atrás de uma restinga','foi formada por escoadas de lava que chegaram ao mar'], e:'Costa de emersão: emergiu quando o mar recuou (ex.: Caminha–Esposende).' },
    { id:'m2-17', m:2, s:0, t:'mc', q:'Nos Açores e na Madeira predomina…', o:['o litoral de arriba alta, mais irregular','o litoral de praia arenosa, com longos cordões dunares','a costa de emersão de granito, com rochas baixas','o litoral baixo, com ilhas-barreira e lagunas'], e:'Nos arquipélagos predomina a arriba alta; as praias são pouco representativas.' },
    { id:'m2-18', m:2, s:4, t:'mc', q:'As restingas e as ilhas-barreira formam-se por…', o:['acumulação de areias transportadas pelo mar, que assoreiam a foz dos rios e reentrâncias','desgaste das arribas pela abrasão marinha, que as faz recuar e formar baías','escoadas de lava que arrefecem ao chegar ao mar e formam deltas lávicos','subida de águas profundas e frias que trazem sedimentos do fundo do mar'], e:'São formas de acumulação: a deriva deposita areias e forma cordões, atrás dos quais ficam lagunas.' },
    { id:'m2-19', m:2, s:1, t:'vf', q:'A costa de praia forma-se em relevo baixo e em rochas mais brandas, como arenitos e argilas.', a:true, e:'Verdadeiro (manual, p. 245).' },
    { id:'m2-20', m:2, s:1, t:'vf', q:'No Continente, a costa de praia ocupa maior extensão do que a costa de arriba.', a:false, e:'Falso: predomina a costa de arriba; a de praia ocupa menor extensão.' },
    { id:'m2-21', m:2, s:2, t:'vf', q:'A abrasão marinha provoca o recuo das arribas vivas.', a:true, e:'Verdadeiro: desgasta a base, a parte de cima desmorona-se e a arriba recua.' },
    { id:'m2-22', m:2, s:4, t:'vf', q:'As enseadas e pequenas baías formam-se nas rochas de maior dureza.', a:false, e:'Falso: formam-se nas rochas de menor dureza, que recuam mais depressa.' },
    { id:'m2-23', m:2, s:0, t:'vf', q:'A linha de costa portuguesa é predominantemente alta e pouco recortada.', a:true, e:'Verdadeiro (manual, p. 244).' },
    { id:'m2-24', m:2, s:2, t:'vf', q:'O desgaste provocado pelo mar é maior nas formações rochosas mais duras.', a:false, e:'Falso: o desgaste é maior nas formações mais brandas.' },
    { id:'m2-25', m:2, s:2, t:'completa', q:'A ___ marinha é a erosão reforçada pelo arremesso de areias e fragmentos contra as arribas.', o:['abrasão','regressão','transgressão','deriva'], e:'Abrasão marinha: as ondas atiram areia e fragmentos contra a arriba e desgastam-na como uma lixa.' },
    { id:'m2-26', m:2, s:2, t:'completa', q:'A arriba que já não sofre abrasão marinha chama-se arriba ___.', o:['morta','viva','baixa','de emersão'], e:'Arriba morta: recuou ou o nível do mar baixou, e o mar já não a desgasta.' },
    { id:'m2-27', m:2, s:4, t:'completa', q:'A corrente de ___ litoral é induzida pela chegada oblíqua das ondas à praia.', o:['deriva','compensação','Portugal','Canárias'], e:'Deriva litoral: as ondas chegam de lado à praia e empurram as areias ao longo da costa.' },
    { id:'m2-28', m:2, s:3, t:'mc', q:'Ordena as etapas do recuo de uma arriba viva:\n1. A parte superior desmorona-se.\n2. A abrasão desgasta a base.\n3. Forma-se a plataforma de abrasão.', o:['2 – 1 – 3','1 – 2 – 3','3 – 2 – 1','2 – 3 – 1'], e:'Primeiro a abrasão desgasta a base, depois a parte de cima cai, e os fragmentos formam a plataforma de abrasão.' },
    { id:'m2-29', m:2, s:3, t:'mc', doc:'arriba', q:'No esquema, o número 2 assinala…', o:['a plataforma de abrasão','a plataforma de acumulação','uma arriba morta','uma restinga'], e:'O 2 é a faixa entre a arriba e o mar, visível na maré baixa: plataforma de abrasão.' },

    /* ---------------- Mundo 3: acidentes do litoral e portos ---------------- */
    { id:'m3-01', m:3, s:0, t:'mc', destaque:true, q:'A ria de Aveiro é…', o:['um sistema lagunar separado do mar por uma extensa restinga','uma pequena ilha ligada ao Continente por um istmo de areias e seixos','um antigo golfo cuja entrada ficou apertada, em forma de concha','o estuário largo do rio Mondego, abrigado pelo cabo Mondego'], e:'A ria de Aveiro é um sistema lagunar de água salobra, na foz do Vouga, separado do mar por uma restinga.' },
    { id:'m3-02', m:3, s:0, t:'mc', destaque:true, q:'O tômbolo de Peniche resultou…', o:['da acumulação de areias e seixos que ligou uma pequena ilha ao Continente','do recuo de uma arriba de calcário, que deixou uma ilha isolada no mar','de uma escoada de lava que avançou sobre o mar e se ligou à costa','da construção de um molhe para abrigar o porto de pesca do cabo Carvoeiro'], e:'Peniche era uma ilha; a acumulação de areias e seixos formou um istmo que a ligou ao Continente.' },
    { id:'m3-03', m:3, s:0, t:'mc', q:'A concha de São Martinho do Porto é…', o:['um antigo golfo cuja entrada ficou mais apertada pela deposição de areias e seixos','um sistema lagunar de restingas e ilhas-barreira, formado por sedimentos marinhos','uma arriba morta que deixou de sofrer abrasão porque o mar recuou','o estuário de um rio, reserva da Rede Natura 2000 com aves migratórias'], e:'Resultou da deposição de areias e seixos na entrada de um antigo golfo: hoje é uma pequena baía em forma de concha.' },
    { id:'m3-04', m:3, s:0, t:'mc', destaque:true, q:'A ria Formosa (ou de Faro) é…', o:['um sistema lagunar de restingas e ilhas-barreira, formado pela acumulação de sedimentos marinhos','uma baía em forma de concha, formada num antigo golfo cuja entrada ficou apertada','o estuário do rio Guadiana, com boas condições para um porto de mar abrigado','um conjunto de fajãs detríticas formadas pelos materiais caídos das vertentes'], e:'É um sistema lagunar de restingas e ilhas-barreira; boas condições para pesca, aquicultura e salicultura.' },
    { id:'m3-05', m:3, s:0, t:'mc', q:'Os estuários do Tejo e do Sado são importantes porque…', o:['são áreas abrigadas e reservas naturais com aves migratórias, com boas condições para portos','têm as arribas mais altas do país e o upwelling mais forte durante o verão','foram formados pela acumulação de areias que ligou uma ilha ao Continente','são as únicas zonas da costa onde a pesca é proibida durante todo o ano'], e:'São reservas da Rede Natura 2000 e áreas abrigadas, com portos como Lisboa e Setúbal.' },
    { id:'m3-06', m:3, s:1, t:'mc', q:'Uma fajã é…', o:['um terreno plano à beira-mar, formado por materiais desprendidos das vertentes (ou por lava)','uma reentrância formada em rochas brandas, que recuam mais depressa do que as duras','uma praia de areia branca com cordão dunar, típica do Porto Santo','uma ponta de terra que avança para o mar, formada nas rochas mais resistentes'], e:'As fajãs são típicas dos arquipélagos; em São Jorge há mais de 70.' },
    { id:'m3-07', m:3, s:1, t:'mc', q:'O delta lávico do Seixal (Madeira) é…', o:['uma escoada de lava que avançou sobre o mar','um cordão de areia branca com dunas','um antigo golfo em forma de concha','um istmo de areias e seixos que liga uma ilha'], e:'Formou-se por uma escoada de lava que arrefeceu ao chegar ao mar.' },
    { id:'m3-08', m:3, s:1, t:'mc', q:'O vulcão dos Capelinhos…', o:['emergiu do mar em 1957 e acrescentou terra à ilha do Faial','formou a ria de Aveiro, ao assorear a foz do rio Vouga','é uma arriba alta de calcário no barlavento algarvio','fica no Porto Santo e formou a sua praia de areia branca'], e:'A erupção de 1957 fez crescer a ilha do Faial (Açores).' },
    { id:'m3-09', m:3, s:1, t:'mc', q:'No Porto Santo destaca-se…', o:['uma praia de areia branca com cordão dunar','uma praia de areia escura, de basalto e lava','uma ria com restingas e ilhas-barreira','um tômbolo que liga duas ilhas vulcânicas'], e:'Ao contrário das outras ilhas, o Porto Santo tem uma praia de areia branca e o seu cordão dunar.' },
    { id:'m3-10', m:3, s:2, t:'mc', destaque:true, q:'A maioria dos portos de mar do Continente localiza-se…', o:['no flanco sul dos cabos, abrigados dos ventos de oeste e noroeste','no flanco norte dos cabos, para receberem diretamente os ventos de noroeste','em troços de arriba alta, onde a água é mais profunda junto à costa','longe dos estuários, para evitar o assoreamento causado pelos rios'], e:'Como a costa é pouco recortada e exposta, os portos procuram abrigo a sul dos cabos (e em estuários e lagunas).' },
    { id:'m3-11', m:3, s:2, t:'mc', q:'O porto de Sesimbra é abrigado pelo…', o:['cabo Espichel','cabo Mondego','cabo de São Vicente','cabo Carvoeiro'], e:'Exemplo do manual: «O cabo Espichel abriga o porto de Sesimbra.»' },
    { id:'m3-12', m:3, s:2, t:'mc', q:'O porto de Peniche é abrigado pelo…', o:['cabo Carvoeiro','cabo da Roca','cabo Espichel','cabo de Santa Maria'], e:'O cabo Carvoeiro protege Peniche dos ventos e vagas de noroeste.' },
    { id:'m3-13', m:3, s:2, t:'mc', q:'O porto da Figueira da Foz é abrigado pelo…', o:['cabo Mondego','cabo de Sines','cabo Carvoeiro','cabo da Roca'], e:'O cabo Mondego fica a norte da Figueira da Foz.' },
    { id:'m3-14', m:3, s:2, t:'mc', q:'Porque é que muitos portos precisaram de pontões e molhes?', o:['Porque a costa é pouco recortada e muito exposta a ventos e vagas fortes','Porque a costa é muito recortada e cheia de baías naturalmente abrigadas','Porque o upwelling arrefece demasiado a água junto aos portos no verão','Porque a plataforma continental é muito larga e os barcos encalham'], e:'Há poucos abrigos naturais, por isso constroem-se infraestruturas de proteção.' },
    { id:'m3-15', m:3, s:0, t:'vf', q:'A ria de Aveiro resultou do recuo do mar e da acumulação de sedimentos marinhos e fluviais.', a:true, e:'Verdadeiro (manual, p. 249; também no exercício 3, IV, da p. 254).' },
    { id:'m3-16', m:3, s:0, t:'vf', q:'O tômbolo de Peniche é uma escoada de lava.', a:false, e:'Falso: é um istmo de areias e seixos que liga uma antiga ilha ao Continente.' },
    { id:'m3-17', m:3, s:1, t:'vf', q:'Nos arquipélagos, a costa alta e rochosa é mais recortada do que a do Continente.', a:true, e:'Verdadeiro (manual, p. 248).' },
    { id:'m3-18', m:3, s:2, t:'vf', q:'Os portos do Continente localizam-se sobretudo no flanco norte dos cabos.', a:false, e:'Falso: no flanco sul, protegidos dos ventos de oeste e noroeste.' },
    { id:'m3-19', m:3, s:0, t:'vf', q:'A ria Formosa tem boas condições para a pesca, a aquicultura e a salicultura.', a:true, e:'Verdadeiro (manual, p. 249).' },
    { id:'m3-20', m:3, s:0, t:'completa', q:'Peniche era uma pequena ilha, hoje ligada ao Continente por um ___.', o:['tômbolo','estuário','talude','delta lávico'], e:'Tômbolo (istmo de areias e seixos).' },
    { id:'m3-21', m:3, s:0, t:'completa', q:'A ria de Aveiro está separada do mar por uma extensa ___.', o:['restinga','arriba','fajã','plataforma de abrasão'], e:'Restinga: um cordão de areia preso à terra que separa a laguna (ria) do mar.' },
    { id:'m3-22', m:3, s:2, t:'completa', q:'Os portos procuram o flanco ___ dos cabos.', o:['sul','norte','oeste','interior'], e:'Sul (abrigo dos ventos de oeste e noroeste).' },
    { id:'m3-23', m:3, s:0, t:'mc', q:'Associa: «ria de Aveiro» → qual o processo de formação?', o:['Recuo do mar e acumulação de sedimentos','Erupção vulcânica e escoada lávica','Erosão das vertentes e queda de materiais','Recuo das arribas por abrasão marinha'], e:'Exercício da p. 249: ria de Aveiro → recuo do mar e acumulação de sedimentos.' },
    { id:'m3-24', m:3, s:0, t:'mc', doc:'acidentes', q:'No mapa, o número 3 assinala…', o:['o tômbolo de Peniche','a ria de Aveiro','o estuário do Sado','a concha de São Martinho do Porto'], e:'O 3 é Peniche, a antiga ilha ligada ao Continente.' },

    /* ---------------- Mundo 4: fatores da abundância de pescado ---------------- */
    { id:'m4-01', m:4, s:0, t:'mc', destaque:true, q:'O plâncton é…', o:['o conjunto de organismos microscópicos, vegetais (fitoplâncton) ou animais (zooplâncton), base da cadeia alimentar marinha','o conjunto de peixes pequenos, como a sardinha e o biqueirão, que vivem em grandes cardumes perto da costa','a matéria mineral que os rios levam para o mar e que se deposita no fundo da plataforma continental','a corrente de águas frias e profundas, carregada de nutrientes, que sobe à superfície no verão'], e:'O plâncton é a base da cadeia alimentar marinha.' },
    { id:'m4-02', m:4, s:1, t:'mc', destaque:true, q:'As plataformas continentais são ricas em pescado porque…', o:['têm pouca profundidade (mais luz), águas agitadas (mais oxigénio) e recebem água doce dos rios (nutrientes)','têm grande profundidade, águas calmas e pouco oxigénio, onde os peixes se escondem dos predadores','ficam longe da costa, sem receber água doce dos rios, e por isso a água é mais salgada','são zonas de águas quentes vindas do Golfo do México, muito ricas em nutrientes'], e:'Luz, oxigénio e nutrientes favorecem o plâncton e, por isso, o peixe.' },
    { id:'m4-03', m:4, s:1, t:'mc', q:'Em Portugal continental, a plataforma continental…', o:['é estreita (30 a 70 km), mais larga ao largo do cabo da Roca','é muito larga, tal como no noroeste da Europa, com mais de 200 km','é mais larga no Algarve e quase inexistente ao largo do cabo da Roca','tem a mesma largura em todo o litoral, cerca de 10 km'], e:'É estreita, com 30 a 70 km, e atinge a maior extensão ao largo do cabo da Roca.' },
    { id:'m4-04', m:4, s:1, t:'mc', q:'Nos Açores e na Madeira, a plataforma continental é quase inexistente porque…', o:['as ilhas são de origem vulcânica (topos de uma cordilheira submarina)','a água à volta das ilhas é muito quente e pobre em nutrientes','os rios das ilhas trazem muitos sedimentos que enchem o fundo do mar','a abrasão marinha destruiu a plataforma que existia à volta das ilhas'], e:'A origem vulcânica faz com que o fundo desça muito depressa junto às ilhas.' },
    { id:'m4-05', m:4, s:1, t:'mc', destaque:true, q:'A plataforma continental estreita é, para a pesca em Portugal, um fator…', o:['desfavorável, porque reduz a zona de abundância de pescado','muito favorável, porque se atingem grandes profundidades','indiferente, porque o peixe vive todo nas águas profundas','favorável, porque concentra o peixe numa faixa estreita'], e:'É desfavorável: temos uma pequena zona de abundância de pescado.' },
    { id:'m4-06', m:4, s:2, t:'mc', q:'Uma corrente marítima é…', o:['a deslocação de grandes massas de água com idênticas características de temperatura e densidade','o movimento diário de subida e descida do nível do mar, provocado pela atração da Lua','um vento forte e constante que sopra junto à costa durante o verão, vindo de norte','a subida de águas do fundo, que só acontece quando há tempestades no inverno'], e:'Definição do manual (p. 252).' },
    { id:'m4-07', m:4, s:2, t:'mc', q:'As correntes frias são mais favoráveis ao pescado porque…', o:['têm origem na subida das águas e arrastam matéria do fundo, sendo ricas em nutrientes','são mais salgadas e por isso têm mais minerais dissolvidos para o plâncton','têm menos oxigénio, o que obriga os peixes a juntarem-se em cardumes','aquecem rapidamente junto à costa e aceleram o crescimento dos peixes'], e:'As correntes frias trazem nutrientes do fundo.' },
    { id:'m4-08', m:4, s:2, t:'mc', destaque:true, q:'Segundo o manual, a Corrente de Portugal…', o:['é um ramo da Deriva do Atlântico Norte, quente e pobre em nutrientes','é uma corrente fria vinda do Ártico, muito rica em nutrientes','é provocada pela nortada e só existe durante o verão','é o ramo da corrente das Canárias que sobe para norte ao longo da costa'], e:'O manual (pp. 252–253) diz que é uma corrente quente e superficial, pobre em nutrientes: fator desfavorável.' },
    { id:'m4-09', m:4, s:2, t:'mc', q:'A sudoeste do território, a Corrente de Portugal junta-se…', o:['à corrente fria das Canárias, o que é favorável à pesca','à corrente do Golfo, o que torna as águas mais quentes e pobres','à corrente do Labrador, o que é desfavorável à pesca','à deriva litoral, que leva os nutrientes para o largo'], e:'A confluência com a corrente fria das Canárias aumenta a agitação, a oxigenação e os nutrientes.' },
    { id:'m4-10', m:4, s:3, t:'mc', destaque:true, q:'A nortada é…', o:['um vento forte de norte que sopra no litoral, sobretudo no verão','uma corrente de águas profundas que sobe à superfície no verão','um vento quente de sul que sopra sobretudo no inverno, no Algarve','a corrente que transporta areias de sul para norte ao longo da costa'], e:'A nortada é o vento forte de norte, típico do verão na costa ocidental.' },
    { id:'m4-11', m:4, s:3, t:'mc', q:'A situação meteorológica que dá origem à nortada, no verão, é…', o:['o anticiclone dos Açores a norte/oeste e uma depressão térmica no interior da Península Ibérica','uma depressão sobre os Açores e um anticiclone sobre o interior da Península Ibérica','a passagem de superfícies frontais frias vindas de noroeste, típica do inverno','o encontro da corrente quente de Portugal com a corrente fria das Canárias'], e:'O ar vai das altas pressões (anticiclone dos Açores) para as baixas pressões (depressão térmica ibérica) e sopra de norte na costa. Atenção: isto não está nas páginas do manual que vimos.' },
    { id:'m4-12', m:4, s:3, t:'mc', destaque:true, q:'O upwelling (afloramento costeiro) é…', o:['uma corrente de águas profundas e frias, carregadas de nutrientes, que sobe à superfície','uma corrente quente vinda do Golfo do México, que passa ao largo de Portugal','a acumulação de areias na foz de um rio, que forma restingas e lagunas','um vento forte de norte que sopra no litoral ocidental durante o verão'], e:'Definição do manual (p. 253).' },
    { id:'m4-13', m:4, s:3, t:'mc', destaque:true, q:'O upwelling acontece na costa portuguesa porque…', o:['a nortada afasta as águas superficiais para o largo e as águas profundas sobem para as substituir','as ondas chegam oblíquas à praia e arrastam a água fria do fundo para a costa','a plataforma continental é muito larga e deixa subir a água dos rios para o largo','a corrente quente de Portugal empurra as águas profundas para junto da costa no inverno'], e:'A nortada empurra a água de cima para o largo; sobe uma corrente de compensação de águas profundas.' },
    { id:'m4-14', m:4, s:3, t:'mc', q:'O upwelling é, para a pesca, um fator…', o:['muito favorável: aumenta o volume e a qualidade do pescado','desfavorável: arrefece demasiado a água e afasta os cardumes','indiferente: só muda a temperatura da água nas praias','desfavorável: traz água pobre em nutrientes do fundo'], e:'Muito favorável: por exemplo, a sardinha fica mais gorda e saborosa no verão.' },
    { id:'m4-15', m:4, s:3, t:'mc', q:'No verão, a temperatura da água junto à costa ocidental é mais baixa do que ao largo por causa…', o:['do upwelling provocado pela nortada','da corrente de Portugal, vinda do Ártico','da água doce que os rios trazem no verão','da plataforma continental estreita'], e:'As águas frias do fundo sobem junto à costa.' },
    { id:'m4-16', m:4, s:1, t:'mc', q:'Do litoral para o largo, a sequência do relevo do fundo é…', o:['plataforma continental, talude continental, planície abissal','talude continental, plataforma continental, planície abissal','planície abissal, talude, plataforma','plataforma, planície abissal, talude'], e:'Plataforma (até 200 m) → talude (descida forte) → planície abissal.' },
    { id:'m4-17', m:4, s:1, t:'mc', q:'Os canhões submarinos são…', o:['vales profundos que cortam os taludes continentais','correntes frias que descem pelo talude até ao fundo','ilhas vulcânicas submersas no meio do oceano','cordões de areia que fecham a entrada das lagunas'], e:'Os taludes portugueses são sulcados por canhões submarinos (ex.: Nazaré).' },
    { id:'m4-18', m:4, s:3, t:'mc', q:'Analisa as afirmações:\nI. No litoral continental predomina a costa rochosa e de arriba alta, pouco recortada e com fracas condições de abrigo para os portos.\nII. Ao largo da costa passa a corrente quente de Portugal, com origem na Deriva do Atlântico Norte, que se junta à corrente fria das Canárias.\nIII. A plataforma continental portuguesa é estreita, o que é favorável à pesca.\nIV. A ria de Aveiro formou-se pelo recuo do mar e pela acumulação de sedimentos marinhos.\nV. O upwelling, no verão, é um fator favorável à pesca.\nSeleciona a opção que reúne as afirmações corretas.', o:['I, II, IV e V','I, II, III e V','II, III e IV','I, II e V'], e:'Exercício 3 da p. 254: a III é falsa (a plataforma estreita é desfavorável). Resposta C do manual.' },
    { id:'m4-19', m:4, s:1, t:'vf', q:'Cerca de 80% das capturas mundiais fazem-se nas plataformas continentais.', a:true, e:'Verdadeiro (manual, p. 252).' },
    { id:'m4-20', m:4, s:2, t:'vf', q:'As correntes quentes são muito favoráveis à formação de plâncton.', a:false, e:'Falso: as correntes quentes são pouco favoráveis.' },
    { id:'m4-21', m:4, s:2, t:'vf', q:'Na confluência de uma corrente fria com uma quente há maior agitação e oxigenação das águas.', a:true, e:'Verdadeiro: por isso forma-se mais plâncton.' },
    { id:'m4-22', m:4, s:3, t:'vf', q:'O upwelling ocorre sobretudo no inverno.', a:false, e:'Falso: ocorre no verão, com a nortada.' },
    { id:'m4-23', m:4, s:1, t:'vf', q:'A água doce dos rios traz nutrientes minerais e orgânicos para a plataforma continental.', a:true, e:'Verdadeiro: também reduz o teor de sal.' },
    { id:'m4-24', m:4, s:3, t:'completa', q:'A ___ é o vento forte de norte que provoca o upwelling no verão.', o:['nortada','deriva litoral','corrente das Canárias','brisa marítima'], e:'Nortada: vento forte de norte, no verão, que afasta a água superficial para o largo.' },
    { id:'m4-25', m:4, s:0, t:'completa', q:'O ___ é a base da cadeia alimentar marinha.', o:['plâncton','talude','cardume','canhão'], e:'Plâncton: organismos microscópicos (fitoplâncton e zooplâncton) de que dependem os peixes.' },
    { id:'m4-26', m:4, s:3, t:'mc', doc:'upwelling', q:'O esquema representa…', o:['o upwelling: a nortada afasta a água superficial e sobem águas profundas frias','a deriva litoral: as ondas chegam oblíquas e transportam areias ao longo da costa','o recuo de uma arriba: a abrasão desgasta a base e a parte de cima desmorona-se','a formação de um tômbolo: a acumulação de areias liga uma ilha ao Continente'], e:'É o esquema do upwelling (p. 253 e exercício 5 da p. 254).' },

    /* ---------------- Mundo 5: o setor das pescas ---------------- */
    { id:'m5-01', m:5, s:2, t:'mc', destaque:true, q:'A pesca local caracteriza-se por…', o:['pequenas embarcações (menos de 9 m), artes artesanais e águas interiores ou perto da costa','navios de 100 GT ou mais, com autonomia de pelo menos 15 dias, em águas internacionais','embarcações de 9 a 33 m que operam além das 6 milhas, com meios modernos de deteção','o apoio de navios-congeladores e navios-fábrica que transformam o pescado no mar'], e:'Pesca local: barcos pequenos, artes artesanais (anzol, armadilhas, pequenas redes), curtos períodos.' },
    { id:'m5-02', m:5, s:2, t:'mc', destaque:true, q:'A pesca costeira…', o:['opera além das 6 milhas, com embarcações de 9 a 33 m e meios modernos de deteção e captura','opera só em rios, estuários e lagoas, com pequenas embarcações e artes artesanais','opera em águas internacionais durante meses, com apoio de navios-fábrica','usa só barcos com menos de 9 m e pesca apenas em certas épocas do ano'], e:'Pesca costeira: além das 6 mn, horas ou dias de navegação, barcos de 9 a 33 m.' },
    { id:'m5-03', m:5, s:2, t:'mc', destaque:true, q:'A pesca do largo…', o:['opera para lá das 12 milhas, em águas internacionais e ZEE estrangeiras, com navios de 100 GT ou mais','opera em águas interiores e perto da costa, com barcos de menos de 9 m e artes artesanais','opera além das 6 milhas, a poucas horas do porto, com barcos de 9 a 33 m e sem meios de conservação','pesca só dentro do mar territorial português, por curtos períodos e apenas no verão'], e:'Pesca do largo: navios grandes, autonomia de pelo menos 15 dias, apoio de navio-congelador ou navio-fábrica.' },
    { id:'m5-04', m:5, s:2, t:'mc', q:'Associa cada tipo de pesca às características:\nA – a. local; b. costeira; c. do largo.\nB – 1. Opera além das 6 milhas, a horas ou dias do porto. 2. Opera para lá das 12 milhas, com autonomia de 15 dias. 3. Embarcações de 9 a 33 m com meios de conservação. 4. Apoio de navio-congelador ou navio-fábrica. 5. Captura espécies de maior valor com artes específicas.', o:['(a: 5); (b: 1 e 3); (c: 2 e 4)','(a: 1 e 3); (b: 5); (c: 2 e 4)','(a: 4); (b: 1 e 3); (c: 2 e 5)','(a: 2 e 4); (b: 1 e 3); (c: 5)'], e:'Exercício 2 da p. 270: resposta A.' },
    { id:'m5-05', m:5, s:1, t:'mc', destaque:true, q:'Segundo o manual (dados de 2019), a espécie com maior volume de capturas foi…', o:['a cavala','a sardinha','o polvo','o bacalhau'], e:'Em 2019: 1.º cavala, 2.º carapau, 3.º atuns, 4.º sardinha, 5.º biqueirão. (Em 2024, segundo o INE, a sardinha voltou ao 1.º lugar.)' },
    { id:'m5-06', m:5, s:1, t:'mc', destaque:true, q:'Segundo o manual, as espécies que geram maior valor são…', o:['os polvos, seguidos dos atuns','a cavala, seguida do carapau','a sardinha, seguida do biqueirão','o bacalhau, seguido da pescada'], e:'Em valor lideram os polvos, sobretudo pela forma de captura com armadilhas, e depois os atuns.' },
    { id:'m5-07', m:5, s:1, t:'mc', q:'O polvo tem um valor tão alto porque…', o:['é capturado com armadilhas (alcatruzes), técnica especializada que exige mais mão de obra, em capturas pouco volumosas','é pescado em grandes quantidades com redes de arrasto pelo fundo, o que exige barcos de grande dimensão e muito combustível','vem quase todo da aquicultura intensiva, alimentada com rações artificiais caras','é quase todo importado, porque não existe na costa portuguesa nem nas ilhas'], e:'O polvo pesca-se com armadilhas (alcatruzes): técnica especializada, muita mão de obra e pouca quantidade, por isso o preço é alto (p. 259).' },
    { id:'m5-08', m:5, s:1, t:'mc', q:'Em 2019, a sardinha aparecia apenas em 4.º lugar em volume porque…', o:['os stocks diminuíram e há restrições à sua captura (quotas desde 2018)','deixou de haver procura e os pescadores passaram a preferir a cavala','passou a ser quase toda criada em aquicultura, em regime intensivo','só pode ser pescada nos Açores e na Madeira, por causa das quotas'], e:'A redução dos stocks e as restrições à captura fizeram a sardinha perder os primeiros lugares.' },
    { id:'m5-09', m:5, s:1, t:'mc', q:'As quotas de pesca são…', o:['limites às capturas de uma espécie','impostos pagos por cada quilo de peixe vendido','licenças para construir novos portos de pesca','apoios europeus para comprar barcos'], e:'Quotas = limites às capturas (ex.: sardinha desde 2018, bacalhau desde 2021).' },
    { id:'m5-10', m:5, s:0, t:'mc', destaque:true, q:'No âmbito da Política Comum das Pescas, Portugal…', o:['pode pescar nas ZEE comunitárias e em pesqueiros externos, cumprindo os acordos com países terceiros','só pode pescar no seu mar territorial, porque as ZEE dos outros Estados-membros são exclusivas','deixou de ter quotas de pesca, porque a UE passou a dividir o peixe por todos os países em partes iguais','não pode pescar fora da sua ZEE, nem em águas internacionais, para proteger os stocks europeus'], e:'A PCP abre as águas comunitárias e permite acordos com países terceiros.' },
    { id:'m5-11', m:5, s:0, t:'mc', destaque:true, q:'Os acordos de pesca com outros países são importantes porque…', o:['diversificam as áreas de pesca e compensam os recursos limitados da ZEE portuguesa','permitem pescar sem regras nem quotas nas águas de outros países','aumentam a plataforma continental portuguesa e a área da nossa ZEE','obrigam os outros países a comprar o peixe capturado pela frota portuguesa'], e:'A costa regular e a plataforma estreita limitam a pesca; os acordos dão acesso a outros pesqueiros.' },
    { id:'m5-12', m:5, s:0, t:'mc', q:'A frota portuguesa opera sobretudo…', o:['no Atlântico Nordeste (áreas do ICES e da CECAF)','no Mar Mediterrâneo e no Mar Negro','no Oceano Índico e no Pacífico','sobretudo no Atlântico Sul, junto à Antártida'], e:'Manual, p. 257. Também pesca no Atlântico Noroeste (NAFO), por exemplo cantarilho e bacalhau.' },
    { id:'m5-13', m:5, s:0, t:'mc', q:'O FEAMP é…', o:['o Fundo Europeu dos Assuntos Marítimos e das Pescas, que financia a PCP','o plano que ordena os usos e as atividades do espaço marítimo português','a convenção das Nações Unidas que define as zonas marítimas dos Estados','o centro de formação profissional que dá cursos nos portos de pesca'], e:'O FEAMP apoia a modernização, a sustentabilidade e os pequenos pescadores.' },
    { id:'m5-14', m:5, s:3, t:'mc', destaque:true, q:'A frota de pesca portuguesa caracteriza-se por…', o:['predominarem as embarcações de pequena dimensão e de pesca local','predominarem os navios-fábrica e os grandes arrastões da pesca do largo','ter cada vez mais embarcações, porque os stocks estão a aumentar','ser quase toda formada por embarcações sem motor e sem meios de conservação'], e:'Cerca de 90% têm menos de 5 GT; predominam as de pesca local.' },
    { id:'m5-15', m:5, s:3, t:'mc', q:'A arqueação bruta (GT) mede…', o:['o volume interno total do navio','a velocidade do navio','o número de pescadores a bordo','a quantidade de peixe capturada'], e:'Arqueação bruta: volume interno total do casco e dos espaços; 1 GT = 2,832 m³.' },
    { id:'m5-16', m:5, s:3, t:'mc', destaque:true, q:'A população ativa na pesca caracteriza-se por…', o:['estar mais envelhecida e ter menos escolaridade do que a média nacional','ser muito jovem e ter mais escolaridade do que a média nacional','estar a aumentar muito, sobretudo no Alentejo e na Madeira','ter a mesma idade média e escolaridade que o resto da população ativa'], e:'Isso reduz a capacidade de inovar, de arriscar e de aderir aos programas de apoio.' },
    { id:'m5-17', m:5, s:3, t:'mc', q:'O Norte e o Centro têm mais pescadores matriculados porque…', o:['têm mais portos e embarcações','têm a plataforma continental mais larga do mundo','não têm quotas','têm aquicultura intensiva'], e:'O Norte e o Centro têm mais portos e embarcações, por isso também mais pescadores matriculados (p. 262).' },
    { id:'m5-18', m:5, s:4, t:'mc', q:'A lota é…', o:['o local onde se faz o leilão e a primeira venda do pescado','o armazém onde se guarda e vende o material de pesca (apresto)','o tanque onde se cria peixe em regime intensivo','o navio que congela e transforma o pescado em alto-mar'], e:'A rede de lotas tem sistemas eletrónicos que tornam a venda mais rápida e transparente.' },
    { id:'m5-19', m:5, s:4, t:'mc', q:'Nos portos de pesca, a conservação do pescado é garantida por…', o:['venda de gelo e entreposto frigorífico','armazém e venda de apresto','posto de combustíveis e serviços administrativos','lota e mercado de segunda venda'], e:'Gelo e entreposto frigorífico conservam o peixe.' },
    { id:'m5-20', m:5, s:4, t:'mc', q:'A regulamentação e fiscalização da descarga do pescado servem para garantir…', o:['a segurança alimentar, o cumprimento das quotas e dos tamanhos mínimos de desembarque','preços mais altos para os compradores e mais lucro para os armadores','que o pescado seja todo exportado para outros países da UE, onde é vendido a preços mais altos','o aumento do número de barcos e de pescadores em cada porto de pesca'], e:'A fiscalização na descarga garante a segurança alimentar e o cumprimento das quotas e dos tamanhos mínimos (p. 264).' },
    { id:'m5-21', m:5, s:3, t:'mc', q:'Muitas embarcações de pesca têm sido reconvertidas para…', o:['atividades de turismo (mergulho, observação de espécies, passeios)','transporte de mercadorias entre os portos do Continente e as ilhas','navios-fábrica que apoiam a pesca do largo em águas internacionais','barcos de vigilância da pesca ilegal ao serviço da Marinha'], e:'Muitas embarcações passaram a fazer mergulho, observação de espécies marinhas e passeios (p. 261).' },
    { id:'m5-22', m:5, s:4, t:'mc', q:'Analisa as afirmações:\nI. A contribuição do setor da pesca para a economia nacional tem aumentado.\nII. No âmbito da PCP, Portugal pode capturar em pesqueiros externos, cumprindo normas dos acordos com países terceiros.\nIII. A pesca local tende a pescar espécies de maior valor, sobretudo com armadilhas.\nIV. Tem-se verificado a reconversão de embarcações de pesca para o turismo.\nV. A aquicultura tem tradição em Portugal, sendo o Algarve a região de maior produção, em regime extensivo.\nSeleciona a opção correta.', o:['II, III, IV e V','I, II, IV e V','I, III e IV','II, III e V'], e:'Exercício 1 da p. 270: a I é falsa (a contribuição tem decrescido). Resposta B.' },
    { id:'m5-23', m:5, s:1, t:'mc', q:'O ranking correto das espécies com maior volume de capturas (manual, 2019) é…', o:['1.º cavala, 2.º carapau, 3.º atuns, 4.º sardinha, 5.º biqueirão','1.º polvos, 2.º atuns, 3.º carapau-negrão, 4.º sardinha, 5.º cavala','1.º sardinha, 2.º cavala, 3.º carapau, 4.º atuns, 5.º polvo','1.º bacalhau, 2.º sardinha, 3.º polvo, 4.º atuns, 5.º cavala'], e:'Exercício 3 da p. 270: opção A.' },
    { id:'m5-24', m:5, s:2, t:'vf', q:'A pesca local opera por curtos períodos ou apenas sazonalmente.', a:true, e:'Verdadeiro: a pesca local faz-se por curtos períodos ou só em certas épocas do ano.' },
    { id:'m5-25', m:5, s:2, t:'vf', q:'A pesca do largo tem quase sempre o apoio de um navio-congelador e/ou de um navio-fábrica.', a:true, e:'Verdadeiro: o navio-congelador ou navio-fábrica conserva e transforma o pescado no mar.' },
    { id:'m5-26', m:5, s:1, t:'vf', q:'O valor das capturas tem tendência para diminuir.', a:false, e:'Falso: o valor tende a aumentar (sobe o preço das espécies protegidas e capturam-se espécies de maior valor).' },
    { id:'m5-27', m:5, s:3, t:'vf', q:'A frota nacional tem vindo a diminuir, para se adequar aos recursos disponíveis.', a:true, e:'Verdadeiro: os stocks são vulneráveis.' },
    { id:'m5-28', m:5, s:3, t:'vf', q:'Os pescadores portugueses têm, em média, mais escolaridade do que a população em geral.', a:false, e:'Falso: têm níveis de escolaridade inferiores à média nacional.' },
    { id:'m5-29', m:5, s:2, t:'vf', q:'A pesca costeira opera com embarcações de 9 a 33 metros.', a:true, e:'Verdadeiro: a pesca costeira usa barcos de 9 a 33 m, com meios modernos de deteção e captura.' },
    { id:'m5-30', m:5, s:2, t:'vf', q:'A sardinha é capturada sobretudo com a arte do arrasto.', a:false, e:'Falso: 98% da sardinha é capturada com o cerco (Doc. «Luta desigual», p. 271).' },
    { id:'m5-31', m:5, s:2, t:'completa', q:'A pesca ___ opera para lá das 12 milhas, em águas internacionais e ZEE estrangeiras.', o:['do largo','local','costeira','artesanal'], e:'Pesca do largo: navios de 100 GT ou mais, longe da costa, durante semanas ou meses.' },
    { id:'m5-32', m:5, s:4, t:'completa', q:'A ___ é o local onde se faz o leilão e a primeira venda do pescado.', o:['lota','salina','doca seca','fajã'], e:'Lota: é aí que se faz o leilão (primeira venda) do pescado, com sistemas eletrónicos.' },
    { id:'m5-33', m:5, s:1, t:'completa', q:'Em valor, a espécie que lidera é o ___.', o:['polvo','carapau','biqueirão','cantarilho'], e:'Polvo: lidera em valor, por causa da captura com alcatruzes, que exige muita mão de obra (p. 259).' },
    { id:'m5-34', m:5, s:1, t:'mc', doc:'especies2019', q:'Segundo o documento, a espécie com maior volume de capturas em 2019 foi…', o:['a cavala','o carapau','a sardinha','o biqueirão'], e:'Cavala: 46 314 t, muito à frente do carapau (17 168 t).' },
    { id:'m5-35', m:5, s:1, t:'mc', doc:'especies2019', q:'Segundo o documento, em que lugar ficou a sardinha em volume?', o:['4.º','1.º','2.º','5.º'], e:'4.º, atrás da cavala, do carapau e dos atuns.' },
    { id:'m5-36', m:5, s:1, t:'mc', doc:'especies2024', q:'Comparando este documento (2024) com os dados do manual (2019), conclui-se que…', o:['a sardinha passou a ser a espécie mais capturada','a cavala continuou a ser a espécie mais capturada','o polvo passou a ser a espécie mais capturada','o carapau passou a ser a espécie mais capturada'], e:'Em 2024 a sardinha teve 31,4% das capturas de peixes marinhos, à frente da cavala (18,0%).' },
    { id:'m5-37', m:5, s:2, t:'mc', doc:'artes2024', q:'Segundo o documento, a arte de pesca responsável pela maior parte das capturas é…', o:['o cerco','o arrasto','a polivalente','o palangre'], e:'O cerco, com 51,7% das capturas (sardinha, cavala, carapau).' },
    { id:'m5-38', m:5, s:3, t:'mc', doc:'frota2019', q:'O documento mostra que…', o:['a grande maioria das embarcações tem menos de 5 GT','a maioria das embarcações tem mais de 100 GT','há quase tantas embarcações grandes como pequenas','as embarcações de 5 a 25 GT são as mais numerosas'], e:'6517 embarcações têm menos de 5 GT: predominam os barcos pequenos.' },
    { id:'m5-39', m:5, s:3, t:'mc', doc:'idades2019', q:'Segundo o documento, o grupo etário predominante entre os ativos da pesca é…', o:['35 a 54 anos','16 a 34 anos','55 anos e mais','menos de 16 anos'], e:'56,6% têm 35 a 54 anos. Atenção: há ligeiramente mais pessoas com 55 anos e mais (21,9%) do que com 16 a 34 anos (21,5%).' },
    { id:'m5-40', m:5, s:3, t:'mc', doc:'pescadores', q:'O texto refere que a população ativa na pesca…', o:['tem diminuído, tem baixa qualificação e idade avançada, o que dificulta a modernização','tem aumentado e rejuvenescido, com cada vez mais jovens qualificados','tem diminuído, mas é jovem e muito qualificada, o que facilita a inovação e a modernização do setor','não influencia a inovação do setor, que depende só dos apoios europeus'], e:'Menos ativos, mais velhos e menos qualificados: o setor inova e moderniza-se mais devagar.' },

    { id:'m5-41', m:5, s:1, t:'mc', doc:'especies2019', q:'Segundo o documento, o volume de capturas de cavala foi, aproximadamente…', o:['quase o triplo do de carapau','o dobro do de sardinha','igual à soma do carapau e dos atuns','metade do de carapau'], e:'46 314 ÷ 17 168 ≈ 2,7: quase o triplo do carapau. (A cavala foi quase 5 vezes a sardinha, e o carapau mais os atuns somam 27 154 t.)' },
    { id:'m5-42', m:5, s:1, t:'mc', doc:'especies2019', q:'Segundo o documento, a diferença entre o volume de atuns e o de sardinha foi de cerca de…', o:['300 toneladas','3 000 toneladas','30 000 toneladas','9 600 toneladas'], e:'9 986 − 9 670 = 316 t: cerca de 300 toneladas. Atuns e sardinha tiveram volumes muito parecidos.' },
    { id:'m5-43', m:5, s:1, t:'mc', doc:'especies2024', q:'Segundo o documento, em 2024 a sardinha representou cerca de…', o:['um terço das capturas de peixes marinhos','metade das capturas de peixes marinhos','um décimo das capturas de peixes marinhos','dois terços das capturas de peixes marinhos'], e:'31,4% ≈ um terço (33%).' },
    { id:'m5-44', m:5, s:2, t:'mc', doc:'artes2024', q:'Segundo o documento, em conjunto, o cerco e a pesca polivalente representaram…', o:['cerca de 90% das capturas','menos de metade das capturas','cerca de 60% das capturas','a totalidade das capturas'], e:'51,7% + 38,3% = 90%. O arrasto ficou com os restantes 9,9%.' },
    { id:'m5-45', m:5, s:2, t:'mc', doc:'artes2024', q:'Segundo o documento, o cerco capturou, aproximadamente…', o:['cinco vezes mais do que o arrasto','o dobro do arrasto','dez vezes mais do que o arrasto','o mesmo que o arrasto'], e:'51,7 ÷ 9,9 ≈ 5,2: cerca de cinco vezes mais.' },
    { id:'m5-46', m:5, s:3, t:'mc', doc:'frota2019', q:'Segundo o documento, as embarcações com menos de 5 GT são cerca de…', o:['8 vezes mais do que as de 5 a 25 GT','2 vezes mais do que as de 5 a 25 GT','80 vezes mais do que as de 5 a 25 GT','tantas como as de 5 a 25 GT'], e:'6 517 ÷ 813 ≈ 8.' },
    { id:'m5-47', m:5, s:3, t:'mc', doc:'frota2019', q:'Somando todas as classes do documento, as embarcações com menos de 5 GT representam…', o:['mais de três quartos do total','menos de metade do total','cerca de um terço do total','exatamente metade do total'], e:'Total = 6 517 + 813 + 152 + 118 + 168 = 7 768; 6 517 ÷ 7 768 ≈ 84%, mais de três quartos.' },
    { id:'m5-48', m:5, s:3, t:'mc', doc:'idades2019', q:'Segundo o documento, os ativos da pesca com menos de 35 anos ou com 55 e mais anos são, em conjunto…', o:['menos de metade do total','mais de metade do total','exatamente metade do total','cerca de três quartos do total'], e:'21,5% + 21,9% = 43,4%: menos de metade. A maioria (56,6%) tem 35 a 54 anos.' },
    /* ---------------- Mundo 6: aquicultura, indústria, salicultura e sustentabilidade ---------------- */
    { id:'m6-01', m:6, s:0, t:'mc', destaque:true, q:'A aquicultura é…', o:['a criação de organismos aquáticos com processos que aumentam a produção do meio natural','a produção de sal marinho por evaporação da água do mar em salinas','a pesca com armadilhas, como os alcatruzes, em águas interiores e perto da costa','a transformação do pescado em congelados, conservas e produtos secos e salgados'], e:'Definição do manual (p. 266).' },
    { id:'m6-02', m:6, s:0, t:'mc', destaque:true, q:'Uma vantagem da aquicultura é…', o:['reduzir a pressão sobre os recursos marinhos, favorecendo a sua recuperação','aumentar a pesca de juvenis, porque os peixes crescem mais depressa','dispensar regras ambientais, porque a produção é feita em tanques fechados','acabar com a necessidade de lotas, porque o peixe é vendido diretamente'], e:'É uma forma alternativa de obter pescado e permite repovoar habitats.' },
    { id:'m6-03', m:6, s:0, t:'mc', q:'As áreas com melhores condições para a aquicultura em Portugal são…', o:['as rias de Aveiro e de Faro','as arribas da Costa Vicentina','o alto mar dos Açores','as serras do interior'], e:'Água salobra, movimento de marés e muitos nutrientes.' },
    { id:'m6-04', m:6, s:0, t:'mc', destaque:true, q:'No regime extensivo de aquicultura…', o:['a alimentação é exclusivamente natural e o impacte ambiental é pequeno','a alimentação é exclusivamente artificial e há controlo total das condições','o peixe recebe alimento natural e também suplementos artificiais','produzem-se sobretudo peixes, como pregado e robalo, na Madeira'], e:'Extensivo: práticas tradicionais, alimento natural, pouco impacte (moluscos, Algarve).' },
    { id:'m6-05', m:6, s:0, t:'mc', q:'No regime intensivo de aquicultura…', o:['há controlo total e a alimentação é exclusivamente artificial, com forte impacte ambiental','a alimentação é exclusivamente natural e o impacte no ambiente é muito pequeno','não há interferência humana no ambiente onde as espécies se desenvolvem','produzem-se sobretudo amêijoas e ostras, nas rias do Algarve, com pouco impacte ambiental'], e:'Intensivo: ração artificial, resíduos, sobretudo peixes (pregado, dourada, robalo), na Madeira e no Centro.' },
    { id:'m6-06', m:6, s:0, t:'mc', q:'No regime semi-intensivo, as espécies…', o:['consomem alimento natural e também suplementos artificiais','só comem ração artificial, com controlo total das condições','só comem o alimento natural que existe na água','comem apenas o alimento que a maré traz, sem qualquer suplemento'], e:'Semi-intensivo = natural + suplementos.' },
    { id:'m6-07', m:6, s:0, t:'mc', q:'Em Portugal, na aquicultura, predomina…', o:['o regime extensivo, com produção de moluscos (amêijoas e ostras), sobretudo no Algarve','o regime intensivo de peixes, como o pregado e a dourada, sobretudo no Alentejo','a aquicultura em água doce, com trutas, nos rios do interior do país','o regime semi-intensivo de algas, sobretudo nos Açores e na Madeira'], e:'Manual, p. 267: predomina o extensivo, embora o intensivo tenda a aumentar.' },
    { id:'m6-08', m:6, s:0, t:'mc', q:'Um problema ambiental da aquicultura é…', o:['a poluição por efluentes não tratados e a fuga de espécies invasoras','o aumento dos stocks selvagens, que obriga a pescar mais','a criação de praias artificiais junto às rias, que atraem turistas','o arrefecimento da água das rias, por causa da circulação nos tanques'], e:'Na aquicultura, os efluentes não tratados poluem as águas e as espécies que fogem podem ser invasoras (p. 276).' },
    { id:'m6-09', m:6, s:1, t:'mc', destaque:true, q:'O subsetor da indústria transformadora com maior produção é o dos…', o:['congelados','preparados e conservas','secos e salgados','fumados'], e:'Os congelados são o subsetor mais recente e já estão em 1.º lugar (mais de 50%).' },
    { id:'m6-10', m:6, s:1, t:'mc', destaque:true, q:'O subsetor dos preparados e conservas destaca-se por…', o:['ser o único com saldo comercial positivo (exporta mais do que importa)','ser o que mais produz, com mais de metade da produção da indústria','trabalhar quase só bacalhau, de que Portugal é o maior consumidor mundial','ser o subsetor mais recente, com produtos congelados em alto-mar'], e:'Produz menos, mas é o 2.º em valor e o único com saldo positivo (atum e sardinha).' },
    { id:'m6-11', m:6, s:1, t:'mc', q:'A salga e secagem é quase totalmente de…', o:['bacalhau','sardinha','polvo','atum'], e:'Portugal é o maior consumidor mundial de bacalhau.' },
    { id:'m6-12', m:6, s:1, t:'mc', q:'A indústria transformadora do pescado tem maior implantação…', o:['no Norte e no Centro','no Alentejo e no Algarve','na Madeira e nos Açores','na Área Metropolitana de Lisboa'], e:'A indústria transformadora do pescado está sobretudo no Norte e no Centro, onde gera emprego e riqueza (p. 268).' },
    { id:'m6-13', m:6, s:2, t:'mc', destaque:true, q:'A salicultura é…', o:['a produção de sal marinho por evaporação solar, em salinas','a criação de peixe e marisco em água salgada ou salobra','a extração de sal-gema em minas no interior do país','a dessalinização da água do mar para obter água potável'], e:'Sal marinho por evaporação da água do mar ao sol.' },
    { id:'m6-14', m:6, s:2, t:'mc', q:'A principal região produtora de sal marinho é o Algarve, por causa…', o:['da exposição a sul e das temperaturas mais altas','das arribas altas, que protegem as salinas do vento','da nortada, que sopra com mais força no Algarve','da plataforma continental mais larga do país'], e:'O calor e o sol aceleram a evaporação.' },
    { id:'m6-15', m:6, s:2, t:'mc', q:'A flor de sal é…', o:['cristais leves que flutuam, recolhidos à mão; o sal mais requintado','o sal produzido com meios mecânicos em salinas modernas, o mais barato','o sal-gema extraído das minas, moído em cristais muito finos','o sal marinho comum a que se acrescenta iodo para a alimentação'], e:'Flor de sal: recolhida manualmente, o sal mais requintado e saudável (segundo o manual).' },
    { id:'m6-16', m:6, s:2, t:'mc', q:'O sal marinho comum (97% da produção)…', o:['vem de salinas modernas com meios mecânicos e é o mais barato','é recolhido à mão em salinas tradicionais e é o mais requintado','são cristais leves que flutuam e se recolhem à mão','é quase todo importado, porque as salinas portuguesas fecharam'], e:'O sal marinho comum vem de salinas modernas com meios mecânicos e é o mais barato (p. 269).' },
    { id:'m6-17', m:6, s:2, t:'mc', q:'A salicultura tem perdido salinas sobretudo por…', o:['falta de mão de obra','falta de sol','excesso de chuva no Algarve','proibição da UE'], e:'É uma atividade tradicional com pouca mão de obra disponível.' },
    { id:'m6-18', m:6, s:3, t:'mc', destaque:true, q:'A época de defeso é…', o:['um período em que é proibido capturar uma espécie, para ela se reproduzir','a época do ano em que se pesca mais, porque os cardumes estão perto da costa','o período de férias obrigatórias dos pescadores, pago pela União Europeia','o tempo em que o pescado fica em leilão na lota antes de ser vendido'], e:'Na sardinha, o defeso é entre dezembro e abril, conforme a zona da costa.' },
    { id:'m6-19', m:6, s:3, t:'mc', q:'O tamanho mínimo de desembarque serve para…', o:['proteger os peixes jovens (juvenis), que ainda não se reproduziram','aumentar o preço do peixe grande, que é o mais procurado nas lotas','facilitar o transporte e a conservação do pescado no gelo','limitar o número de barcos que podem pescar cada espécie'], e:'Na sardinha, o tamanho mínimo é 11 cm.' },
    { id:'m6-20', m:6, s:3, t:'mc', destaque:true, q:'Qual destas é uma medida de gestão sustentável dos recursos piscícolas?', o:['Respeitar as quotas e as épocas de defeso','Aumentar a pesca de juvenis','Usar redes com malha cada vez mais pequena','Pescar todos os dias da semana sem limite'], e:'Quotas, defeso, tamanhos mínimos, malhagens e limites às capturas acessórias são medidas sustentáveis.' },
    { id:'m6-21', m:6, s:3, t:'mc', doc:'sardinha', q:'Segundo o documento, a gestão da pesca da sardinha…', o:['é feita por Portugal e Espanha, com limites à captura anual, ao esforço de pesca e uma época de defeso','é feita só por Portugal, sem limites à captura, mas com tamanho mínimo de desembarque','proíbe a pesca da sardinha durante todo o ano, para que os stocks recuperem','é feita pela Espanha, que fixa o número de barcos portugueses que podem pescar com redes de arrasto'], e:'Plano de Gestão conjunto, máximo de 180 dias de pesca, sem pesca ao fim de semana, defeso e tamanho mínimo de 11 cm.' },
    { id:'m6-22', m:6, s:3, t:'mc', doc:'sardinha', q:'O título «Luta desigual» refere-se, provavelmente, ao facto de…', o:['os cardumes de sardinha enfrentarem uma pesca muito eficaz (cerco e deteção de cardumes)','os pescadores portugueses terem menos barcos do que os espanhóis','a sardinha ser capturada sobretudo com arrasto, uma arte proibida em Portugal','o defeso da sardinha durar todo o ano, enquanto o da cavala dura só um mês'], e:'O cerco captura 98% da sardinha; com tecnologias de deteção, os cardumes ficam em desvantagem: por isso são precisas regras.' },
    { id:'m6-23', m:6, s:0, t:'vf', q:'A aquicultura em Portugal faz-se sobretudo em água doce.', a:false, e:'Falso: faz-se sobretudo em água salobra ou marinha (95%).' },
    { id:'m6-24', m:6, s:0, t:'vf', q:'O número de estabelecimentos de aquicultura diminuiu, mas a produção cresceu.', a:true, e:'Verdadeiro (manual, p. 266).' },
    { id:'m6-25', m:6, s:0, t:'vf', q:'O regime intensivo tem pouco impacte ambiental.', a:false, e:'Falso: tem forte impacte, por causa dos resíduos da ração artificial.' },
    { id:'m6-26', m:6, s:1, t:'vf', q:'Os congelados são o subsetor mais recente da indústria transformadora do pescado.', a:true, e:'Verdadeiro, e já é o 1.º em produção.' },
    { id:'m6-27', m:6, s:2, t:'vf', q:'Em 2019, só havia salinas ativas no Centro e no Algarve.', a:true, e:'Verdadeiro (manual, p. 269).' },
    { id:'m6-28', m:6, s:3, t:'vf', q:'As quotas de pesca da sardinha existem desde 2018.', a:true, e:'Verdadeiro (manual, p. 259).' },
    { id:'m6-29', m:6, s:0, t:'completa', q:'No regime ___ de aquicultura, a alimentação é exclusivamente natural.', o:['extensivo','intensivo','semi-intensivo','industrial'], e:'Extensivo: o alimento é só o natural, com pouco impacte no ambiente.' },
    { id:'m6-30', m:6, s:2, t:'completa', q:'A ___ é a produção de sal marinho por evaporação solar.', o:['salicultura','aquicultura','piscicultura','dessalinização'], e:'Salicultura: o sol evapora a água do mar nas salinas e fica o sal.' },
    { id:'m6-31', m:6, s:3, t:'completa', q:'O período em que é proibido pescar uma espécie para ela se reproduzir chama-se ___.', o:['defeso','quota','lota','arqueação'], e:'Defeso: proibição temporária de pescar uma espécie, na época de reprodução.' },

    /* ---------------- Mundo 7: gestão do litoral e Economia Azul ---------------- */
    { id:'m7-01', m:7, s:0, t:'mc', destaque:true, q:'As obras de proteção da costa, como molhes e esporões, provocam…', o:['acumulação de areias a norte e maior erosão a sul','acumulação de areias a sul e maior erosão a norte','o fim da deriva litoral e de toda a erosão costeira','o aumento das praias em toda a costa, a norte e a sul'], e:'Retêm as areias trazidas pela deriva litoral (de norte para sul): ganha-se areia a norte e perde-se a sul.' },
    { id:'m7-02', m:7, s:0, t:'mc', destaque:true, q:'As barragens contribuem para a erosão costeira porque…', o:['retêm os sedimentos dos rios, e chega menos areia às praias','aumentam o caudal dos rios, que levam as areias para o largo','trazem mais areia para o mar, que se acumula longe das praias','provocam upwelling junto à foz dos rios, que arrasta as areias'], e:'Os sedimentos ficam na albufeira e as praias «emagrecem».' },
    { id:'m7-03', m:7, s:0, t:'mc', q:'A construção sobre as arribas…', o:['aumenta a sua instabilidade e acelera o desmoronamento e o recuo','protege as arribas da abrasão, porque o peso dos edifícios as segura','transforma as arribas vivas em arribas mortas, que deixam de recuar','não tem efeito, porque o recuo das arribas depende só do mar'], e:'Construir sobre arribas, que já estão em erosão, aumenta a instabilidade e acelera o recuo (p. 276).' },
    { id:'m7-04', m:7, s:0, t:'mc', q:'O pisoteio e a construção nas dunas são um problema porque…', o:['impedem a fixação da vegetação que estabiliza as dunas','aumentam a quantidade de areia que chega às praias','provocam upwelling e arrefecem a água junto à costa','criam novas lagunas atrás das dunas, que inundam as casas'], e:'Sem vegetação, as dunas não seguram a areia nem protegem a terra do mar.' },
    { id:'m7-05', m:7, s:0, t:'mc', q:'A subida do nível médio do mar, por efeito do aquecimento global, pode…', o:['fazer desaparecer praias e reiniciar a erosão em arribas mortas','aumentar a largura das praias, porque o mar traz mais areia','transformar as arribas vivas em arribas mortas, travando o recuo','reduzir a erosão costeira, porque as ondas perdem força'], e:'Com menos sedimentos dos rios e o mar a subir, as praias desaparecem e até arribas mortas podem voltar a ser atacadas (p. 276).' },
    { id:'m7-06', m:7, s:0, t:'mc', q:'A litoralização é…', o:['a concentração da população e das atividades junto ao litoral','a formação de praias pela acumulação de areias trazidas pela deriva','a construção de esporões e paredões para proteger a linha de costa','a recuperação das dunas com passadiços e vegetação'], e:'Com o turismo, aumenta a pressão urbana sobre a linha de costa.' },
    { id:'m7-07', m:7, s:1, t:'mc', destaque:true, q:'Os Programas da Orla Costeira (POC)…', o:['substituíram os POOC e regulam as atividades e usos da orla costeira','gerem as quotas de pesca e as épocas de defeso de cada espécie','definem os limites da ZEE e do mar territorial português','ordenam os usos de todo o espaço marítimo, até às 200 milhas náuticas'], e:'Os POC são mais interventivos do que os antigos Planos de Ordenamento da Orla Costeira.' },
    { id:'m7-08', m:7, s:1, t:'mc', destaque:true, q:'O Plano de Ação Litoral XXI é…', o:['a base para programar as intervenções de gestão integrada da zona costeira','o plano que caracteriza o espaço marítimo e distribui os seus usos e atividades','um fundo europeu que financia a modernização da frota de pesca','o plano que regula o leilão e a venda do pescado nas lotas do Continente'], e:'Da APA (2017): adaptação às alterações climáticas, sedimentos, riscos de erosão.' },
    { id:'m7-09', m:7, s:1, t:'mc', destaque:true, q:'O PSOEM (Plano de Situação do Ordenamento do Espaço Marítimo)…', o:['caracteriza o espaço marítimo e define a distribuição dos seus usos e atividades','regula só os usos das praias e da orla costeira, substituindo os antigos POOC','define o preço do pescado nas lotas e as quotas de pesca de cada espécie','programa as obras de defesa costeira, como esporões e paredões, em cada praia'], e:'Objetivos: Portugal como país atlântico, valorizar o mar na economia, coesão nacional, maior Estado costeiro da UE.' },
    { id:'m7-10', m:7, s:1, t:'mc', q:'Um dos objetivos do PSOEM é…', o:['valorizar Portugal como o maior Estado costeiro da UE','proibir o turismo e os desportos náuticos em todo o litoral','reduzir a ZEE para proteger os recursos marinhos','acabar com a aquicultura nas rias de Aveiro e de Faro'], e:'O PSOEM quer valorizar Portugal como o maior Estado costeiro da UE e como país atlântico (p. 277).' },
    { id:'m7-11', m:7, s:3, t:'mc', destaque:true, q:'A Economia Azul é…', o:['o conjunto das atividades económicas associadas ao mar e aos seus recursos, de forma sustentável','apenas a pesca e a aquicultura, sem contar o turismo nem a energia','o conjunto das atividades ligadas ao mar, desde que sejam feitas por empresas públicas e sem fins lucrativos','o conjunto das atividades económicas do interior do país, ligadas aos rios e às barragens'], e:'Inclui pesca, aquicultura, portos, turismo, energia, biotecnologia, investigação…' },
    { id:'m7-12', m:7, s:2, t:'mc', q:'Uma medida para proteger as dunas é…', o:['construir acessos pedonais sobrelevados (passadiços)','construir casas nas dunas para as fixar com cimento','retirar a vegetação das dunas para facilitar o acesso','abrir estradas e estacionamentos junto à praia'], e:'Os passadiços evitam o pisoteio.' },
    { id:'m7-13', m:7, s:2, t:'mc', q:'O reforço sedimentar consiste em…', o:['colocar areia nas praias para compensar a erosão','construir paredões para suster o avanço do mar','retirar areia das praias para a usar na construção','construir barragens que retêm os sedimentos dos rios'], e:'É uma das medidas contra a erosão costeira (Doc. 3, p. 279).' },
    { id:'m7-14', m:7, s:2, t:'mc', q:'Enrocamentos e paredões são…', o:['proteções rígidas para suster o mar','acessos pedonais sobrelevados às praias','estruturas de aquicultura em mar aberto','areia colocada nas praias para as engordar'], e:'Proteções rígidas (pesadas) da linha de costa.' },
