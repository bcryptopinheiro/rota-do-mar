<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Rota do Mar — Geografia 11.º ano</title>
<meta name="description" content="Jogo para estudar Geografia: os recursos marítimos (litoral, ZEE, pesca, aquicultura e gestão do litoral).">
<meta name="theme-color" content="#E8F2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08171E" media="(prefers-color-scheme: dark)">
<!-- PWA: manifest e ícones (pode ser adicionado ao ecrã principal e funciona sem internet) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rota do Mar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Young+Serif&display=swap">
<style>
/* Layout: uma coluna centrada (máx. 720px); o mapa é um caminho vertical de 7 mundos numerados, como uma rota de boias */
:root{
  --bg:#E8F2F4; --surface:#FFFFFF; --surface-2:#F1F7F8; --ink:#0F2730; --muted:#4D6670; --line:#CFDFE3;
  --accent:#0A6C86; --accent-ink:#FFFFFF; --accent-soft:#D6EEF3;
  --gold:#C98A00; --gold-soft:#FFF1CC; --ok:#0F8456; --ok-soft:#D7F2E5; --bad:#C9372F; --bad-soft:#FBE0DC; --sky:#1C8FB5;
  --land:#E9DFC4; --land-line:#B9A77A; --sea:#CFE8EF; --sea-2:#9FD0DE; --rock:#B79A73;
  --shadow:0 1px 0 rgba(15,39,48,.05), 0 8px 22px -12px rgba(15,39,48,.28);
  --f-display:'Young Serif', Georgia, 'Times New Roman', serif;
  --f-body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r:16px;
  --glass:rgba(255,255,255,.74); --fundo-op:1;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08171E; --surface:#0F2530; --surface-2:#143039; --ink:#E4F1F4; --muted:#93AFB8; --line:#24434E;
  --accent:#5CC6E0; --accent-ink:#06151B; --accent-soft:#163F4C;
  --gold:#FFC93C; --gold-soft:#3B3115; --ok:#3DD09A; --ok-soft:#163A2D; --bad:#FF7D72; --bad-soft:#45201E; --sky:#4CC8E8;
  --land:#3A3526; --land-line:#7A6C48; --sea:#123A47; --sea-2:#1C5566; --rock:#6B5A43;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.7); color-scheme:dark;
  --glass:rgba(15,37,48,.76); --fundo-op:.5; } }
:root[data-theme="dark"]{
  --bg:#08171E; --surface:#0F2530; --surface-2:#143039; --ink:#E4F1F4; --muted:#93AFB8; --line:#24434E;
  --accent:#5CC6E0; --accent-ink:#06151B; --accent-soft:#163F4C;
  --gold:#FFC93C; --gold-soft:#3B3115; --ok:#3DD09A; --ok-soft:#163A2D; --bad:#FF7D72; --bad-soft:#45201E; --sky:#4CC8E8;
  --land:#3A3526; --land-line:#7A6C48; --sea:#123A47; --sea-2:#1C5566; --rock:#6B5A43;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.7); color-scheme:dark;
  --glass:rgba(15,37,48,.76); --fundo-op:.5; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.5; overflow-x:hidden}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--f-display); font-weight:400; text-wrap:balance; margin:0; line-height:1.15}
p{margin:0}
.wrap{max-width:720px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:20px 56px; display:flex; flex-direction:column; gap:22px}
.eyebrow{font-family:var(--f-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}

/* ---------- Início ---------- */
.hero{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:end; padding-top:8px}
.hero h1{font-size:clamp(36px, 9vw, 54px); letter-spacing:-.01em}
.hero h1 .sub{display:block; font-size:.42em; color:var(--muted); margin-top:6px; letter-spacing:0}
.epoche{text-align:right; color:var(--accent)}
.epoche b{display:block; font-family:var(--f-display); font-weight:400; font-size:clamp(30px,7vw,42px); line-height:1}
.epoche span{font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; color:var(--muted)}
@media (max-width:480px){ .hero{grid-template-columns:1fr} .epoche{text-align:left; display:flex; align-items:baseline; gap:10px} .epoche b{font-size:30px} }
.meander{height:12px; color:var(--accent); opacity:.55}
.meander svg{display:block; width:100%; height:12px}

.player{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); padding:16px; display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center}
.lvl{width:58px; height:58px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-family:var(--f-display); font-size:26px}
.player .nm{font-family:var(--f-display); font-size:20px}
.xpbar{height:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-top:6px}
.xpbar i{display:block; height:100%; background:linear-gradient(90deg, var(--gold), var(--accent)); border-radius:99px; transition:width .6s ease}
.player .meta{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-family:var(--f-mono); font-size:12px; color:var(--muted); margin-top:5px; font-variant-numeric:tabular-nums}

.aviso{background:var(--gold-soft); border-radius:12px; padding:12px 14px; font-size:15px}
.aviso b{font-weight:700}

.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.sec-h h2{font-size:24px}

.mapa{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; position:relative}
.mapa::before{content:""; position:absolute; left:31px; top:30px; bottom:30px; border-left:3px dotted var(--line)}
.mundo{position:relative; display:grid; grid-template-columns:64px 1fr; gap:14px; align-items:center; width:100%; text-align:left; background:var(--surface); border:2px solid transparent; border-radius:var(--r); box-shadow:var(--shadow); padding:14px 14px 14px 0; transition:transform .15s ease, border-color .15s}
.mundo:not(:disabled):hover{border-color:var(--accent); transform:translateY(-1px)}
.mundo:disabled{cursor:not-allowed; background:var(--surface-2); box-shadow:none}
.no{justify-self:end; width:52px; height:52px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); font-family:var(--f-display); font-size:26px; line-height:1; position:relative; z-index:1}
.mundo:disabled .no{background:var(--line); color:var(--muted)}
.mundo.feito .no{background:var(--ok); color:var(--surface)}
.mundo .tx{min-width:0; display:flex; flex-direction:column; gap:3px}
.mundo .tt{font-family:var(--f-display); font-size:19px; line-height:1.2}
.mundo .rs{font-size:14px; color:var(--muted)}
.mundo .rw{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:4px}
.stars{display:inline-flex; gap:2px}
.stars svg{width:20px; height:20px; fill:var(--line)}
.stars svg.on{fill:var(--gold)}
.chip{font-family:var(--f-mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:99px; background:var(--accent-soft); color:var(--ink)}
.chip.lock{background:transparent; border:1px solid var(--line); color:var(--muted); display:inline-flex; gap:5px; align-items:center; text-transform:none; letter-spacing:0}
.chip.lock svg{width:12px; height:12px; fill:currentColor}
.pct{font-family:var(--f-mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

.acoes{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
@media (max-width:560px){ .acoes{grid-template-columns:1fr} }
.acao{background:var(--surface); border:2px solid var(--line); border-radius:var(--r); padding:14px; text-align:left; display:flex; flex-direction:column; gap:4px; min-height:92px; transition:border-color .15s, transform .15s}
.acao:hover{border-color:var(--accent); transform:translateY(-1px)}
.acao .t{font-family:var(--f-display); font-size:18px}
.acao .d{font-size:14px; color:var(--muted)}
.acao.final{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.acao.final .d{color:inherit; opacity:.85}
.badge{display:inline-block; min-width:24px; padding:0 7px; border-radius:99px; background:var(--bad); color:var(--surface); font-family:var(--f-mono); font-size:13px; text-align:center; margin-left:6px; vertical-align:2px}

.minis{display:flex; flex-wrap:wrap; gap:8px}
.mini-b{border:1.5px solid var(--line); background:var(--surface); border-radius:99px; padding:10px 14px; font-size:15px; min-height:44px}
.mini-b:hover{border-color:var(--accent)}

.rodape{border-top:1px solid var(--line); padding-top:16px; display:flex; flex-direction:column; gap:10px; font-size:14px; color:var(--muted)}
.rodape .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.link-b{background:none; border:none; padding:6px 0; text-decoration:underline; color:var(--muted); font-size:14px}

/* ---------- Botões ---------- */
.btn{border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 18px; min-height:52px; font-weight:700; font-size:16px; transition:transform .1s, background .15s, border-color .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.btn.big{width:100%; font-size:18px; min-height:58px}
.acts{display:flex; gap:10px; flex-wrap:wrap}
.acts .btn{flex:1 1 180px}

/* ---------- Ecrã de jogo ---------- */
.playbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); display:flex; gap:10px; align-items:center; padding-block:10px}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
.icon-btn{width:44px; height:44px; border-radius:50%; border:2px solid var(--line); background:var(--surface); font-size:18px; display:grid; place-items:center}
.pb-title{font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pb-mid{flex:1; min-width:0}
.bar{height:10px; background:var(--surface); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-top:4px}
.bar i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .35s ease}
.pb-right{display:flex; flex-direction:column; align-items:flex-end; font-family:var(--f-mono); font-size:13px; font-variant-numeric:tabular-nums; min-width:52px}
.pb-combo{color:var(--gold); font-weight:600; font-size:12px; min-height:16px}
.stage{display:flex; flex-direction:column; gap:16px}

.q, .mini{background:var(--surface); border-radius:20px; box-shadow:var(--shadow); padding:20px 18px; display:flex; flex-direction:column; gap:16px}
.tag{font-family:var(--f-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent)}
.qtext{font-size:clamp(22px, 5.4vw, 28px); line-height:1.25; white-space:pre-line}
.qtext.longa{font-size:18px; line-height:1.45; font-family:var(--f-body)}
.lead{color:var(--muted)}
.blank{display:inline-block; min-width:4.5em; border-bottom:3px solid var(--accent); color:transparent; line-height:1}
.blank.filled{color:var(--ok); border-color:var(--ok); padding:0 4px}
.opts{display:flex; flex-direction:column; gap:10px}
.opts.vf{flex-direction:row}
.opts.vf .opt{flex:1; justify-content:center}
.opt{display:flex; align-items:center; gap:12px; text-align:left; width:100%; min-height:56px; padding:12px 14px; border-radius:14px; border:2px solid var(--line); background:var(--surface-2); font-size:17px; transition:border-color .15s, background .15s}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .key{flex:none; width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-family:var(--f-mono); font-size:13px; background:var(--surface); border:1.5px solid var(--line)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .key{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.opt.picked{border-color:var(--accent); background:var(--accent-soft)}
.opt:disabled:not(.right):not(.wrong):not(.picked){opacity:.6}

.fb{border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px}
.fb.is-ok{background:var(--ok-soft)}
.fb.is-bad{background:var(--bad-soft)}
.fb.is-info{background:var(--surface-2)}
.fb-msg{font-weight:700; font-size:18px}
.fb.is-ok .fb-msg{color:var(--ok)}
.fb.is-bad .fb-msg{color:var(--bad)}
.fb-e{font-size:16px}

/* Ordena */
.slots{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.slot{display:grid; grid-template-columns:38px 1fr; gap:10px; align-items:center; min-height:54px; border-radius:12px; border:2px dashed var(--line); padding:6px 8px}
.slot:not(.empty){border-style:solid; background:var(--surface-2)}
.slot.right{border-color:var(--ok); background:var(--ok-soft)}
.slot.wrong{border-color:var(--bad); background:var(--bad-soft)}
.sn{font-family:var(--f-mono); font-weight:600; font-size:13px; color:var(--muted); text-align:center}
.ph{color:var(--muted); font-size:14px}
.slot-b{background:none; border:none; text-align:left; padding:6px 2px; font-size:15px; width:100%}
.slot-b:disabled{cursor:default}
.pecas{display:flex; flex-direction:column; gap:8px}
.peca{text-align:left; border:2px solid var(--accent); background:var(--accent-soft); border-radius:12px; padding:12px 14px; font-size:15px; min-height:52px}
.ordem-certa{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:6px; font-size:15px}

/* Liga */
.lig{display:flex; flex-direction:column; gap:14px}
.col-h{font-family:var(--f-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.lig-a{display:flex; flex-wrap:wrap; gap:8px}
.lig-b{display:flex; flex-direction:column; gap:8px}
.lk{border:2px solid var(--line); background:var(--surface-2); border-radius:12px; padding:10px 14px; min-height:50px; text-align:left; font-size:16px}
.lig-a .lk{font-weight:700}
.lk.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft)}
.lk:disabled{cursor:default}
.lk.m0{border-color:var(--ok); background:var(--ok-soft)}
.lk.m1{border-color:var(--sky); background:var(--surface-2); box-shadow:inset 6px 0 0 var(--sky)}
.lk.m2{border-color:var(--gold); background:var(--gold-soft)}
.lk.m3{border-color:var(--accent); background:var(--accent-soft)}
.lk .pr{font-family:var(--f-mono); font-size:12px; margin-right:6px; color:var(--muted)}

/* Classifica rápido */
.hint{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px}
.sprint{display:flex; flex-direction:column; gap:14px}
.sp-top{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center}
.timer{height:14px; border-radius:99px; background:var(--surface); border:1px solid var(--line); overflow:hidden}
.timer i{display:block; height:100%; background:var(--gold); border-radius:99px}
.sp-time{font-family:var(--f-mono); font-weight:600; font-size:22px; min-width:2.2em; text-align:right; font-variant-numeric:tabular-nums}
.sp-stats{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:14px; color:var(--muted)}
.sp-stats b{color:var(--ink)}
.combo{color:var(--gold); font-weight:600}
.sp-card{background:var(--surface); border-radius:20px; box-shadow:var(--shadow); min-height:170px; display:grid; place-items:center; padding:22px; text-align:center; border:3px solid transparent}
.sp-card p{font-family:var(--f-display); font-size:clamp(22px,5.6vw,30px); line-height:1.25; text-wrap:balance}
.sp-btns{display:grid; gap:10px; grid-template-columns:1fr 1fr}
.sp-btns.n3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:440px){ .sp-btns.n3{grid-template-columns:1fr} }
.sp-b{min-height:66px; font-size:17px}
.sp-b:nth-child(1){border-color:var(--accent)}
.sp-b:nth-child(2){border-color:var(--gold)}
.sp-b:nth-child(3){border-color:var(--sky)}
.lista-err{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:15px}

/* Resultados */
.res{background:var(--surface); border-radius:20px; box-shadow:var(--shadow); padding:24px 18px; display:flex; flex-direction:column; gap:16px; align-items:center; text-align:center}
.res .big{font-family:var(--f-display); font-size:64px; line-height:1}
.res .big small{font-size:.4em; color:var(--muted)}
.res .stars svg{width:44px; height:44px}
.res .stars svg.on{animation:starIn .5s cubic-bezier(.3,1.6,.5,1) both}
.res .stars svg.on:nth-child(2){animation-delay:.15s}
.res .stars svg.on:nth-child(3){animation-delay:.3s}
.res .acts{width:100%}
.stats{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; font-family:var(--f-mono); font-size:13px}
.stats span{background:var(--surface-2); border-radius:99px; padding:6px 12px}
.revlist{display:flex; flex-direction:column; gap:12px; width:100%; text-align:left}
.revitem{border:1.5px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:6px; font-size:15px}
.revitem .qq{font-weight:700; font-size:16px; white-space:pre-line}
.revitem .tu{color:var(--bad)}
.revitem .ce{color:var(--ok)}

/* Cartões */
.filtros{display:flex; gap:8px; flex-wrap:wrap}
.filtros .mini-b.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.cartao{perspective:1000px}
.face{width:100%; min-height:300px; border:none; border-radius:22px; box-shadow:var(--shadow); background:var(--surface); padding:24px 20px; display:flex; flex-direction:column; gap:14px; justify-content:center; text-align:left; transition:transform .16s ease-in}
.face.verso{background:var(--surface-2); border:2px solid var(--accent)}
.face.flip-out{transform:rotateY(90deg)}
.face .ft{font-family:var(--f-display); font-size:clamp(22px,5.6vw,30px); line-height:1.25; white-space:pre-line}
.face .ft.longa{font-size:19px; line-height:1.4}
.face .vt{font-size:17px; white-space:pre-line}
.face .ex{font-size:15px; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px}
.face .ex b{color:var(--ink)}
.face .hint-t{font-family:var(--f-mono); font-size:12px; color:var(--muted)}

/* Toasts */
#toasts{position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 64px); z-index:30; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding-inline:16px}
.toast{background:var(--ink); color:var(--bg); border-radius:99px; padding:8px 16px; font-weight:700; font-size:15px; box-shadow:var(--shadow); animation:toastIn 1.9s ease both; max-width:100%; text-align:center}
.toast.xp{background:var(--gold); color:#1d1600}
.confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:40}

/* Animações */
.pop-in{animation:popIn .25s ease both}
.opt.right, .slot.right{animation:pulse .35s ease}
.opt.wrong, .slot.wrong, .shake{animation:shake .35s ease}
.sp-card.in{animation:popIn .18s ease both}
.sp-card.ok{border-color:var(--ok); animation:popIn .18s ease both}
.sp-card.bad{border-color:var(--bad); animation:shake .3s ease}
@keyframes popIn{from{opacity:.4; transform:translateY(6px) scale(.98)} to{opacity:1; transform:none}}

<script>
/* =====================================================================
   CONTEÚDO — tudo o que é matéria está aqui (segue o Manual do 10.º ano, pp. 242–281).
   Para acrescentar perguntas:
   - Escolha múltipla:  { id:'m2-30', m:2, s:0, t:'mc', q:'Pergunta', o:['CERTA','errada','errada','errada'], e:'Explicação' }
   - Verdadeiro/falso:  { id:'m2-31', m:2, s:0, t:'vf', q:'Afirmação', a:true|false, e:'Explicação' }
   - Completa a frase:  { id:'m2-32', m:2, s:0, t:'completa', q:'Frase com ___ no sítio da palavra', o:['CERTA','errada',...], e:'...' }
   - Com documento:     acrescenta doc:'nome' (um dos CONTEUDO.documentos ou CONTEUDO.figuras): aparece por cima da pergunta.
   A primeira opção de "o" é sempre a certa (as opções são baralhadas no jogo).
   "m" é o número do mundo (1–7) e "s" é a secção da lição desse mundo onde a matéria é explicada
   (a pergunta só aparece no mundo depois dessa parte da matéria). Cada id tem de ser único.
   destaque:true = pergunta essencial; o teste final inclui sempre pelo menos
   "testeFinal.minDestaque" perguntas destas.
   ===================================================================== */
const CONTEUDO = {
  niveis: [
    { xp:0,    nome:'Grumete' },
    { xp:150,  nome:'Marinheiro' },
    { xp:400,  nome:'Pescador da Costa' },
    { xp:800,  nome:'Mestre de Lota' },
    { xp:1300, nome:'Comandante do Largo' },
    { xp:2000, nome:'Almirante da Economia Azul' }
  ],

  mundos: [
    { n:1, letra:'1', curto:'Zonas', titulo:'O mar português: zonas marítimas e ZEE', resumo:'Mar territorial, zona contígua, ZEE e plataforma continental (pp. 242–243 e 251).', nPerguntas:12, especiais:[{k:'mapa', set:'zonas'}, {k:'sprint', set:'zonas'}], teste:true },
    { n:2, letra:'2', curto:'Costa', titulo:'A linha de costa e a ação do mar', resumo:'Costa de arriba e de praia, erosão, abrasão, recuo das arribas e deriva litoral (pp. 244–247).', nPerguntas:12, especiais:[{k:'ordem', set:'arriba'}, {k:'mapa', set:'arriba'}, {k:'sprint', set:'costa'}], teste:true },
    { n:3, letra:'3', curto:'Acidentes', titulo:'Acidentes do litoral e portos de mar', resumo:'Ria de Aveiro, tômbolo de Peniche, ria Formosa, fajãs… e os portos abrigados por cabos (pp. 248–250).', nPerguntas:12, especiais:[{k:'mapa', set:'acidentes'}, {k:'ligar', set:'processos'}, {k:'ligar', set:'cabos'}], teste:true },
    { n:4, letra:'4', curto:'Pescado', titulo:'Porque há (ou não) muito peixe?', resumo:'Plâncton, plataforma continental, correntes marítimas, nortada e upwelling (pp. 251–253).', nPerguntas:12, especiais:[{k:'ordem', set:'upwelling'}, {k:'mapa', set:'fundo'}, {k:'sprint', set:'fatores'}], teste:true },
    { n:5, letra:'5', curto:'Pesca', titulo:'O setor das pescas em Portugal', resumo:'Zonas de pesca, PCP e acordos, capturas e espécies, frota, tipos de pesca, mão de obra, portos e lotas (pp. 256–264).', nPerguntas:14, especiais:[{k:'sprint', set:'tipospesca'}, {k:'ligar', set:'tipospesca'}, {k:'mapa', set:'portos'}, {k:'ligar', set:'servicos'}], teste:true },
    { n:6, letra:'6', curto:'Aquicultura', titulo:'Aquicultura, indústria do pescado e salicultura', resumo:'Regimes de aquicultura, congelados, conservas, salga e secagem, sal marinho e flor de sal (pp. 266–271).', nPerguntas:12, especiais:[{k:'sprint', set:'regimes'}, {k:'ligar', set:'industria'}, {k:'ordem', set:'peixe'}], teste:true },
    { n:7, letra:'7', curto:'Gestão', titulo:'Gestão do litoral e Economia Azul', resumo:'Pressão sobre a zona costeira, POC, Plano de Ação Litoral XXI, PSOEM, soluções e valorização do mar (pp. 272–281).', nPerguntas:13, especiais:[{k:'sprint', set:'problemas'}, {k:'ligar', set:'programas'}, {k:'ligar', set:'recursos'}], teste:true }
  ],

  /* Lições: a matéria explicada, mostrada ANTES das perguntas de cada mundo.
     Cada secção tem linhas [termo, explicação] (pode ter <b>negrito</b> e <i>itálico</i>),
     e pode ter tabela, figura (fig) ou minijogo (quiz, de CONTEUDO.classificar). */
  licoes: {
    1: { ideia:'Antes de falar de peixe, é preciso saber <b>que mar é de Portugal</b> e que direitos o Estado tem em cada parte desse mar. (Manual, pp. 242–243 e 251)',
      seccoes:[
        { t:'A Convenção que divide o mar (p. 242)', l:[
          ['CNUDM','A <b>Convenção das Nações Unidas sobre o Direito do Mar</b> é um acordo assinado em <b>1982</b> que regula grande parte do direito do mar. Define as regras da <b>soberania</b> dos Estados sobre as águas junto às suas costas e as normas de <b>gestão dos recursos marinhos</b> e de <b>controlo da poluição</b>.'],
          ['Estado costeiro','Um Estado costeiro é um país com costa. Segundo o manual, Portugal é o Estado costeiro da UE com <b>maior extensão de zonas marítimas</b>: mais de dois milhões de km².'],
          ['Milha náutica','As zonas marítimas medem-se em <b>milhas náuticas (mn)</b>. <b>1 milha náutica = 1,852 km</b>. Por isso 12 mn ≈ 22 km e 200 mn ≈ 370 km.'],
          ['Linha de base','É a linha a partir da qual se mede tudo: a <b>linha da baixa-mar</b> (maré baixa) ao longo da costa.'] ]},
        { t:'As zonas marítimas, da costa para o largo (p. 242)', l:[
          ['Mar territorial','São as águas <b>até às 12 milhas náuticas</b>, medidas a partir da linha de base. Aqui o Estado tem <b>soberania</b>: manda no solo e subsolo marinhos, na coluna de água e no <b>espaço aéreo</b> por cima.'],
          ['Zona contígua','É a faixa <b>das 12 às 24 milhas náuticas</b>. Aqui o Estado pode <b>fiscalizar</b> para prevenir ou reprimir <b>infrações às suas leis</b> (por exemplo, contrabando).'],
          ['ZEE','A <b>Zona Económica Exclusiva</b> vai <b>desde o limite do mar territorial até às 200 milhas náuticas</b>. Inclui o solo e o subsolo marinhos, a coluna de água e a sua superfície, e o espaço aéreo. Nesta zona, o Estado tem <b>direitos de exploração, investigação e gestão dos recursos naturais</b> (peixe, minerais, energia).'],
          ['3 partes da ZEE','A ZEE portuguesa reparte-se por <b>três áreas</b>: <b>Continente</b>, <b>Açores</b> e <b>Madeira</b>.'] ],
          fig:'zonas' },
        { t:'Plataforma continental: dois sentidos diferentes (pp. 242, 243 e 251)', l:[
          ['Sentido geológico','A <b>plataforma continental</b>, no sentido geológico (do relevo), é a <b>parte submersa da placa continental</b>, com profundidade <b>máxima de 200 m</b>. Começa na linha média da maré baixa e desce em declive suave até ao <b>talude continental</b>.'],
          ['Sentido jurídico','No sentido jurídico (da CNUDM), a plataforma continental é o <b>leito e o subsolo</b> das áreas submarinas para lá do mar territorial, até ao <b>bordo exterior da margem continental</b> ou até às <b>200 mn</b>, quando esse bordo não chega lá.'],
          ['ZEE ≠ plataforma jurídica','Na <b>ZEE</b> o Estado tem direitos sobre o <b>fundo, a água e o ar</b>. Na <b>plataforma continental jurídica</b> só tem direitos sobre o <b>solo e o subsolo</b> marinhos (o fundo), não sobre a água.'],
          ['Proposta de alargamento','Portugal apresentou às <b>Nações Unidas</b>, em <b>2009</b> (reformulada em <b>2017</b>), uma proposta para alargar a plataforma continental jurídica <b>para lá das 200 mn</b>. Se for aprovada, <b>97% do território português passará a ser mar</b> e Portugal terá direito exclusivo de explorar os recursos do fundo nessa área. Quem prepara a proposta é a <b>EMEPC</b> (Estrutura de Missão para a Extensão da Plataforma Continental).'],
          ['Atividades possíveis','Com o alargamento, podem ganhar potencial, por exemplo, a <b>exploração de recursos minerais</b> do fundo, a <b>biotecnologia marinha</b> e a <b>investigação científica</b>.'] ]},
        { t:'Em tabela', l:[], tabela:{ titulo:'Zonas marítimas segundo a CNUDM', cab:['Zona','Até onde','O que o Estado pode fazer'], linhas:[
          ['Mar territorial','0–12 mn','Soberania: fundo, água e espaço aéreo'],
          ['Zona contígua','12–24 mn','Fiscalizar infrações às suas leis'],
          ['ZEE','até 200 mn','Explorar, investigar e gerir os recursos'],
          ['Plataforma (jurídica)','até 200 mn ou mais','Direitos só sobre solo e subsolo']
        ]}},
        { t:'Minijogo rápido: que zona é?', quiz:'zonas', l:[] }
      ],
      truque:'Pensa em <b>12 – 24 – 200</b>: «<b>Manda</b> (12) – <b>Multa</b> (24) – <b>Explora</b> (200)». No mar territorial o Estado manda em tudo; na zona contígua só fiscaliza e multa; na ZEE explora os recursos.' },

    2: { ideia:'A linha de costa portuguesa é sobretudo <b>alta e pouco recortada</b>. O mar está sempre a desgastá-la, a transportar materiais e a depositá-los noutro sítio. (Manual, pp. 244–247)',
      seccoes:[
        { t:'A linha de costa em Portugal (pp. 244–245)', l:[
          ['Linha de costa','A <b>linha de costa</b> é a linha onde a terra encontra o mar. Em Portugal tem cerca de <b>1200 km no Continente</b> e <b>1360 km nos arquipélagos</b> (cerca de 2600 km no total).'],
          ['Litoral','O <b>litoral</b> é a faixa junto à linha de costa onde o mar e a terra se influenciam (praias, arribas, dunas, rias…).'],
          ['Configuração','A costa portuguesa é <b>predominantemente alta e pouco recortada</b>. Isso deve-se ao <b>relevo</b>, às <b>rochas</b> que estão em contacto com o mar e à <b>erosão marinha</b>.'],
          ['Açores e Madeira','Nos arquipélagos predomina o <b>litoral de arriba alta</b>, mais irregular. A costa de praia é pouco representativa; as maiores extensões ficam em <b>São Miguel</b> e na <b>costa sul do Porto Santo</b>.'] ]},
        { t:'Costa de arriba e costa de praia no Continente (p. 245)', l:[
          ['Costa de arriba','No Continente <b>predomina a costa de arriba</b> (rochosa), talhada em rochas de <b>grande dureza</b>: <b>granito, xisto e calcário</b>.'],
          ['Arriba baixa','A costa de <b>arriba baixa ou rochas</b> vai de <b>Caminha a Esposende</b>: é uma estreita faixa de <b>costa de emersão</b> (área que emergiu porque o mar recuou, com pequenas reentrâncias e algumas praias).'],
          ['Arriba alta','A costa de <b>arriba alta e escarpada</b> fica: da <b>Nazaré à foz do Tejo</b>; do <b>cabo Espichel à foz do Sado</b>; do <b>cabo de Sines ao de São Vicente</b>; e no <b>barlavento algarvio</b> (Algarve ocidental).'],
          ['Costa de praia','A <b>costa de praia</b> (litoral baixo, de areia) forma-se em relevo baixo e rochas mais <b>brandas</b> (arenitos, argilas) e ocupa <b>menor extensão</b>: de <b>Espinho a São Pedro de Moel</b>; no <b>estuário do Tejo</b>; da <b>foz do Sado a Sines</b>; e no <b>sotavento algarvio</b> (Algarve oriental).'] ]},
        { t:'A ação do mar: erosão e abrasão (p. 246)', l:[
          ['Erosão marinha','A <b>erosão marinha</b> é o processo com que o mar molda a costa, em três etapas: <b>desgaste</b> (a força das ondas fragmenta as rochas), <b>transporte</b> (as ondas e correntes levam os fragmentos) e <b>acumulação</b> (os fragmentos e areias depositam-se). O desgaste é maior nas rochas mais brandas.'],
          ['Abrasão marinha','A <b>abrasão marinha</b> é a erosão marinha <b>reforçada pelo arremesso de areia e fragmentos de rocha</b> contra as arribas vivas. Funciona como uma lixa e faz <b>recuar as arribas</b>.'],
          ['Arriba viva','Uma <b>arriba viva</b> é uma arriba em <b>contacto com o mar</b>, que ainda sofre abrasão.'],
          ['Arriba morta','Uma <b>arriba morta</b> é uma arriba que <b>já não está sujeita à abrasão marinha</b>, porque recuou ou porque o nível do mar baixou.'] ]},
        { t:'O recuo de uma arriba viva (p. 246, Fig. 2)', l:[
          ['1. Base','A abrasão marinha desgasta a <b>base</b> da arriba e retira o apoio à parte de cima.'],
          ['2. Desmoronamento','A parte de cima <b>desmorona-se</b> e a arriba <b>recua</b>.'],
          ['3. Plataforma de abrasão','Os fragmentos acumulam-se na base. Forma-se a <b>plataforma de abrasão</b>: faixa entre o mar e a arriba, ligeiramente inclinada para o mar, <b>submersa na maré alta</b> e <b>visível na maré baixa</b>.'],
          ['4. Plataforma de acumulação','Os fragmentos que se acumulam mais à frente e estão <b>sempre submersos</b> formam a <b>plataforma de acumulação</b>.'],
          ['5. Arriba morta','Quando a arriba deixa de estar sujeita à abrasão, passa a ser uma <b>arriba morta</b>.'] ],
          fig:'arriba' },
        { t:'Cabos, baías e a deriva litoral (p. 247)', l:[
          ['Cabo','Um <b>cabo</b> é uma ponta de terra que avança para o mar. Forma-se nas rochas <b>mais resistentes</b>, que recuam mais devagar (ex.: cabo da Roca, cabo de São Vicente).'],
          ['Enseada e baía','As <b>enseadas e pequenas baías</b> são reentrâncias onde o mar entra na terra. Formam-se nas rochas de <b>menor dureza</b>, que recuam mais depressa.'],
          ['Deriva litoral','A <b>corrente de deriva litoral</b> é uma corrente provocada pela <b>chegada oblíqua das ondas à praia</b>. Transporta areias, poluentes e objetos <b>ao longo da costa</b>. Na costa ocidental, como as ondas chegam de <b>noroeste</b>, a deriva leva as areias de <b>norte para sul</b> (deriva Norte-Sul): por isso os molhes acumulam areia a norte e há menos areia a sul (p. 273).'],
          ['Praia','Onde a corrente perde força, as areias acumulam-se e formam <b>praias</b>; os materiais continuam a ser fragmentados e arredondados.'],
          ['Restinga e ilha-barreira','Às vezes as areias <b>assoreiam a foz dos rios</b> ou a entrada das reentrâncias e formam <b>restingas</b> (cordões de areia presos à terra, como na foz do Douro) e <b>ilhas-barreira</b> (cordões de areia soltos, paralelos à costa). Atrás delas ficam <b>áreas lagunares de água salobra</b> (mistura de água doce e salgada).'],
          ['Regressão e transgressão','A forma da costa também muda com <b>movimentos tectónicos</b> e <b>alterações climáticas</b>: na <b>regressão marinha</b> o mar recua e áreas submersas emergem; na <b>transgressão marinha</b> o mar avança e submerge terra, formando <b>costas de submersão</b>.'] ]},
        { t:'Minijogo rápido: arriba ou praia?', quiz:'costa', l:[] }
      ],
      truque:'<b>Barlavento = arriba, Sotavento = areia</b> (no Algarve). E lembra a frase: «<b>rocha dura faz cabo, rocha mole faz baía</b>».' },

    3: { ideia:'Ao longo da costa há formas especiais, os <b>acidentes do litoral</b>. E como a costa é pouco recortada, os portos procuram <b>abrigo a sul dos cabos</b>, em estuários e em lagunas. (Manual, pp. 248–250)',
      seccoes:[
        { t:'Acidentes do litoral no Continente (p. 249)', l:[
          ['Acidentes do litoral','Os <b>acidentes do litoral</b> são formas de relevo que se destacam na linha de costa (rias, baías, tômbolos, estuários, cabos…).'],
          ['Ria de Aveiro','<b>Sistema lagunar</b> de água salobra, na foz do rio Vouga, separado do mar por uma <b>extensa restinga</b>. Resultou do <b>recuo do mar</b> e da <b>acumulação de sedimentos marinhos e fluviais</b>. Tem condições para a pesca e a salicultura.'],
          ['Concha de São Martinho do Porto','Era um antigo <b>golfo</b> cuja entrada ficou cada vez mais apertada pela <b>deposição de areias e seixos</b>. Hoje é uma <b>pequena baía em forma de concha</b>.'],
          ['Tômbolo de Peniche','Peniche era uma <b>pequena ilha</b> que ficou <b>ligada ao Continente</b> por um <b>istmo</b> (faixa estreita de terra) formado pela <b>acumulação de areias e seixos</b>. Esse istmo é o tômbolo.'],
          ['Estuários do Tejo e do Sado','Um <b>estuário</b> é a foz larga de um rio, onde a água doce se mistura com a salgada. Os do Tejo e do Sado são reservas naturais da <b>Rede Natura 2000</b>, com muitas aves migratórias, e são <b>áreas abrigadas</b> com boas condições para portos (Lisboa e Setúbal).'],
          ['Ria Formosa (ou de Faro)','<b>Sistema lagunar</b> de <b>restingas e ilhas-barreira</b>, formado pela acumulação de <b>sedimentos marinhos</b>. Boas condições para pesca, aquicultura, salicultura e atividade portuária.'] ],
          fig:'acidentes' },
        { t:'Singularidades dos arquipélagos (p. 248)', l:[
          ['Fajã','Uma <b>fajã</b> é um <b>terreno plano à beira-mar</b>, formado pelos <b>materiais desprendidos das vertentes</b> (fajã detrítica). Em São Jorge há mais de 70 fajãs, como a da <b>Caldeira de Santo Cristo</b> e a dos <b>Cubres</b>, com lagunas de água salobra.'],
          ['Fajã e delta lávico','Também há fajãs e <b>deltas lávicos</b> formados por <b>escoadas de lava</b> que arrefeceram ao chegar ao mar. Exemplo: o <b>delta lávico do Seixal</b> (Madeira).'],
          ['Piscinas naturais','As escoadas de lava formam <b>piscinas naturais</b>, como nos <b>Mosteiros</b> (São Miguel).'],
          ['Vulcão dos Capelinhos','<b>Emergiu do mar em 1957</b> e acrescentou terra à ilha do <b>Faial</b> (Açores).'],
          ['Arco de São Jorge','Na Madeira: geossítio de depósitos de <b>movimentos de massa</b> nas vertentes, com forma de arco.'],
          ['Porto Santo','<b>Praia de areia branca</b> e o seu <b>cordão dunar</b>. Nas outras ilhas as praias são <b>escuras</b>, de areia e calhaus de basalto e lava.'] ]},
        { t:'Portos de mar abrigados por cabos (p. 250)', l:[
          ['O problema','No Continente, a linha de costa é <b>pouco recortada</b> e muito <b>exposta a ventos e vagas fortes</b>. Há poucas condições naturais para portos.'],
          ['A solução natural','Por isso, a maioria dos portos fica no <b>flanco sul dos cabos</b>, que os <b>abrigam dos ventos de oeste e noroeste</b> e das correntes marítimas. Outros ficam em <b>estuários</b> e <b>sistemas lagunares</b>.'],
          ['A solução construída','Também foi preciso construir <b>infraestruturas de proteção</b>, como <b>pontões e molhes</b>.'],
          ['Exemplos','O <b>cabo Espichel</b> abriga o porto de <b>Sesimbra</b>. O <b>cabo Carvoeiro</b> abriga <b>Peniche</b>. O <b>cabo Mondego</b> abriga a <b>Figueira da Foz</b>. O <b>cabo de Sines</b> abriga <b>Sines</b>. O <b>cabo de São Vicente</b> abriga os portos do barlavento (Sagres, Lagos).'] ],
          fig:'cabos' }
      ],
      truque:'Para justificar a posição de um porto, usa a palavra mágica <b>ABRIGO</b>: «está <b>a sul de um cabo</b> / num <b>estuário</b> / numa <b>laguna</b>, abrigado dos ventos de <b>oeste e noroeste</b>».' },

    4: { ideia:'O peixe come plâncton, e o plâncton precisa de <b>nutrientes, luz e oxigénio</b>. Por isso, há mais peixe onde o mar é pouco fundo, agitado, recebe rios ou tem águas frias a subir. (Manual, pp. 251–253)',
      seccoes:[
        { t:'O plâncton, base de tudo (p. 252)', l:[
          ['Plâncton','O <b>plâncton</b> são organismos <b>microscópicos</b>: vegetais (<b>fitoplâncton</b>) ou animais (<b>zooplâncton</b>). É a <b>base da cadeia alimentar marinha</b>.'],
          ['Nutrientes','A abundância de peixe depende dos <b>nutrientes</b>, que dependem das condições da água e da formação de plâncton.'] ]},
        { t:'Fator 1: a plataforma continental (pp. 251–253)', l:[
          ['Porque é rica','Na plataforma continental há <b>pouca profundidade</b> (mais <b>luz</b>), <b>águas mais agitadas</b> (mais <b>oxigénio</b>) e <b>água doce dos rios</b> (menos sal e mais nutrientes). Tudo isto favorece o plâncton. Cerca de <b>80% das capturas mundiais</b> fazem-se nas plataformas continentais.'],
          ['Relevo do fundo','Do litoral para o largo: <b>plataforma continental</b> (até 200 m), <b>talude continental</b> (descida forte), <b>planície abissal</b> (grande profundidade). Os taludes portugueses são cortados por <b>canhões submarinos</b> (vales submarinos profundos, como o da Nazaré).'],
          ['Em Portugal','A plataforma continental portuguesa é <b>estreita</b>: no Continente tem entre <b>30 e 70 km</b>, sendo <b>mais larga ao largo do cabo da Roca</b> e mais estreita a sul. Nos Açores e na Madeira é <b>quase inexistente</b>, por causa da origem <b>vulcânica</b> (as ilhas são topos de uma cordilheira submarina).'],
          ['Avaliação','É um <b>fator desfavorável</b>: temos uma pequena zona de abundância de pescado, muito menor do que na maioria dos países desenvolvidos da Europa (no noroeste da Europa a plataforma é ampla).'] ],
          fig:'fundo' },
        { t:'Fator 2: as correntes marítimas (pp. 252–253)', l:[
          ['Corrente marítima','Uma <b>corrente marítima</b> é a deslocação de grandes massas de água com características idênticas de temperatura e densidade.'],
          ['Frias e quentes','As <b>correntes frias</b> vêm da subida das águas e arrastam matéria do fundo: são <b>mais ricas em nutrientes</b>. As <b>correntes quentes</b> são pouco favoráveis ao plâncton. Onde uma corrente fria encontra uma quente há mais agitação, mais oxigénio e mais plâncton.'],
          ['Corrente de Portugal','A <b>Deriva do Atlântico Norte</b> (parte da corrente quente do Golfo) chega à Irlanda e divide-se; o ramo que desce ao largo de Portugal chama-se <b>Corrente de Portugal</b>. Segundo o manual é uma corrente <b>quente</b> e superficial, pobre em nutrientes: <b>fator desfavorável</b>.'],
          ['Corrente das Canárias','A <b>sudoeste</b> do território, a Corrente de Portugal junta-se à <b>corrente fria das Canárias</b>: mais agitação e oxigenação, mais nutrientes: <b>fator favorável</b>.'] ]},
        { t:'Fator 3: a nortada e o upwelling (p. 253)', l:[
          ['Nortada','A <b>nortada</b> é um <b>vento forte de norte</b> que sopra no litoral ocidental, sobretudo no <b>verão</b> e à tarde.'],
          ['De onde vem a nortada','No verão, o <b>anticiclone dos Açores</b> (altas pressões) fica mais a norte e o interior da Península Ibérica aquece muito, formando uma <b>depressão térmica</b> (baixas pressões). O ar desloca-se das altas para as baixas pressões e sopra de <b>norte</b> ao longo da costa. <i>(Esta explicação não está nas páginas do manual que vimos: confirma nos apontamentos.)</i>'],
          ['Upwelling','O <b>upwelling</b> (ou <b>afloramento costeiro</b>) é uma corrente de <b>águas profundas e frias</b> que <b>sobe à superfície</b> carregada de <b>nutrientes</b>. Acontece porque a nortada <b>afasta as águas superficiais para o largo</b> e as águas do fundo sobem para as substituir (<b>corrente de compensação</b>).'],
          ['Consequências','Mais nutrientes, mais plâncton e mais peixe: <b>fator muito favorável</b>. A sardinha fica mais gorda e saborosa no verão. Também explica a <b>água fria</b> nas praias da costa ocidental no verão.'] ],
          fig:'upwelling' },
        { t:'Em tabela: como atuam os fatores em Portugal (p. 253)', l:[], tabela:{ titulo:'Fatores da abundância de pescado', cab:['Fator','Em Portugal','Avaliação'], linhas:[
          ['Plataforma continental','Estreita; quase inexistente nas ilhas','Desfavorável'],
          ['Corrente de Portugal','Quente e pobre em nutrientes','Desfavorável'],
          ['Corrente das Canárias','Fria; junta-se à de Portugal a sudoeste','Favorável'],
          ['Upwelling','No verão, com a nortada','Muito favorável']
        ]}},
        { t:'Minijogo rápido: favorável ou desfavorável?', quiz:'fatores', l:[] }
      ],
      truque:'<b>Upwelling = a nortada «varre» a água de cima para o largo e a água fria do fundo «sobe para tapar o buraco»</b>, trazendo a comida do plâncton.' },

    5: { ideia:'A pesca em Portugal é feita por uma <b>frota de muitos barcos pequenos</b>, com pescadores <b>envelhecidos</b>, num mar com recursos limitados e regras europeias. (Manual, pp. 256–264)',
      seccoes:[
        { t:'Zonas de pesca e a Política Comum das Pescas (pp. 257–258)', l:[
          ['Condicionantes','A <b>costa regular</b> e a <b>plataforma continental estreita</b> limitam a pesca nas nossas águas. Por isso, há muito tempo que a frota pesca também noutros mares.'],
          ['Onde pesca','A frota opera sobretudo no <b>Atlântico Nordeste</b> (áreas do <b>ICES</b> e da <b>CECAF</b>) e em <b>pesqueiros externos</b>, como o Atlântico Noroeste (<b>NAFO</b>), onde captura, por exemplo, <b>cantarilho</b> e <b>bacalhau</b>.'],
          ['PCP','A <b>Política Comum das Pescas</b> (PCP) da UE, criada nos anos 70, é um conjunto de acordos e regras para gerir as frotas europeias e <b>conservar as populações de peixe</b>. Dá às frotas dos Estados-membros <b>igualdade de acesso às águas comunitárias</b>.'],
          ['Acordos de pesca','Pela PCP, Portugal pode pescar nas <b>ZEE comunitárias</b> e em <b>pesqueiros externos</b>, de <b>águas internacionais</b> ou de <b>soberania estrangeira</b>, cumprindo as normas dos <b>acordos com países terceiros</b>. Estes acordos <b>diversificam as áreas de pesca</b> e compensam os recursos limitados da nossa ZEE.'],
          ['FEAMP','A PCP é financiada (2021–2027) pelo <b>FEAMP</b> (Fundo Europeu dos Assuntos Marítimos e das Pescas), que apoia a <b>modernização da frota</b>, práticas <b>mais sustentáveis</b> e os <b>pequenos pescadores</b>.'],
          ['Peso na economia','A contribuição da pesca para a economia nacional (PIB e emprego) <b>tem diminuído</b> (em 2019, cerca de 0,2% do VAB), mas continua <b>muito importante para as comunidades costeiras</b>.'] ]},
        { t:'Capturas e principais espécies (p. 259)', l:[
          ['Volume','O volume das capturas <b>varia muito</b> de ano para ano: depende do estado das águas, das migrações das espécies e das <b>quotas de pesca</b> (limites às capturas), como na <b>sardinha desde 2018</b> e no <b>bacalhau desde 2021</b>.'],
          ['Valor','O valor das capturas tem <b>tendência para aumentar</b>, porque sobe o preço das espécies protegidas e capturam-se mais espécies de maior valor.'],
          ['Em volume (2019)','Segundo o manual (dados de 2019): <b>1.º cavala, 2.º carapau, 3.º atuns, 4.º sardinha, 5.º biqueirão</b>. A sardinha desceu por causa da <b>redução dos stocks</b> e das <b>restrições à sua captura</b>.'],
          ['Em valor (2019)','Em valor, lideram os <b>polvos</b>, seguidos dos <b>atuns</b>. O polvo vale muito porque é capturado com <b>armadilhas (alcatruzes)</b>, uma técnica especializada que exige <b>mais mão de obra</b>, e as capturas são pouco volumosas.'],
          ['Atenção: dados novos','Nos dados do INE de <b>2024</b>, a <b>sardinha voltou ao 1.º lugar</b> em volume (31 922 t), à frente da cavala e do carapau. No teste, usa os dados <b>do documento</b> que te derem.'] ]},
        { t:'Os tipos de pesca (p. 261)', l:[
          ['Pesca local','Em <b>águas interiores</b> (rios, estuários, lagoas) e <b>perto da costa</b>. Usa <b>pequenas embarcações (menos de 9 m)</b> e artes <b>artesanais</b> (anzol, armadilhas, pequenas redes). Pesca por <b>curtos períodos</b> ou só em certas épocas. Captura <b>espécies de maior valor</b> (polvo, enguia).'],
          ['Pesca costeira','Opera <b>além das 6 milhas</b> da costa, a várias horas ou dias do porto, podendo ir para fora da ZEE nacional. Barcos de <b>9 a 33 m</b>, com <b>meios modernos de deteção e captura</b> (cerco, arrasto, linha de anzóis) e, geralmente, de <b>conservação</b> do pescado.'],
          ['Pesca do largo','Opera <b>para lá das 12 milhas</b>, em <b>águas internacionais</b> e <b>ZEE estrangeiras</b>. Navios de <b>100 GT ou mais</b>, com autonomia de <b>pelo menos 15 dias</b> (podem ficar meses no mar), técnicas modernas (sondas, meios aéreos, satélite) e quase sempre apoio de um <b>navio-congelador</b> e/ou <b>navio-fábrica</b>.'],
          ['Artes de pesca','O <b>cerco</b> é uma rede que rodeia o cardume (sardinha: 98% é pescada ao cerco). O <b>arrasto</b> é uma rede puxada pelo barco. O <b>palangre</b> é uma linha comprida com muitos anzóis. Também se usam o sonar e aviões para detetar cardumes (p. 257).'] ],
          tabela:{ titulo:'Comparação rápida', cab:['','Local','Costeira','Do largo'], linhas:[
            ['Onde','Águas interiores e perto da costa','Além das 6 mn','Além das 12 mn, águas internacionais e ZEE estrangeiras'],
            ['Barcos','Menos de 9 m','9 a 33 m','100 GT ou mais'],
            ['Tempo','Curtos períodos','Horas ou dias','Semanas ou meses'],
            ['Técnicas','Artesanais','Modernas','Industriais, navio-fábrica']
          ]}},
        { t:'A frota e a mão de obra (pp. 260–263)', l:[
          ['Frota em 2019','Quase <b>oito mil embarcações</b> registadas: cerca de <b>90% de pequena dimensão</b> (menos de 5 GT) e <b>mais de 80% com motor</b>. Predominam as embarcações de <b>pesca local</b>.'],
          ['Arqueação bruta','A <b>arqueação bruta</b> é o volume interno total do navio; mede-se em <b>GT</b> (1 GT = 2,832 m³). Os barcos de águas internacionais têm maior arqueação.'],
          ['Regiões','<b>Centro e Algarve</b> têm mais embarcações; <b>Centro e Norte</b> têm mais arqueação (GT) e potência (kW); Alentejo e Madeira têm os valores mais baixos.'],
          ['Evolução','A frota <b>tem diminuído</b>, para se adequar aos recursos disponíveis (stocks vulneráveis). Muitos barcos são <b>reconvertidos para o turismo</b> (mergulho, observação de espécies, passeios). Há <b>modernização</b> e aumento da dimensão, mas continuam a predominar as pequenas embarcações.'],
          ['Pescadores','O número de pescadores matriculados caiu muito no século XX, estabilizou nos <b>18 mil</b> e voltou a descer em 2018–2019 (cerca de <b>14,6 mil</b>), sobretudo pela redução das <b>quotas da sardinha</b>. <b>Norte e Centro</b> têm mais pescadores.'],
          ['Características','Os pescadores são <b>mais envelhecidos</b> e têm <b>menos escolaridade</b> do que a média nacional. Isso reduz a capacidade de <b>inovar</b>, de <b>arriscar</b> e de aderir aos apoios da PCP.'],
          ['Formação','A <b>For-Mar</b> (Centro de Formação Profissional das Pescas e do Mar) dá cursos nos principais portos para <b>qualificar e rejuvenescer</b> o setor.'] ]},
        { t:'Portos de pesca e lotas (p. 264)', l:[
          ['Modernização','Todos os portos de pesca tiveram obras de <b>reestruturação e modernização</b>, com serviços de apoio à descarga do pescado.'],
          ['Lota','A <b>lota</b> é o local onde se faz o <b>leilão e a primeira venda</b> do pescado. A <b>rede de lotas</b> tem sistemas eletrónicos que tornam o leilão mais <b>rápido e transparente</b> (os compradores podem licitar à distância).'],
          ['Fiscalização','Há <b>regulamentação e fiscalização</b> da descarga e manuseamento para garantir a <b>segurança alimentar</b>, o cumprimento das <b>quotas</b> e dos <b>tamanhos mínimos de desembarque</b>.'],
          ['Serviços','Leilão e venda: <b>lota</b> e <b>mercado de segunda venda</b>. Conservação: <b>venda de gelo</b> e <b>entreposto frigorífico</b>. Captura: <b>armazém e venda de apresto</b> (material de pesca) e <b>posto de combustíveis</b>. Gestão: <b>serviços administrativos</b>.'] ],
          fig:'portos' }
      ],
      truque:'Tipos de pesca pelos números: <b>local &lt; 9 m · costeira &gt; 6 mn e 9–33 m · largo &gt; 12 mn, 100 GT e 15 dias</b>. E as espécies: <b>em volume, cavala; em valor, polvo</b> (dados do manual).' },

    6: { ideia:'Além de pescar, também se <b>cria</b> peixe e marisco (aquicultura), se <b>transforma</b> o pescado (indústria) e se <b>produz sal</b> (salicultura). (Manual, pp. 266–271)',
      seccoes:[
        { t:'A aquicultura (pp. 266–267)', l:[
          ['Aquicultura','A <b>aquicultura</b> é a <b>criação de organismos aquáticos</b> (peixes, moluscos, algas) com processos que aumentam a produção do meio natural. É uma forma alternativa de obter pescado que <b>reduz a pressão sobre os recursos marinhos</b> e ajuda a <b>repovoar</b> habitats.'],
          ['Onde','Em tanques, estruturas flutuantes e viveiros, sobretudo em <b>água salobra ou marinha</b> (95%). As melhores áreas são as <b>rias de Aveiro e de Faro</b>: água salobra, <b>marés</b> e muitos <b>nutrientes</b>.'],
          ['Evolução','O número de estabelecimentos <b>diminuiu</b>, mas a <b>produção cresceu</b>.'],
          ['Regime extensivo','Alimentação <b>exclusivamente natural</b>, práticas tradicionais, <b>pouco impacte</b> no ambiente. É o regime que <b>predomina</b>: sobretudo <b>moluscos</b> (amêijoas e ostras) e a maior parte no <b>Algarve</b>.'],
          ['Regime semi-intensivo','Alimento natural <b>mais suplementos artificiais</b>.'],
          ['Regime intensivo','<b>Controlo total</b> das condições e alimentação <b>exclusivamente artificial</b> (ração). Tem <b>forte impacte ambiental</b> (resíduos da ração). Sobretudo <b>peixes</b> (pregado, dourada, robalo), na <b>Madeira</b> e no <b>Centro</b>. Há tendência para crescer.'],
          ['Regras','As normas da PCP exigem <b>qualidade e arejamento da água</b>, <b>tratamento dos efluentes</b> e cuidado com <b>espécies invasoras</b> que possam fugir para a natureza.'],
          ['Espécies (2018)','Amêijoa (3970 t), ostra (3451 t), pregado (2582 t), mexilhão, dourada e truta arco-íris.'] ]},
        { t:'A indústria transformadora do pescado (p. 268)', l:[
          ['O que é','A <b>indústria transformadora dos recursos piscícolas</b> transforma o pescado da pesca e da aquicultura. Gera emprego e riqueza, sobretudo no <b>Norte e no Centro</b>.'],
          ['Congelados','Subsetor <b>mais recente</b> e agora em <b>1.º lugar</b> (mais de 50% da produção): peixe inteiro, filetes, postas, marisco, preparados. Muitas vezes congelados <b>em alto-mar</b>.'],
          ['Preparados e conservas','O que <b>produz menos</b>, mas é o <b>2.º em valor</b> e o <b>único com saldo comercial positivo</b> (exporta mais do que importa). Destacam-se o <b>atum</b> e a <b>sardinha</b>.'],
          ['Salga e secagem','Quase só <b>bacalhau</b>, de que Portugal é o <b>maior consumidor mundial</b>.'],
          ['Fumagem','Sem tradição, mas a crescer (espadarte e produtos da aquicultura).'] ]},
        { t:'A salicultura (p. 269)', l:[
          ['Salicultura','A <b>salicultura</b> é a produção de <b>sal marinho por evaporação solar</b> da água do mar, em <b>salinas</b>.'],
          ['Onde','Principalmente no <b>Algarve</b> (exposição a sul e temperaturas mais altas) e no <b>Centro</b> (rias). Em 2019, o Algarve tinha 99,4% do volume produzido.'],
          ['Problema','É uma atividade tradicional que tem perdido salinas, sobretudo por <b>falta de mão de obra</b>.'],
          ['Tipos de sal','<b>Sal marinho comum</b> (97% da produção): salinas modernas com <b>meios mecânicos</b>, mais barato. <b>Sal marinho tradicional</b>: recolhido <b>à mão</b> em salinas tradicionais. <b>Flor de sal</b>: cristais leves que <b>flutuam</b>, recolhida à mão, o sal mais requintado.'] ]},
        { t:'Medidas sustentáveis na pesca (pp. 259, 271 e 279)', l:[
          ['Quotas','As <b>quotas de pesca</b> são <b>limites às capturas</b> de cada espécie (por exemplo, sardinha desde 2018, bacalhau desde 2021), para os cardumes se regenerarem.'],
          ['Defeso','A <b>época de defeso</b> é um período em que é <b>proibido pescar</b> uma espécie, para ela se reproduzir (na sardinha, entre dezembro e abril, conforme a zona).'],
          ['Tamanho mínimo','O <b>tamanho mínimo de desembarque</b> impede a venda de peixes jovens (sardinha: 11 cm).'],
          ['Outras','Limitar o <b>esforço de pesca</b> (dias no mar, proibição ao fim de semana), controlar a <b>malhagem</b> das redes, limitar as <b>capturas acessórias</b>, e usar <b>rações apropriadas</b> na aquicultura. A sardinha é gerida em conjunto por <b>Portugal e Espanha</b>.'] ]},
        { t:'Minijogo rápido: que regime de aquicultura?', quiz:'regimes', l:[] }
      ],
      truque:'Na aquicultura: <b>EXtensivo = EXclusivamente natural</b>; <b>INtensivo = INdústria total</b> (ração artificial). Na indústria: <b>congelados 1.º em produção; conservas são as únicas com saldo positivo</b>.' },

    7: { ideia:'O litoral concentra pessoas e atividades, e isso cria <b>problemas</b>. É preciso <b>gerir</b> (com programas e planos) e <b>valorizar</b> o mar de forma sustentável: é a <b>Economia Azul</b>. (Manual, pp. 272–281)',
      seccoes:[
        { t:'A pressão sobre a zona costeira (pp. 273 e 276)', l:[
          ['Litoralização','A <b>litoralização</b> é a concentração da população e das atividades junto ao litoral. Com o <b>turismo</b> de praia e mar, aumenta a <b>pressão urbana</b> sobre a linha de costa.'],
          ['Dunas','O <b>pisoteio</b> e a <b>construção</b> nas dunas impedem a fixação da vegetação que as segura.'],
          ['Arribas','A <b>construção sobre as arribas</b> aumenta a sua instabilidade e acelera o desmoronamento e o recuo.'],
          ['Molhes e esporões','As obras de proteção (molhes, esporões) <b>retêm as areias</b> trazidas pela deriva litoral: há <b>acumulação a norte</b> e <b>mais erosão a sul</b>.'],
          ['Barragens','As <b>barragens</b> retêm os sedimentos dos rios na albufeira: chega menos areia ao mar e as praias <b>emagrecem</b>.'],
          ['Erosão costeira','A erosão aumenta com a <b>redução dos sedimentos fluviais</b> e com a <b>subida do nível médio do mar</b> (aquecimento global): desaparecem praias e a erosão pode recomeçar em arribas mortas. As áreas de maior erosão são as de maior ocupação: Espinho–Cortegaça, sul de Aveiro, sul da Figueira da Foz, Caparica, Quarteira e Vale do Lobo–Faro.'],
          ['Poluição e sobre-exploração','<b>Poluição marítima</b> (efluentes, turismo, tráfego marítimo, lavagem de porões que provoca marés negras), <b>sobre-exploração</b> dos recursos vivos (menos stocks, espécies em risco) e, na aquicultura, <b>efluentes não tratados</b> e <b>espécies invasoras</b>.'] ]},
        { t:'Os instrumentos de gestão (pp. 272, 274 e 277)', l:[
          ['Gestão integrada','<b>Gestão integrada</b> quer dizer aplicar <b>em conjunto</b> os planos do litoral e do mar, articulados com o <b>PNPOT</b> e os <b>PGRH</b> (Planos de Gestão de Região Hidrográfica).'],
          ['POC','Os <b>Programas da Orla Costeira (POC)</b> substituíram os antigos <b>Planos de Ordenamento da Orla Costeira (POOC)</b>, com um caráter mais <b>interventivo</b>. Regulam as <b>atividades e usos da orla costeira</b> e classificam as praias. Exemplo: <b>POC Alcobaça–Cabo Espichel</b> (juntou três POOC). Objetivos: orla preparada para as <b>alterações climáticas</b>, património e água preservados, e desenvolvimento sustentável.'],
          ['Ordenamento da orla costeira','O <b>ordenamento da orla costeira</b> é organizar onde e como se pode construir e usar a faixa costeira, para proteger as pessoas e a natureza.'],
          ['Plano de Ação Litoral XXI','Da <b>APA</b> (2017): é a <b>base para programar as intervenções</b> de gestão integrada da zona costeira: adaptação às <b>alterações climáticas</b>, gestão de <b>sedimentos</b>, minimização dos <b>riscos de erosão</b>.'],
          ['PSOEM','O <b>Plano de Situação do Ordenamento do Espaço Marítimo</b> caracteriza o <b>espaço marítimo</b> e define onde e quando se fazem as atividades. Objetivos: reforçar Portugal como <b>país atlântico</b>; <b>valorizar o mar na economia</b>; reforçar a <b>coesão nacional</b> (arquipélagos); valorizar Portugal como <b>maior Estado costeiro da UE</b>; contribuir para o ordenamento da bacia atlântica.'] ]},
        { t:'Soluções (p. 279)', l:[
          ['Construção','<b>Limites à construção</b> nas zonas costeiras (altura, dimensão, densidade) e correção da construção sobre dunas e arribas.'],
          ['Dunas','<b>Acessos pedonais sobrelevados</b> (passadiços) para evitar o pisoteio das dunas.'],
          ['Erosão','<b>Reforço sedimentar</b> (pôr areia nas praias), <b>proteções rígidas</b> (enrocamentos e paredões) e <b>estabilização das arribas</b>.'],
          ['Atividades','Regulamentar atividades com efeitos na costa e na água (indústria, desportos náuticos motorizados).'],
          ['Vigilância e fiscalização','Vigiar a costa (tráfego, pesca ilegal, lavagem de porões), monitorizar as águas e os recursos piscícolas e fiscalizar <b>malhagens, tamanhos mínimos, quotas, defeso e capturas acessórias</b>.'] ]},
        { t:'Valorizar o litoral e o mar: Economia Azul (pp. 278 e 281)', l:[
          ['Economia Azul','A <b>Economia Azul</b> (ou <b>Economia do Mar</b>) é o conjunto das <b>atividades económicas associadas ao mar e aos seus recursos</b>, desenvolvidas de forma <b>sustentável</b>: pesca, aquicultura, indústria do pescado, portos e transportes, turismo, energia, biotecnologia, investigação.'],
          ['Turismo','O <b>turismo</b> (clima ameno, praias) desenvolveu o Algarve e a Madeira e cria oportunidades no litoral alentejano: observação de <b>cetáceos</b> nos Açores, <b>mergulho</b> na Madeira, passeios na costa algarvia. Deve ser <b>ordenado</b> e sustentável.'],
          ['Desporto e ciência','Eventos desportivos (<b>vela, surf</b>) e <b>expedições científicas</b> (ex.: MarBIS2020 no Parque Marinho Professor Luiz Saldanha, Sesimbra).'],
          ['Recursos do mar','Recursos <b>piscatórios</b>; <b>sal</b> e <b>algas</b> (indústria, alimentação, fertilizantes); <b>dessalinização</b> para obter água potável (Porto Santo); <b>minerais metálicos</b> e <b>património cultural subaquático</b> nos fundos.'],
          ['Energia','<b>Ondas e marés</b> para produzir energia; os <b>ventos de oeste</b> permitem <b>parques eólicos</b> no mar. O <b>WindFloat Atlantic</b> (ao largo de Viana do Castelo) é o primeiro parque eólico <b>flutuante</b> semissubmersível do mundo.'],
          ['Tipos de recursos','O manual agrupa a valorização em <b>aproveitar recursos</b> (biológicos, minerais, culturais) e <b>promover atividades</b> (turísticas, desportivas, científicas).'] ]},
        { t:'Minijogo rápido: problema ou solução?', quiz:'problemas', l:[] }
      ],
      truque:'Os 3 instrumentos pela ordem «da praia para o alto-mar»: <b>POC</b> (a orla costeira) → <b>Litoral XXI</b> (programar as intervenções na zona costeira) → <b>PSOEM</b> (o espaço marítimo todo).' }
  },

    idades2019: { tipo:'barras', titulo:'Estrutura etária da população ativa na pesca (2019, %)', unidade:'%', dados:[['16 a 34 anos',21.5],['35 a 54 anos',56.6],['55 anos e mais',21.9]], fonte:'Manual, p. 262 (INE)' },
    sardinha: { tipo:'texto', titulo:'Luta desigual', texto:'A sardinha é capturada com a arte do cerco (98%). A gestão da pesca da sardinha é realizada por Portugal e Espanha e segue um Plano de Gestão que inclui limitações à captura anual e ao esforço de pesca (máximo de 180 dias de pesca por embarcação e proibição de pesca 2 dias por semana, ao fim de semana), períodos de interdição de captura – época do defeso para a reprodução – e limites à captura de juvenis. O tamanho mínimo de desembarque, 11 cm, está regulamentado a nível europeu.', fonte:'Adaptado do Manual, p. 271 (IPMA)' },
    pescadores: { tipo:'texto', titulo:'Os ativos da pesca', texto:'Nas últimas décadas, a população ativa no setor das pescas tem vindo a diminuir, sendo que a maior parte tem nível baixo de qualificação e idade relativamente avançada, o que se reflete na inovação e na modernização do setor.', fonte:'Adaptado de #EstudoEmCasa, DGE' },
    windfloat: { tipo:'texto', titulo:'WindFloat Atlantic', texto:'É o primeiro parque eólico flutuante semissubmersível do mundo e já está operacional, a fornecer energia limpa à rede elétrica nacional. Deverá gerar energia suficiente para 60 mil utilizadores por ano, evitando a emissão de 1,1 milhões de toneladas de CO2.', fonte:'Adaptado do Manual, p. 281 (Dinheiro Vivo, 2020)' }
  },

  /* Respostas escritas dentro dos mundos (como no teste: «Explica», «Justifica», «Com base no documento…»).
     s = secção da lição depois da qual aparecem; doc = documento ou figura (opcional).
     O aluno escreve, compara com a resposta-modelo e marca os pontos que incluiu. */
  escritas: [
    { id:'e1-1', m:1, s:1, pergunta:'Distingue o mar territorial da zona contígua, indicando os limites e os direitos do Estado em cada um.',
      pontos:['Indica os limites: mar territorial até às 12 mn e zona contígua das 12 às 24 mn (a partir da linha de base).','No mar territorial: soberania sobre o fundo, a coluna de água e o espaço aéreo.','Na zona contígua: só pode fiscalizar para prevenir ou reprimir infrações às suas leis.'],
      modelo:'O mar territorial vai da linha de base (linha da baixa-mar) até às 12 milhas náuticas. Aí o Estado tem soberania sobre o solo e o subsolo marinhos, a coluna de água e o espaço aéreo. A zona contígua vai das 12 às 24 milhas náuticas e aí o Estado já não tem soberania total: pode apenas exercer fiscalização para prevenir ou reprimir infrações às suas leis.' },
    { id:'e1-2', m:1, s:2, pergunta:'Explica a diferença entre a plataforma continental no sentido geológico e no sentido jurídico.',
      pontos:['Sentido geológico: parte submersa da placa continental, com profundidade máxima de 200 m.','Sentido jurídico: leito e subsolo para lá do mar territorial, até às 200 mn ou até ao bordo da margem continental.','Refere que a plataforma jurídica só dá direitos sobre o fundo e pode ir além das 200 mn (proposta de alargamento).'],
      modelo:'No sentido geológico, a plataforma continental é a parte submersa da placa continental, que desce em declive suave até cerca de 200 m de profundidade. No sentido jurídico, definido pela CNUDM, é o leito e o subsolo das áreas submarinas para lá do mar territorial, até às 200 milhas náuticas ou até ao bordo exterior da margem continental. Por isso só dá direitos sobre o fundo (não sobre a água) e pode ir além das 200 mn, como pretende a proposta portuguesa de alargamento.' },
    { id:'e2-1', m:2, s:3, doc:'arriba', pergunta:'Observa o esquema e descreve o processo de recuo da arriba, usando os números.',
      pontos:['A abrasão marinha desgasta a base da arriba (4).','A parte superior fica sem apoio, desmorona-se e a arriba (1) recua.','Os fragmentos formam a plataforma de abrasão (2) e a plataforma de acumulação (3).'],
      modelo:'As ondas arremessam areias e fragmentos rochosos contra a base da arriba (4): é a abrasão marinha. A base fica desgastada e a parte superior da arriba (1) perde o apoio, desmorona-se e a arriba recua. Os fragmentos acumulam-se e formam a plataforma de abrasão (2), que fica visível na maré baixa, e, mais à frente e sempre submersa, a plataforma de acumulação (3).' },
    { id:'e2-2', m:2, s:4, pergunta:'Explica como se formam as restingas e as ilhas-barreira.',
      pontos:['A corrente de deriva litoral (ondas a chegar oblíquas) transporta areias ao longo da costa.','As areias depositam-se onde a corrente perde força e assoreiam a foz dos rios e a entrada das reentrâncias.','Atrás delas ficam áreas lagunares de água salobra (ex.: ria de Aveiro, ria Formosa).'],
      modelo:'As ondas chegam à praia de forma oblíqua e criam a corrente de deriva litoral, que transporta areias ao longo da costa. Onde a corrente perde força, as areias depositam-se e vão assoreando a foz dos rios e a entrada das reentrâncias. Formam-se assim restingas, cordões de areia presos à terra, e ilhas-barreira, cordões soltos paralelos à costa. Atrás delas ficam áreas lagunares de água salobra, como na ria de Aveiro ou na ria Formosa.' },
    { id:'e3-1', m:3, s:2, doc:'cabos', pergunta:'Observa o mapa e explica porque é que muitos portos de mar ficam junto aos cabos assinalados. Dá dois exemplos.',
      pontos:['A costa é pouco recortada e muito exposta a ventos e vagas fortes (poucos abrigos naturais).','Os portos ficam no flanco sul dos cabos, abrigados dos ventos de oeste e noroeste.','Dá dois exemplos certos (cabo Espichel – Sesimbra; cabo Carvoeiro – Peniche; cabo Mondego – Figueira da Foz; cabo de Sines – Sines).'],
      modelo:'A linha de costa do Continente é pouco recortada e está muito exposta a ventos e vagas fortes, por isso há poucos abrigos naturais. Os cabos funcionam como uma barreira: os portos instalam-se no seu flanco sul, protegidos dos ventos de oeste e noroeste e das correntes. Por exemplo, o cabo Espichel abriga o porto de Sesimbra e o cabo Carvoeiro abriga o porto de Peniche.' },
    { id:'e3-2', m:3, s:0, doc:'acidentes', pergunta:'Escolhe dois acidentes do litoral assinalados no mapa, identifica-os e explica como se formaram.',
      pontos:['Identifica corretamente dois acidentes (nome e número).','Explica a formação do primeiro (ex.: tômbolo de Peniche, acumulação de areias e seixos que ligou uma ilha).','Explica a formação do segundo (ex.: ria de Aveiro, recuo do mar e acumulação de sedimentos atrás de uma restinga).'],
      modelo:'O número 3 é o tômbolo de Peniche: Peniche era uma pequena ilha que ficou ligada ao Continente por um istmo formado pela acumulação de areias e seixos. O número 1 é a ria de Aveiro, um sistema lagunar de água salobra separado do mar por uma extensa restinga, que resultou do recuo do mar e da acumulação de sedimentos marinhos e fluviais.' },
    { id:'e4-1', m:4, s:1, pergunta:'Justifica que nas plataformas continentais se façam cerca de 80% das capturas mundiais.',
      pontos:['Pouca profundidade: mais luz.','Águas mais agitadas: mais oxigénio; e água doce dos rios: mais nutrientes e menos sal.','Estas condições favorecem o plâncton, base da cadeia alimentar, e por isso há mais peixe.'],
      modelo:'Nas plataformas continentais a profundidade é pequena, por isso a luz chega a grande parte da água. As águas são mais agitadas e têm mais oxigénio, e recebem a água doce dos rios, com menos sal e muitos nutrientes minerais e orgânicos. Estas condições favorecem a formação de plâncton, que é a base da cadeia alimentar marinha. Por isso há maior quantidade e diversidade de peixe, e é aí que se fazem cerca de 80% das capturas mundiais.' },
    { id:'e4-2', m:4, s:3, doc:'upwelling', pergunta:'Explica porque é que, no verão, a água do mar na costa ocidental é mais fria e porque é que isso é bom para a pesca.',
      pontos:['No verão sopra a nortada, vento forte de norte, que afasta as águas superficiais para o largo.','Sobem águas profundas e frias (upwelling ou afloramento costeiro).','Essas águas trazem nutrientes: mais plâncton, mais e melhor pescado (ex.: sardinha).'],
      modelo:'No verão sopra no litoral ocidental a nortada, um vento forte de norte que afasta as águas superficiais para o largo. Para as substituir, sobem águas profundas e frias: é o upwelling ou afloramento costeiro. Por isso a água nas praias é mais fria. Essas águas trazem muitos nutrientes, que favorecem o plâncton e, por isso, aumentam a quantidade e a qualidade do pescado, como a sardinha, que no verão é mais gorda.' },
    { id:'e5-1', m:5, s:1, doc:'especies2019', pergunta:'Com base no documento, compara o volume de capturas da cavala e da sardinha em 2019 e explica a posição da sardinha.',
      pontos:['Usa os valores: cavala 46 314 t e sardinha 9 670 t (a cavala é quase 5 vezes mais).','Refere que a sardinha ficou só em 4.º lugar.','Explica: redução dos stocks e restrições à captura (quotas desde 2018, defeso, tamanho mínimo).'],
      modelo:'Em 2019, a cavala foi a espécie com maior volume de capturas, com 46 314 toneladas, enquanto a sardinha teve apenas 9 670 toneladas, ou seja, a cavala foi quase cinco vezes mais capturada. A sardinha ficou em 4.º lugar, atrás da cavala, do carapau e dos atuns. Isto explica-se pela redução dos stocks de sardinha e pelas restrições à sua captura, como as quotas desde 2018, a época de defeso e o tamanho mínimo de desembarque.' },
    { id:'e5-2', m:5, s:3, doc:'idades2019', pergunta:'Com base no documento, caracteriza a população ativa na pesca e indica uma consequência para o setor.',
      pontos:['Usa os dados: predomina o grupo dos 35 aos 54 anos (56,6%) e há mais pessoas com 55 ou mais anos (21,9%) do que com 16 a 34 (21,5%).','Refere o envelhecimento e a escolaridade abaixo da média nacional.','Indica uma consequência: menor capacidade de inovar e de aderir aos apoios da PCP (ou a aposta na formação da For-Mar).'],
      modelo:'Segundo o documento, a maior parte dos ativos da pesca tem entre 35 e 54 anos (56,6%), e há mais pessoas com 55 ou mais anos (21,9%) do que jovens dos 16 aos 34 (21,5%). É uma população envelhecida e, segundo o manual, com níveis de escolaridade inferiores à média nacional. Isso reduz a capacidade de inovar, de arriscar e de aderir aos programas de apoio da PCP, o que atrasa a modernização do setor. Por isso aposta-se na formação, por exemplo através da For-Mar.' },
    { id:'e6-1', m:6, s:0, pergunta:'Indica duas vantagens e dois problemas da aquicultura.',
      pontos:['Vantagem: reduz a pressão sobre os recursos marinhos e favorece a sua recuperação.','Outra vantagem: permite repovoar habitats e abastecer o mercado com regularidade.','Dois problemas: poluição por efluentes e resíduos de ração; fuga de espécies invasoras.'],
      modelo:'A aquicultura tem como vantagens reduzir a pressão sobre os recursos marinhos, porque se produz pescado sem o retirar do mar, o que favorece a recuperação dos stocks, e permitir repovoar alguns habitats naturais e abastecer o mercado. Como problemas, pode poluir as águas com efluentes não tratados e com os resíduos das rações, sobretudo no regime intensivo, e as espécies que fogem podem tornar-se invasoras e desequilibrar os ecossistemas.' },
    { id:'e6-2', m:6, s:3, doc:'sardinha', pergunta:'Com base no documento, apresenta três medidas de gestão sustentável da pesca da sardinha e explica para que serve uma delas.',
      pontos:['Apresenta três medidas do documento (limite à captura anual, limite ao esforço de pesca, defeso, limites aos juvenis, tamanho mínimo de 11 cm).','Explica corretamente para que serve uma delas.','Refere que a gestão é feita em conjunto por Portugal e Espanha.'],
      modelo:'A gestão da pesca da sardinha é feita por Portugal e Espanha e inclui, por exemplo, limites à captura anual, limites ao esforço de pesca (no máximo 180 dias por embarcação e proibição de pescar ao fim de semana) e uma época de defeso. O defeso proíbe a captura durante a época de reprodução, para que os peixes se reproduzam e os stocks possam recuperar.' },
    { id:'e7-1', m:7, s:0, pergunta:'Explica de que forma a construção de molhes e de barragens contribui para a erosão costeira.',
      pontos:['Os molhes retêm as areias transportadas pela deriva litoral (de norte para sul).','Há acumulação a norte do molhe e mais erosão a sul.','As barragens retêm os sedimentos dos rios na albufeira: chega menos areia ao mar e as praias emagrecem.'],
      modelo:'Na costa ocidental, a deriva litoral transporta as areias de norte para sul. Os molhes e esporões interrompem esse transporte: as areias acumulam-se a norte da obra e falta areia a sul, onde a erosão aumenta. As barragens retêm os sedimentos dos rios na albufeira, por isso chega menos areia à foz e às praias, que emagrecem e ficam mais expostas ao avanço do mar.' },
    { id:'e7-2', m:7, s:3, doc:'windfloat', pergunta:'Explica em que consiste a Economia Azul e dá dois exemplos de atividades, um deles a partir do documento.',
      pontos:['Define a Economia Azul: atividades económicas associadas ao mar e aos seus recursos, de forma sustentável.','Exemplo do documento: energia eólica no mar (WindFloat Atlantic), energia limpa que evita emissões de CO2.','Dá outro exemplo certo (turismo, pesca, aquicultura, portos, biotecnologia, investigação…).'],
      modelo:'A Economia Azul é o conjunto das atividades económicas associadas ao mar e aos seus recursos, desenvolvidas de forma sustentável. Um exemplo é a produção de energia renovável no mar, como o WindFloat Atlantic, o primeiro parque eólico flutuante semissubmersível do mundo, que produz energia limpa e evita emissões de CO2. Outro exemplo é o turismo ligado ao mar, como a observação de cetáceos nos Açores.' }
  ],

  perguntas: [
    /* ---------------- Mundo 1: zonas marítimas, ZEE e plataforma ---------------- */
    { id:'m1-01', m:1, s:1, t:'mc', destaque:true, q:'O mar territorial estende-se até…', o:['12 milhas náuticas a partir da linha de base','24 milhas náuticas a partir da linha de base','200 milhas náuticas a partir da linha de base','200 metros de profundidade'], e:'O mar territorial vai até às 12 mn, medidas a partir da linha de base (linha da baixa-mar).' },
    { id:'m1-02', m:1, s:1, t:'mc', destaque:true, q:'A Zona Económica Exclusiva (ZEE) estende-se…', o:['desde o limite do mar territorial até às 200 milhas náuticas','desde a linha de base até às 24 milhas náuticas, incluindo a zona contígua','desde o limite da zona contígua até aos 200 metros de profundidade','das 12 às 24 milhas náuticas, medidas a partir da linha da baixa-mar'], e:'A ZEE começa no limite do mar territorial (12 mn) e vai até às 200 mn.' },
    { id:'m1-03', m:1, s:1, t:'mc', q:'Na zona contígua, o Estado costeiro pode…', o:['fiscalizar para prevenir ou reprimir infrações às suas leis','exercer soberania total sobre o solo, a coluna de água e o espaço aéreo','explorar em exclusivo os recursos do subsolo, sem poder fiscalizar navios','proibir a entrada de qualquer navio estrangeiro, mesmo de passagem'], e:'Na zona contígua (12 a 24 mn), o Estado pode exercer fiscalização sobre infrações às suas leis.' },
    { id:'m1-04', m:1, s:1, t:'mc', q:'Em que zona marítima o Estado tem soberania sobre o solo e subsolo marinhos, a coluna de água e o espaço aéreo?', o:['Mar territorial','Zona contígua','Zona Económica Exclusiva','Plataforma continental'], e:'É no mar territorial (até 12 mn) que a soberania do Estado é total.' },
    { id:'m1-05', m:1, s:1, t:'mc', q:'Na ZEE, o Estado costeiro tem direitos de…', o:['exploração, investigação e gestão dos recursos naturais','soberania total sobre a água, o fundo e o espaço aéreo, como em terra','fiscalização aduaneira e sanitária, mas não de exploração dos recursos','exploração do solo e do subsolo, mas não da coluna de água nem dos peixes'], e:'Na ZEE o Estado tem direitos de exploração, investigação e gestão dos recursos naturais.' },
    { id:'m1-06', m:1, s:0, t:'mc', q:'Uma milha náutica corresponde a…', o:['1,852 km','1 km','1,609 km','2 km'], e:'1 mn = 1,852 km (o manual dá esta nota no Doc. 1 da p. 242).' },
    { id:'m1-07', m:1, s:0, t:'mc', q:'A CNUDM é…', o:['a Convenção das Nações Unidas sobre o Direito do Mar, assinada em 1982','a Comissão das Nações Unidas que aprova o alargamento das plataformas continentais','o programa europeu de gestão das pescas, criado na década de setenta','o plano português que ordena os usos e as atividades do espaço marítimo'], e:'A CNUDM (1982) define as regras da soberania dos Estados sobre as águas e a gestão dos recursos marinhos.' },
    { id:'m1-08', m:1, s:2, t:'mc', destaque:true, q:'A plataforma continental, no sentido geológico, é…', o:['a parte submersa da placa continental, com profundidade máxima de 200 m','a faixa de mar que vai desde a linha de base até às 200 milhas náuticas','a descida acentuada do fundo do mar entre os 200 e os 2000 m de profundidade','o leito e o subsolo marinhos até ao bordo exterior da margem continental'], e:'No sentido geológico, é a parte submersa da placa continental, até cerca de 200 m de profundidade.' },
    { id:'m1-09', m:1, s:2, t:'mc', destaque:true, q:'O que distingue a ZEE da plataforma continental no sentido jurídico?', o:['Na ZEE há direitos sobre o fundo, a água e o ar; na plataforma jurídica só sobre o solo e o subsolo','Na ZEE só há direitos sobre o solo e o subsolo; na plataforma jurídica há direitos sobre o fundo, a água e o ar','A ZEE vai até às 24 mn e a plataforma jurídica vai sempre até às 200 mn, sem nunca as ultrapassar','São a mesma área com nomes diferentes: ambas dão soberania total sobre o fundo e a coluna de água'], e:'A plataforma continental jurídica abrange só o leito e o subsolo; a ZEE inclui também a coluna de água e o espaço aéreo.' },
