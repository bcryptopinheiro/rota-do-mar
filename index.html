    { id:'c04', m:1, aberta:false, frente:'12 – 24 – 200', verso:'12 mn: fim do mar territorial (soberania).\n24 mn: fim da zona contígua (fiscalização).\n200 mn: fim da ZEE (recursos).', exemplo:'1 mn = 1,852 km.' },
    { id:'c05', m:1, aberta:false, frente:'Plataforma continental (sentido geológico)', verso:'Parte submersa da placa continental, com profundidade máxima de 200 m, de declive suave até ao talude continental.', exemplo:'Em Portugal continental: 30 a 70 km de largura.' },
    { id:'c06', m:2, aberta:true, frente:'Caracteriza a linha de costa de Portugal continental.', verso:'Tem cerca de 1200 km e é predominantemente alta e pouco recortada. Predomina a costa de arriba, em rochas duras (granito, xisto, calcário): arriba baixa de Caminha a Esposende; arriba alta da Nazaré à foz do Tejo, do cabo Espichel à foz do Sado, do cabo de Sines ao de São Vicente e no barlavento algarvio. A costa de praia, em rochas brandas, ocupa menor extensão: Espinho–São Pedro de Moel, estuário do Tejo, foz do Sado–Sines e sotavento algarvio.', exemplo:'Arquipélagos: predomina a arriba alta.' },
    { id:'c07', m:2, aberta:true, frente:'Descreve o processo de recuo de uma arriba viva.', verso:'A abrasão marinha (ondas que arremessam areia e fragmentos) desgasta a base da arriba, retirando o apoio à parte superior, que se desmorona: a arriba recua. Os fragmentos acumulam-se na base e formam a plataforma de abrasão (visível na maré baixa); mais à frente, sempre submersa, fica a plataforma de acumulação. Quando a arriba deixa de sofrer abrasão, torna-se uma arriba morta.', exemplo:'Exercício 1.2.a da p. 254 (imagem A).' },
    { id:'c08', m:2, aberta:false, frente:'Erosão marinha vs. abrasão marinha', verso:'Erosão marinha: processo de desgaste, transporte e acumulação feito pelo mar.\nAbrasão marinha: erosão reforçada pelo arremesso de areia e fragmentos contra as arribas vivas.', exemplo:'A abrasão funciona como uma lixa.' },
    { id:'c09', m:2, aberta:false, frente:'Corrente de deriva litoral', verso:'Corrente provocada pela aproximação oblíqua das ondas à praia, que transporta areias, poluentes e objetos ao longo da costa. Na costa ocidental desloca as areias de norte para sul.', exemplo:'Forma praias, restingas e ilhas-barreira.' },
    { id:'c10', m:2, aberta:false, frente:'Cabos e baías', verso:'Cabos: nas rochas mais resistentes (recuam devagar).\nEnseadas e pequenas baías: nas rochas mais brandas (recuam depressa).', exemplo:'«Rocha dura faz cabo, rocha mole faz baía.»' },
    { id:'c11', m:2, aberta:false, frente:'Regressão e transgressão marinhas', verso:'Regressão: o mar recua e áreas submersas emergem (costas de emersão).\nTransgressão: o mar avança e submerge áreas continentais (costas de submersão).', exemplo:'Caminha–Esposende: costa de emersão.' },
    { id:'c12', m:3, aberta:true, frente:'Explica a localização da maioria dos portos de pesca em Portugal.', verso:'A linha de costa do Continente é pouco recortada e muito exposta a ventos e vagas fortes, oferecendo poucos abrigos naturais. Por isso, a maioria dos portos localiza-se no flanco sul dos cabos, que os abrigam dos ventos de oeste e noroeste e das correntes (ex.: cabo Espichel – Sesimbra; cabo Carvoeiro – Peniche), ou em estuários e sistemas lagunares (Setúbal, Aveiro, Olhão). Foi ainda preciso construir molhes e pontões.', exemplo:'Exercício 4 da p. 254.' },
    { id:'c13', m:3, aberta:false, frente:'Ria de Aveiro', verso:'Sistema lagunar de água salobra, na foz do Vouga, separado do mar por uma extensa restinga. Formou-se pelo recuo do mar e pela acumulação de sedimentos marinhos e fluviais.', exemplo:'Pesca e salicultura.' },
    { id:'c14', m:3, aberta:false, frente:'Tômbolo de Peniche', verso:'Pequena ilha ligada ao Continente por um istmo formado pela acumulação de areias e seixos.', exemplo:'O cabo Carvoeiro abriga o porto de Peniche.' },
    { id:'c15', m:3, aberta:false, frente:'Concha de São Martinho do Porto', verso:'Antigo golfo cuja entrada ficou cada vez mais apertada pela deposição de areias e seixos: pequena baía em forma de concha.', exemplo:'Acidente do litoral (deposição).' },
    { id:'c16', m:3, aberta:false, frente:'Ria Formosa (ou de Faro)', verso:'Sistema lagunar de restingas e ilhas-barreira, formado pela acumulação de sedimentos marinhos. Pesca, aquicultura, salicultura e atividade portuária.', exemplo:'Fica no sotavento algarvio (costa de praia).' },
    { id:'c17', m:3, aberta:false, frente:'Singularidades dos arquipélagos', verso:'Fajãs (terrenos planos à beira-mar, de materiais das vertentes ou de lava); deltas lávicos (Seixal); piscinas naturais (Mosteiros); vulcão dos Capelinhos (1957, Faial); Arco de São Jorge; praia de areia branca e cordão dunar do Porto Santo.', exemplo:'São Jorge tem mais de 70 fajãs.' },
    { id:'c18', m:3, aberta:true, frente:'Identifica as formas de relevo da imagem A (arriba a ser desgastada pelo mar) e B (terreno plano à beira-mar com uma laguna) e descreve a formação de B.', verso:'A: arriba viva, em recuo por abrasão marinha. B: fajã (com laguna de água salobra, como a Caldeira de Santo Cristo, em São Jorge). Formou-se com os materiais desprendidos das vertentes, que se acumularam junto ao mar e formaram um terreno plano.', exemplo:'Exercício 1 da p. 254.' },
    { id:'c19', m:4, aberta:true, frente:'Justifica que nas plataformas continentais se façam cerca de 80% das capturas mundiais.', verso:'Nas plataformas continentais há pouca profundidade (mais luz), águas mais agitadas (mais oxigénio) e receção de água doce dos rios (menos sal e mais nutrientes minerais e orgânicos). Estas condições favorecem a formação de plâncton, base da cadeia alimentar, e por isso há maior quantidade e diversidade de espécies.', exemplo:'Manual, p. 252, exercício 1.' },
    { id:'c20', m:4, aberta:true, frente:'Descreve o fenómeno do upwelling.', verso:'No verão, a nortada (vento forte de norte) sopra no litoral ocidental e afasta as águas superficiais para o largo. Forma-se uma corrente de compensação de águas profundas, frias e ricas em nutrientes, que sobem à superfície (afloramento costeiro). Os nutrientes favorecem o plâncton e aumentam a quantidade e a qualidade do pescado (ex.: sardinha mais gorda no verão).', exemplo:'Exercício 5 da p. 254.' },
    { id:'c21', m:4, aberta:true, frente:'Explica a influência dos fatores naturais na disponibilidade de recursos piscatórios na ZEE portuguesa.', verso:'Plataforma continental estreita no Continente e quase inexistente nas ilhas (origem vulcânica): fator desfavorável, porque reduz a área rica em pescado. Corrente de Portugal (quente, segundo o manual): desfavorável, pobre em nutrientes; mas a sudoeste junta-se à corrente fria das Canárias: favorável (mais agitação e oxigenação). Upwelling no verão, por efeito da nortada: muito favorável, porque traz águas frias e ricas em nutrientes.', exemplo:'Tabela da p. 253.' },
    { id:'c22', m:4, aberta:false, frente:'Nortada: situação meteorológica', verso:'Vento forte de norte no litoral ocidental, no verão. Resulta do anticiclone dos Açores (altas pressões, deslocado para norte) e de uma depressão térmica no interior da Península Ibérica (baixas pressões por aquecimento). O ar desloca-se das altas para as baixas pressões.', exemplo:'Não está nas páginas do manual enviadas: confirma nos apontamentos.' },
    { id:'c23', m:4, aberta:false, frente:'Plâncton', verso:'Organismos microscópicos vegetais (fitoplâncton) ou animais (zooplâncton). Base da cadeia alimentar marinha.', exemplo:'Precisa de luz, oxigénio e nutrientes.' },
    { id:'c24', m:5, aberta:true, frente:'Caracteriza a situação atual da atividade piscatória em Portugal (frota, tipos de pesca, mão de obra, lotas).', verso:'Frota: tem diminuído, para se adequar aos recursos; predominam embarcações pequenas (cerca de 90% com menos de 5 GT) e de pesca local; há modernização e reconversão para o turismo. Tipos de pesca: local, costeira e do largo. Mão de obra: diminuiu, é envelhecida e com escolaridade abaixo da média, o que dificulta a inovação. Capturas: volume com oscilações e valor a subir; em volume destacam-se cavala, carapau e atuns; em valor, polvo e atuns (2019). Portos e lotas modernizados, com leilão eletrónico e fiscalização.', exemplo:'Essencial da p. 263 e síntese da p. 281.' },
    { id:'c25', m:5, aberta:true, frente:'Compreende a importância dos acordos bilaterais na diversificação das áreas de pesca.', verso:'A costa regular e a plataforma continental estreita limitam os recursos da ZEE portuguesa. Os acordos de pesca (no âmbito da PCP, com países terceiros) permitem à frota pescar em pesqueiros externos, de águas internacionais ou de soberania estrangeira, diversificando as áreas de pesca, obtendo espécies que não temos (ex.: bacalhau, cantarilho) e mantendo a frota do largo e o emprego, desde que se cumpram as normas acordadas.', exemplo:'Manual, pp. 257–258.' },
    { id:'c26', m:5, aberta:false, frente:'Pesca local, costeira e do largo', verso:'Local: águas interiores e perto da costa, barcos < 9 m, artes artesanais, espécies de maior valor.\nCosteira: além das 6 mn, barcos de 9 a 33 m, meios modernos.\nDo largo: além das 12 mn, águas internacionais e ZEE estrangeiras, ≥ 100 GT, ≥ 15 dias, navio-fábrica.', exemplo:'Associação da p. 270: a-5; b-1 e 3; c-2 e 4.' },
    { id:'c27', m:5, aberta:true, frente:'Explica o facto de a sardinha aparecer apenas em 4.º lugar no volume de capturas (2019).', verso:'Devido à redução dos stocks de sardinha e às restrições à sua captura (quotas desde 2018, defeso, limites ao esforço de pesca e tamanho mínimo), a sardinha deixou os primeiros lugares para a cavala, o carapau e os atuns.', exemplo:'Atenção: em 2024 voltou ao 1.º lugar (INE).' },
    { id:'c28', m:5, aberta:false, frente:'Espécies: volume e valor (manual, 2019)', verso:'Volume: 1.º cavala, 2.º carapau, 3.º atuns, 4.º sardinha, 5.º biqueirão.\nValor: polvos e atuns à frente.', exemplo:'O polvo é caro: alcatruzes, muita mão de obra, pouca quantidade.' },
    { id:'c29', m:5, aberta:false, frente:'Política Comum das Pescas (PCP)', verso:'Conjunto de acordos e regras da UE (desde os anos 70) para gerir as frotas e conservar as espécies. Igualdade de acesso às águas comunitárias; acordos com países terceiros; financiada pelo FEAMP (2021–2027).', exemplo:'Quotas: sardinha desde 2018, bacalhau desde 2021.' },
    { id:'c30', m:5, aberta:false, frente:'Lota', verso:'Local do leilão e da primeira venda do pescado. A rede de lotas usa sistemas eletrónicos: venda mais rápida e transparente, compradores à distância.', exemplo:'Fiscalização: segurança alimentar, quotas, tamanhos mínimos.' },
    { id:'c31', m:5, aberta:false, frente:'Mão de obra na pesca', verso:'Diminuiu muito; estabilizou em cerca de 18 mil e voltou a descer (14,6 mil em 2019) pela redução das quotas da sardinha. Mais envelhecida e menos escolarizada do que a média nacional. Mais pescadores no Norte e no Centro.', exemplo:'A For-Mar dá formação para rejuvenescer e qualificar.' },
    { id:'c32', m:6, aberta:true, frente:'Caracteriza o setor da aquicultura em Portugal.', verso:'O número de estabelecimentos diminuiu, mas a produção cresceu. Pratica-se sobretudo em águas salobras ou marinhas (rias de Aveiro e de Faro). Predomina o regime extensivo, com moluscos (amêijoas e ostras), sobretudo no Algarve; o regime intensivo, de peixes (pregado, dourada, robalo), está na Madeira e no Centro e tende a crescer. Reduz a pressão sobre os stocks, mas tem riscos (efluentes, espécies invasoras).', exemplo:'Manual, pp. 266–267.' },
    { id:'c33', m:6, aberta:false, frente:'Regimes de aquicultura', verso:'Extensivo: alimentação só natural, pouco impacte.\nSemi-intensivo: natural + suplementos artificiais.\nIntensivo: controlo total, ração artificial, forte impacte.', exemplo:'Extensivo: amêijoas na ria Formosa. Intensivo: pregado em tanques.' },
    { id:'c34', m:6, aberta:false, frente:'Indústria transformadora do pescado', verso:'Congelados: 1.º em produção, o mais recente.\nPreparados e conservas: produz menos, mas é o único com saldo positivo (atum, sardinha).\nSalga e secagem: quase só bacalhau.\nMais implantada no Norte e no Centro.', exemplo:'Portugal é o maior consumidor mundial de bacalhau.' },
    { id:'c35', m:6, aberta:false, frente:'Salicultura', verso:'Produção de sal marinho por evaporação solar em salinas, sobretudo no Algarve (sol e calor) e no Centro (rias). Sal comum (97%, meios mecânicos), sal tradicional (manual) e flor de sal (cristais que flutuam, o mais requintado).', exemplo:'Perde salinas por falta de mão de obra.' },
    { id:'c36', m:6, aberta:true, frente:'Aponta medidas sustentáveis de gestão dos recursos piscícolas.', verso:'Respeitar as quotas de pesca (limites às capturas); épocas de defeso para a reprodução; tamanhos mínimos de desembarque; malhagens mínimas das redes; limites ao esforço de pesca e às capturas acessórias; fiscalização e monitorização dos recursos; desenvolver a aquicultura com rações apropriadas e tratamento de efluentes.', exemplo:'Sardinha: gestão Portugal-Espanha, 180 dias de pesca, defeso, 11 cm.' },
    { id:'c37', m:7, aberta:true, frente:'Problematiza a pressão sobre a zona costeira.', verso:'A litoralização e o turismo aumentam a pressão urbana sobre a linha de costa. Constrói-se sobre dunas e arribas, o que impede a fixação da vegetação e acelera o recuo das arribas. Molhes e esporões retêm areias a norte e agravam a erosão a sul; as barragens retêm os sedimentos dos rios; a subida do nível do mar agrava a erosão. Há ainda poluição marítima (efluentes, tráfego, lavagem de porões), sobre-exploração dos recursos e riscos da aquicultura.', exemplo:'Áreas de maior erosão = de maior ocupação (Espinho–Cortegaça, Caparica…).' },
    { id:'c38', m:7, aberta:true, frente:'Identifica programas de gestão da zona costeira e do mar.', verso:'Programas da Orla Costeira (POC), que substituíram os POOC e regulam os usos da orla costeira; Plano de Ação Litoral XXI, base para programar as intervenções de gestão integrada da zona costeira; Plano de Situação do Ordenamento do Espaço Marítimo (PSOEM), que ordena os usos do espaço marítimo.', exemplo:'POC Alcobaça–Cabo Espichel.' },
    { id:'c39', m:7, aberta:true, frente:'Aponta soluções para um desenvolvimento sustentado das atividades na zona costeira.', verso:'Limites à construção (altura, dimensão, densidade); corrigir construções sobre dunas e arribas; passadiços sobrelevados; regulamentar atividades (indústria, desportos motorizados); reforço sedimentar, proteções rígidas e estabilização de arribas; vigilância (pesca ilegal, lavagem de porões); monitorização das águas e dos recursos; fiscalização de quotas, defeso, malhagens e tamanhos mínimos.', exemplo:'Manual, p. 279.' },
    { id:'c40', m:7, aberta:true, frente:'Equaciona medidas de potencialização/valorização do litoral.', verso:'Turismo ordenado e sustentável (praias, observação de cetáceos, mergulho, passeios); eventos desportivos (vela, surf); expedições científicas; energias renováveis marinhas (eólica flutuante como o WindFloat Atlantic, ondas e marés); aproveitamento de recursos biológicos (pescado, algas, sal), minerais e culturais (património subaquático); dessalinização.', exemplo:'Manual, pp. 278 e 281.' },
    { id:'c41', m:7, aberta:true, frente:'Explicita em que consiste a Economia Azul (Economia do Mar).', verso:'É o conjunto das atividades económicas associadas ao mar e aos seus recursos (pesca, aquicultura, indústria do pescado, portos e transportes, turismo, energias renováveis, biotecnologia, investigação), desenvolvidas de forma sustentável, com gestão integrada que concilia o estudo, a orla costeira, a valorização, a população e as suas atividades, a preservação e os recursos marinhos.', exemplo:'Em 2019, a pesca marítima era 6,1% do VAB da economia do mar.' },
    { id:'c42', m:7, aberta:false, frente:'Ordenamento da orla costeira', verso:'Organizar onde e como se pode construir e usar a faixa costeira, para proteger pessoas, bens e natureza e compatibilizar as atividades. Faz-se através dos POC.', exemplo:'Definir limites para a construção junto à praia.' }
  ],

  /* Simulação do Teste: formato do teste real, segundo a tipologia da professora
     (escolha múltipla, V/F, completamento, associação, ordenação, resposta curta/restrita e extensa,
     com documentos: textos, gráficos, mapas e figuras). Cotações em valores (total 20). */
  simulacao: {
    grupos:[
      { nome:'Grupo I',   tipo:'Escolha múltipla (com documentos)', k:'mc',       n:10, cotacao:5, nDoc:4 },
      { nome:'Grupo II',  tipo:'Verdadeiro ou falso',               k:'vf',       n:8,  cotacao:2 },
      { nome:'Grupo III', tipo:'Completamento',                     k:'completa', n:4,  cotacao:2 },
      { nome:'Grupo IV',  tipo:'Associação e ordenação',            k:'assoc',    n:2,  cotacao:2 },
      { nome:'Grupo V',   tipo:'Legendar um mapa ou esquema',       k:'mapa',     n:1,  cotacao:2 },
      { nome:'Grupo VI',  tipo:'Resposta curta / restrita',         k:'curta',    n:2,  cotacao:3 },
      { nome:'Grupo VII', tipo:'Resposta extensa',                  k:'extensa',  n:1,  cotacao:4 }
    ],
    ligar:['processos','cabos','tipospesca','servicos','industria','programas'],
    ordenar:['arriba','upwelling','laguna','peixe'],
    mapas:['acidentes','portos','cabos','zonas','arriba','fundo','upwelling'],
    curtas:[
      { id:'k1', pergunta:'Explica a localização da maioria dos portos de pesca em Portugal continental.', pontos:['Refere que a costa é pouco recortada e exposta a ventos e vagas fortes (poucos abrigos naturais).','Refere que os portos ficam no flanco sul dos cabos, abrigados dos ventos de oeste e noroeste (ou em estuários e lagunas).','Dá um exemplo (cabo Espichel – Sesimbra; cabo Carvoeiro – Peniche…).'],
        modelo:'A linha de costa do Continente é pouco recortada e muito exposta a ventos e vagas fortes, por isso há poucos abrigos naturais. A maioria dos portos localiza-se no flanco sul dos cabos, que os abrigam dos ventos de oeste e noroeste, como Sesimbra, abrigado pelo cabo Espichel, ou Peniche, pelo cabo Carvoeiro. Outros ficam em estuários e sistemas lagunares, como Setúbal ou Aveiro.' },
      { id:'k2', pergunta:'Descreve o fenómeno do upwelling e indica a sua importância para a pesca.', pontos:['Refere a nortada (vento forte de norte, no verão) que afasta as águas superficiais para o largo.','Refere a subida de águas profundas, frias e ricas em nutrientes (corrente de compensação).','Refere que é muito favorável: mais plâncton, mais e melhor pescado (ex.: sardinha).'],
        modelo:'No verão, a nortada, um vento forte de norte, sopra no litoral ocidental e afasta as águas superficiais para o largo. Para as substituir, sobem águas profundas, frias e ricas em nutrientes: é o upwelling ou afloramento costeiro. Os nutrientes favorecem o plâncton e, por isso, aumentam a quantidade e a qualidade do pescado, como a sardinha, que fica mais gorda no verão.' },
      { id:'k3', pergunta:'Distingue a ZEE da plataforma continental em sentido jurídico.', pontos:['A ZEE vai do limite do mar territorial até às 200 mn.','Na ZEE o Estado tem direitos sobre o fundo, a coluna de água e o espaço aéreo (exploração, investigação e gestão dos recursos).','A plataforma jurídica abrange só o solo e o subsolo e pode ir além das 200 mn (até ao bordo da margem continental).'],
        modelo:'A ZEE estende-se desde o limite do mar territorial até às 200 milhas náuticas e inclui o solo e o subsolo marinhos, a coluna de água e o espaço aéreo; aí o Estado tem direitos de exploração, investigação e gestão dos recursos naturais. A plataforma continental, no sentido jurídico, abrange apenas o leito e o subsolo marinhos, até às 200 mn ou até ao bordo exterior da margem continental, podendo por isso ir além das 200 mn, como pretende a proposta portuguesa de alargamento.' },
      { id:'k4', pergunta:'Descreve o processo de recuo de uma arriba viva.', pontos:['Refere a abrasão marinha (arremesso de areias e fragmentos) que desgasta a base.','Refere o desmoronamento da parte superior e o recuo da arriba.','Refere a plataforma de abrasão (e/ou de acumulação) ou a arriba morta.'],
        modelo:'A abrasão marinha, provocada pelas ondas que arremessam areias e fragmentos rochosos, desgasta a base da arriba viva e retira o apoio à parte superior, que se desmorona: a arriba recua. Os fragmentos acumulam-se na base e formam a plataforma de abrasão, visível na maré baixa, e, mais à frente e sempre submersa, a plataforma de acumulação. Quando deixa de sofrer abrasão, a arriba passa a ser uma arriba morta.' },
      { id:'k5', pergunta:'Explica por que razão o polvo lidera o valor das capturas, apesar de não estar entre as espécies mais capturadas em volume.', pontos:['Refere a captura com armadilhas (alcatruzes), técnica especializada.','Refere que exige mais mão de obra e as capturas são pouco volumosas.','Relaciona com o preço elevado por quilo.'],
        modelo:'O polvo lidera em valor porque é capturado sobretudo com armadilhas (alcatruzes), uma técnica especializada, típica da pesca local, que exige mais mão de obra. Como as capturas são pouco volumosas e a procura é grande, o preço por quilo é elevado, o que faz com que gere mais dinheiro do que espécies capturadas em muito maior quantidade, como a cavala.' },
      { id:'k6', pergunta:'Indica duas consequências da construção de molhes e esporões na linha de costa.', pontos:['Acumulação de areias a norte da obra (retém a deriva litoral).','Maior erosão / redução dos areais a sul.'],
        modelo:'Os molhes e esporões retêm as areias transportadas pela deriva litoral, que na costa ocidental se desloca de norte para sul. Por isso, há acumulação de areia a norte da obra e falta de areia a sul, onde a erosão costeira aumenta e as praias emagrecem.' },
      { id:'k7', pergunta:'Caracteriza a mão de obra do setor das pescas em Portugal.', pontos:['Refere a diminuição do número de pescadores (ex.: redução das quotas da sardinha).','Refere o envelhecimento e a baixa escolaridade, abaixo da média nacional.','Refere a consequência: menor capacidade de inovar e modernizar (ou a aposta na formação, For-Mar).'],
        modelo:'O número de pescadores diminuiu muito, estabilizou em cerca de 18 mil e voltou a descer em 2018–2019, sobretudo pela redução das quotas da sardinha. Os pescadores são mais envelhecidos e têm níveis de escolaridade inferiores à média nacional, o que reduz a capacidade de inovar, de arriscar e de aderir aos apoios da PCP. Por isso, aposta-se na formação, por exemplo através da For-Mar.' },
      { id:'k8', pergunta:'Distingue o regime extensivo do regime intensivo de aquicultura.', pontos:['Extensivo: alimentação exclusivamente natural, pouco impacte (ex.: amêijoas, ostras, Algarve).','Intensivo: controlo total e alimentação exclusivamente artificial, forte impacte (ex.: pregado, dourada, robalo).'],
        modelo:'No regime extensivo, a alimentação é exclusivamente natural e o impacte ambiental é reduzido; predomina em Portugal, sobretudo com moluscos como as amêijoas e as ostras, no Algarve. No regime intensivo há controlo total das condições de criação e a alimentação é exclusivamente artificial, o que gera muitos resíduos e um forte impacte ambiental; produz sobretudo peixes, como pregado, dourada e robalo, na Madeira e no Centro.' }
    ],
    pontos:[
      'Usa vocabulário geográfico rigoroso e organiza a resposta em parágrafos.',
      'Dá exemplos concretos de Portugal (lugares, espécies, portos, programas).'
    ],
    extensas:[
      { id:'x1', pergunta:'Explica a influência dos fatores naturais na disponibilidade de recursos piscatórios na ZEE portuguesa.', pontos:['Explica porque a plataforma continental é rica (luz, oxigénio, nutrientes dos rios, plâncton).','Refere que a plataforma portuguesa é estreita (30–70 km) e quase inexistente nas ilhas: desfavorável.','Refere a Corrente de Portugal (quente, pobre em nutrientes: desfavorável) e o encontro com a corrente fria das Canárias (favorável).','Explica o upwelling (nortada, águas profundas frias e ricas em nutrientes): muito favorável.','Conclui sobre o balanço dos fatores (recursos limitados, mas com períodos de grande abundância, como a sardinha no verão).'],
        modelo:'A abundância de peixe depende dos nutrientes e da formação de plâncton, a base da cadeia alimentar marinha. As plataformas continentais são as áreas mais ricas, porque a pouca profundidade dá mais luz, as águas agitadas têm mais oxigénio e os rios trazem água doce com nutrientes.\nEm Portugal, a plataforma continental é estreita (cerca de 30 a 70 km no Continente, mais larga ao largo do cabo da Roca) e quase inexistente nos Açores e na Madeira, por causa da sua origem vulcânica. É um fator desfavorável, porque a área rica em pescado é pequena.\nAo largo passa a Corrente de Portugal, um ramo da Deriva do Atlântico Norte que, segundo o manual, é quente e pobre em nutrientes: fator desfavorável. Contudo, a sudoeste junta-se à corrente fria das Canárias, o que aumenta a agitação e a oxigenação das águas: fator favorável.\nPor fim, no verão, a nortada afasta as águas superficiais para o largo e sobem águas profundas, frias e ricas em nutrientes (upwelling). É um fator muito favorável, que aumenta a quantidade e a qualidade do pescado, como a sardinha.\nEm conclusão, apesar da grande ZEE, os recursos piscatórios são limitados, mas o upwelling garante períodos de grande abundância junto à costa ocidental.' },
      { id:'x2', pergunta:'Caracteriza a situação atual da atividade piscatória em Portugal, referindo a frota, os tipos de pesca, a mão de obra e as capturas, e indica medidas para a sua sustentabilidade.', pontos:['Caracteriza a frota (diminuição, predomínio de embarcações pequenas/pesca local, modernização, reconversão para turismo).','Distingue pesca local, costeira e do largo.','Caracteriza a mão de obra (diminuição, envelhecimento, baixa escolaridade).','Refere as capturas (volume com oscilações e valor a subir; cavala/carapau/atuns em volume, polvo/atuns em valor; quotas).','Aponta medidas sustentáveis (quotas, defeso, tamanhos mínimos, malhagens, fiscalização, aquicultura).'],

  /* Teste final: quantas perguntas de cada tipo (total 20) */
  testeFinal: { perguntas:14, classificar:6, minDestaque:6 },

  mensagens: {

/* =====================================================================
   MOTOR DO JOGO
   ===================================================================== */
const C = CONTEUDO;
const NM = C.mundos.length; // número de mundos
const CHAVE = 'rota-do-mar-v1';
// prog: jogos a meio (mundos "m1"…"m7", "teste", "sim"), para continuar onde se parou
// abertos: mundos já desbloqueados (continuam abertos mesmo que se recomece o anterior)
const base = () => ({ xp:0, mundos:{}, erros:{}, cartoes:{}, recordes:{}, teste:null, prog:{}, abertos:[], def:{ fundo:true, som:false, mar:false, vibrar:false } });
function carregar(){ try { const r = localStorage.getItem(CHAVE); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function guardar(){ try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch(e){} }
let S = base();
const lido = carregar();
if (lido && typeof lido === 'object') S = Object.assign(base(), lido);
S.def = Object.assign(base().def, S.def || {});

const ITENS = {};
C.perguntas.forEach(p => { ITENS[p.id] = p; });
Object.keys(C.classificar).forEach(k => {
  const set = C.classificar[k];
  set.itens.forEach((it, i) => { it.id = k + '-' + (i + 1); it.t = 'cl'; it.set = k; it.m = set.mundo; ITENS[it.id] = it; });
});

const TIPOS = { mc:'Escolha múltipla', vf:'Verdadeiro ou falso', completa:'Completa a frase', cl:'Classifica' };
const $ = s => document.querySelector(s);
const $app = $('#app');
let TIMERS = [];
let combo = 0;

function limpar(){ TIMERS.forEach(clearInterval); TIMERS = []; fecharMateria(); document.body.classList.remove('foco'); VOLTAR = inicio; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function baralhar(a){ const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function sorte(a){ return a[Math.floor(Math.random() * a.length)]; }
function topo(){ try { window.scrollTo({ top:0 }); } catch(e){ window.scrollTo(0, 0); } }

const STAR = '<path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/>';
function estrelasHTML(n){ return '<span class="stars" aria-label="' + n + ' de 3 estrelas">' + [0,1,2].map(i => '<svg viewBox="0 0 24 24" class="' + (i < n ? 'on' : '') + '">' + STAR + '</svg>').join('') + '</span>'; }
const LOCK = '<svg viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V8a3 3 0 0 0-6 0z"/></svg>';

/* ---------- XP, níveis, mensagens ---------- */
function nivel(xp){
  let i = 0; C.niveis.forEach((n, k) => { if (xp >= n.xp) i = k; });
  const cur = C.niveis[i], prox = C.niveis[i + 1];
  return { i, nome:cur.nome, prog: prox ? (xp - cur.xp) / (prox.xp - cur.xp) : 1, falta: prox ? prox.xp - xp : 0, prox };
}
function toast(msg, cls){
  const t = document.createElement('div'); t.className = 'toast ' + (cls || ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2000);
}
function mostrarCombo(){ const el = $('#pcombo'); if (el) el.textContent = combo >= 2 ? combo + ' seguidas' : ''; }
function acerto(){
  const antes = nivel(S.xp).i;
  S.xp += 10; combo++;
  let msg = '+10 XP';
  if (combo % 5 === 0){ S.xp += 5; msg += ' · +5 bónus (' + combo + ' seguidas!)'; }
  guardar(); toast(msg, 'xp'); mostrarCombo();
  FUNDO.squishTodos(); // animação do fundo (o som toca à parte, mesmo com o fundo desligado)
  const depois = nivel(S.xp).i;
  tocar('certo'); vibrar(12);
  if (depois > antes){ setTimeout(() => toast('Subiste para o Nível ' + (depois + 1) + ': ' + C.niveis[depois].nome + '!'), 400); setTimeout(() => tocar('nivel'), 350); }
}
function erro(id){
  combo = 0; mostrarCombo(); tocar('errado'); vibrar([18, 40, 18]);
  if (id){ S.erros[id] = { s:0 }; guardar(); }
}

/* ---------- Botão «voltar» do telemóvel/browser ----------
   Em vez de sair do jogo, recua: pergunta anterior, cartão anterior, matéria anterior ou início. */
let VOLTAR = null, histArmado = false, ignorarPop = false;
function armarVoltar(fn){
  VOLTAR = fn;
  if (!histArmado){ try { history.pushState({ dc:1 }, ''); histArmado = true; } catch(e){} }
}
function desarmarVoltar(){
  VOLTAR = null;
  if (histArmado){ histArmado = false; ignorarPop = true; try { history.back(); } catch(e){ ignorarPop = false; } }
}
addEventListener('popstate', () => {
  if (ignorarPop){ ignorarPop = false; return; }
  histArmado = false;
  if (document.getElementById('sheet')){ fecharMateria(); if (VOLTAR) armarVoltar(VOLTAR); return; }
  const f = VOLTAR; VOLTAR = null; if (f) f();
});

/* ---------- Estado dos mundos ---------- */
function infoMundo(n){ return S.mundos[n] || { best:0, est:0 }; }
function desbloqueado(n){ return true; }
function temProgresso(n){ return !!S.mundos[n] || !!S.prog['m' + n]; }
/* Recomeçar um mundo: apaga as estrelas e a pergunta onde se ia; os mundos já abertos continuam abertos */
function recomecarMundo(n){
  C.mundos.forEach(m => { if (desbloqueado(m.n) && S.abertos.indexOf(m.n) < 0) S.abertos.push(m.n); });
  delete S.mundos[n]; delete S.prog['m' + n]; guardar();
}
/* Confirmação com 2 toques (o confirm() não funciona em todos os browsers dentro de apps) */
function doisToques(btn, msg, acao){
  let armado = false, tm = 0; const txt = btn.textContent;
  btn.onclick = () => {
    if (armado){ clearTimeout(tm); acao(); return; }
    armado = true; btn.textContent = msg; btn.classList.add('armado');
    tm = setTimeout(() => { armado = false; btn.textContent = txt; btn.classList.remove('armado'); }, 4000);
  };
}
/* Jogos a meio: as perguntas guardam-se pelo id; as respostas, pelo texto da opção escolhida */
function progOk(ch){
  const p = S.prog[ch]; if (!p) return false;
  if (p.passos && p.passos.every(x => x.k !== 'q' || ITENS[x.id])) return true;
  delete S.prog[ch]; guardar(); return false;
}
const serPasso = p => p.k === 'q' ? { k:'q', id:p.it.id } : p;
const desPasso = p => p.k === 'q' ? { k:'q', it:ITENS[p.id] } : p;
const serRes = x => x.Q ? { c:x.c, ok:x.ok, id:x.Q.id, esc:x.Q.opts[x.i].txt } : x.texto != null ? { c:x.c, texto:x.texto, marcados:x.marcados } : { c:x.c };
function desResposta(x){ const Q = preparar(ITENS[x.id]); return { ok:x.ok, Q, i:Math.max(0, Q.opts.findIndex(o => o.txt === x.esc)) }; }
const desRes = (x, p) => x.id ? Object.assign({ p, c:x.c }, desResposta(x)) : Object.assign({ p }, x);
let pedirReset = 0; // mundo cujo "Recomeçar?" está aberto no mapa
function estrelas(p){ return p >= 0.95 ? 3 : p >= 0.85 ? 2 : p >= 0.7 ? 1 : 0; }

/* Minijogos soltos do ecrã inicial: [código, nome] */
const MINIS = [].concat(
  Object.keys(C.classificar).map(k => ['sprint:' + k, C.classificar[k].titulo]),
  Object.keys(C.figuras).map(k => ['mapa:' + k, 'Legenda: ' + C.figuras[k].titulo.replace(/ \(.*\)$/, '')]),
  Object.keys(C.ordenar).map(k => ['ordem:' + k, 'Ordena: ' + C.ordenar[k].titulo]),
  Object.keys(C.ligar).map(k => ['ligar:' + k, C.ligar[k].titulo])
);
/* Mundo (tema) de cada minijogo, para o botão "Matéria" */
function temaMini(cod){
  const [k, set] = cod.split(':');
  const fonte = k === 'sprint' ? C.classificar : k === 'ordem' ? C.ordenar : k === 'ligar' ? C.ligar : null;
  if (fonte && fonte[set] && fonte[set].mundo) return fonte[set].mundo;
  const m = C.mundos.find(x => x.especiais.some(e => e.k === k && e.set === set));
  return m ? m.n : 0;
}

/* Partes de matéria de um mundo: grupos de secções da lição (as secções com minijogo ficam de fora) */
function partesMundo(n){
  const m = C.mundos[n - 1], L = C.licoes[n];
  if (m.partes) return m.partes.map(g => g.filter(i => L.seccoes[i] && !L.seccoes[i].quiz)).filter(g => g.length);
  return L.seccoes.map((s, i) => i).filter(i => !L.seccoes[i].quiz).map(i => [i]);
}
/* Minutos estimados para um mundo (matéria + perguntas + desafios + resposta escrita) */
function minutos(n){
  const m = C.mundos[n - 1], escrita = (C.escritas || []).some(e => e.m === n) ? 4 : 0;
  return Math.max(5, Math.round((partesMundo(n).length * 1.5 + m.nPerguntas * 0.5 + m.especiais.length * 1.5 + escrita) / 5) * 5);
}
const listaMundos = ms => { const t = ms.map(m => 'Mundo ' + m.n); return t.length > 1 ? t.slice(0, -1).join(', ') + ' e ' + t[t.length - 1] : t[0]; };

/* O botão «Continuar»: o próximo passo certo para o aluno */
function proximoPasso(){
  const emCurso = C.mundos.find(m => progOk('m' + m.n));
  if (emCurso){ const pg = S.prog['m' + emCurso.n]; return { t:'Continuar o Mundo ' + emCurso.n, d:esc(emCurso.titulo) + ' · passo ' + (pg.k + 1) + ' de ' + pg.passos.length, f:() => jogarMundo(emCurso.n) }; }
  if (simValida(S.prog.sim)) return { t:'Continuar a Simulação', d:esc(descreverSim(S.prog.sim)), f:simulacao };
  const prox = C.mundos.find(m => desbloqueado(m.n) && infoMundo(m.n).best < 0.7);
  if (prox) return { t:(S.mundos[prox.n] ? 'Repetir o Mundo ' : 'Começar o Mundo ') + prox.n, d:esc(prox.titulo) + ' · ≈ ' + minutos(prox.n) + ' min', f:() => jogarMundo(prox.n) };
  if (!S.simulacao) return { t:'Fazer a Simulação do Teste', d:'Já passaste todos os mundos: agora treina como no teste real.', f:simulacao };
  const ne = errosAtivos().length;
  if (ne) return { t:'Rever os erros', d:ne + (ne === 1 ? ' pergunta' : ' perguntas') + ' para dominar', f:revisao };
  return { t:'Fazer outra Simulação', d:'Melhor nota: ' + virgula(S.simulacao.melhor) + ' valores', f:simulacao };
}

/* Plano até ao teste: o aluno diz a data e o jogo diz o que fazer hoje */
function htmlPlano(){
  const d = S.def.dataTeste;
  if (!d) return '<section class="plano"><p class="pl-t">Quando é o teste?</p><p class="small muted">Diz a data e o jogo diz-te o que fazer em cada dia.</p>' +
    '<div class="pl-row"><input type="date" id="pl-data" aria-label="Data do teste"><button class="btn" id="pl-ok" type="button">Guardar</button></div></section>';
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dt = new Date(d + 'T00:00:00'), dias = Math.round((dt - hoje) / 864e5);
  const falta = C.mundos.filter(m => infoMundo(m.n).best < 0.7);
  let txt;
  if (dias < 0) txt = 'O teste já passou. Se tiveres outro, muda a data.';
  else if (dias === 0) txt = '<b>O teste é hoje!</b> Nada de matéria nova: lê os cartões de resposta aberta e faz a revisão dos erros.';
  else if (dias === 1) txt = '<b>O teste é amanhã.</b> Hoje: ' + (falta.length ? 'acaba o ' + listaMundos(falta) + ' e depois ' : '') + 'faz a Simulação do Teste e a revisão dos erros.';
  else {
    const hojeM = falta.slice(0, Math.ceil(falta.length / (dias - 1)));
    txt = '<b>Faltam ' + dias + ' dias.</b> ' + (hojeM.length ? 'Hoje: ' + listaMundos(hojeM) + ' (≈ ' + hojeM.reduce((s, m) => s + minutos(m.n), 0) + ' min).' : 'Já fizeste os mundos todos: faz a Simulação e a revisão dos erros.') +
      ' Na véspera: Simulação do Teste e revisão dos erros.';
  }
  return '<section class="plano"><p class="pl-t">Plano até ao teste · ' + esc(dt.toLocaleDateString('pt-PT', { day:'numeric', month:'long' })) + '</p><p>' + txt + '</p>' +
    '<button class="link-b" id="pl-mudar" type="button">Mudar a data</button></section>';
}

/* =====================================================================
   ECRÃ INICIAL — primeiro o botão «Continuar»; o resto está arrumado em secções que abrem
   ===================================================================== */
function inicio(){
  limpar(); desarmarVoltar(); combo = 0; topo();
  const pr = pedirReset; pedirReset = 0; // "Recomeçar o Mundo n?" só fica aberto até à próxima ação
  const nv = nivel(S.xp);
  const nErros = errosAtivos().length;
  const nSabidos = C.cartoes.filter(c => S.cartoes[c.id] === 1).length;
  const meander = '<div class="meander" aria-hidden="true"><svg preserveAspectRatio="none"><defs><pattern id="mq" width="24" height="12" patternUnits="userSpaceOnUse"><path d="M0 7Q6 1 12 7T24 7" fill="none" stroke="currentColor" stroke-width="1.6"/></pattern></defs><rect width="100%" height="12" fill="url(#mq)"/></svg></div>';
  const px = proximoPasso(), relax = S.def.som && S.def.mar;

  const mundos = C.mundos.map(m => {
    const inf = infoMundo(m.n), livre = desbloqueado(m.n), feito = inf.best >= 0.7, pg = progOk('m' + m.n) && S.prog['m' + m.n];
    return '<li><div class="mrow"><button class="mundo ' + (feito ? 'feito' : '') + '" data-m="' + m.n + '" ' + (livre ? '' : 'disabled') + ' type="button">' +
      '<span class="no" aria-hidden="true">' + m.letra + '</span>' +
      '<span class="tx"><span class="eyebrow">Mundo ' + m.n + ' · ≈ ' + minutos(m.n) + ' min</span><span class="tt">' + esc(m.titulo) + '</span><span class="rs">' + esc(m.resumo) + '</span>' +
      '<span class="rw">' + (livre ? estrelasHTML(inf.est) +
          (pg ? '<span class="chip cont">continua no passo ' + (pg.k + 1) + ' de ' + pg.passos.length + '</span>' : inf.best ? '<span class="pct">melhor: ' + Math.round(inf.best * 100) + '%</span>' : '')
        : '<span class="chip lock">' + LOCK + 'Faz 70% no Mundo ' + (m.n - 1) + ' para abrir</span>') +
      '</span></span></button>' +
      (temProgresso(m.n) ? '<button class="reset-b" data-reset="' + m.n + '" type="button" aria-label="Recomeçar o Mundo ' + m.n + '" title="Recomeçar este mundo">↺</button>' : '') + '</div>' +
      (pr === m.n ? '<div class="confirma" id="confirma"><p>Recomeçar o <b>Mundo ' + m.n + '</b>? Perdes as estrelas' + (pg ? ' e o passo onde ias' : '') + '. Os outros mundos continuam abertos.</p>' +
        '<div class="acts"><button class="btn danger" id="rs-sim" type="button">Sim, recomeçar</button><button class="btn ghost" id="rs-nao" type="button">Cancelar</button></div></div>' : '') + '</li>';
  }).join('');

  const pt = progOk('teste') && S.prog.teste, ps = simValida(S.prog.sim) && S.prog.sim;
  const resets = [];
  if (pt) resets.push(['r-teste', '↺ Recomeçar o teste final']);
  if (ps) resets.push(['r-simul', '↺ Recomeçar a simulação']);
  if (nErros) resets.push(['r-erros', 'Limpar a revisão dos erros (' + nErros + ')']);

/* =====================================================================
   PALCO (barra de topo) e PERGUNTAS
   ===================================================================== */
function palco(titulo, modo, chave, materiaN){
  limpar(); topo();
  $app.innerHTML = '<div class="wrap" style="gap:12px"><header class="playbar"><button class="icon-btn" id="sair" type="button" aria-label="Sair para o início">✕</button>' +
    '<button class="icon-btn" id="pant" type="button" aria-label="Ver o passo anterior" title="Passo anterior" hidden>←</button>' +
    '<div class="pb-mid"><p class="pb-title">' + esc(titulo) + '</p><div class="bar"><i id="pbar"></i></div></div>' +
    '<button class="mat-b" id="pmat" type="button" hidden>Matéria</button>' +
    '<div class="pb-right"><span id="pcount"></span><span class="pb-combo" id="pcombo"></span></div></header><main class="stage" id="stage"></main></div>';
  const sair = () => { const guardado = chave && S.prog[chave]; inicio(); if (guardado) toast('Fica guardado: continuas onde paraste.'); };
  $('#sair').onclick = sair;
  armarVoltar(sair);
  mostrarCombo();
  // "Matéria": rever a lição do tema sem sair do jogo (não aparece no teste nem na simulação)
  let alvo = 0; const mb = $('#pmat'), pa = $('#pant');
  const setMateria = n => { alvo = n; mb.hidden = modo === 'teste' || !(n && C.licoes[n]); };
  mb.onclick = () => abrirMateria(alvo);
  setMateria(materiaN);
  return { body:$('#stage'), modo:modo || 'normal', setMateria, sair,
    setVoltar(fn){ armarVoltar(fn); },
    setAnterior(mostrar, fn){ pa.hidden = !mostrar; pa.onclick = fn; },
    prog(f, l){ $('#pbar').style.width = (f * 100) + '%'; $('#pcount').textContent = l || ''; } };
}

function preparar(it){
  if (it.t === 'vf') return { id:it.id, t:'vf', q:it.q, e:it.e, opts:[{ txt:'Verdadeiro', ok:it.a === true }, { txt:'Falso', ok:it.a === false }] };
  if (it.t === 'cl'){
    const set = C.classificar[it.set];
    return { id:it.id, t:'cl', q:'Classifica: “' + it.x + '”', e:it.e || set.porque[it.c], opts:set.cats.map(c => ({ txt:c.l, ok:c.k === it.c })) };
  }
  return { id:it.id, t:it.t, q:it.q, e:it.e, opts:baralhar(it.o.map((txt, i) => ({ txt, ok:i === 0 }))) };
}
function fmtQ(q){ return esc(q).replace('___', '<span class="blank">______</span>'); }

function telaPergunta(ctx, it, done, op){
  op = op || {};
  const Q = op.Q || preparar(it), teste = ctx.modo === 'teste';
  const letras = Q.t === 'vf' ? ['V','F'] : ['A','B','C','D'];
  ctx.body.innerHTML = '<article class="q pop-in"><p class="tag">' + (op.tag || TIPOS[Q.t]) + '</p>' + (it.doc ? htmlDoc(it.doc, false) : '') + '<h2 class="qtext' + (Q.q.length > 150 ? ' longa' : '') + '">' + fmtQ(Q.q) + '</h2>' +
    '<div class="opts ' + (Q.t === 'vf' ? 'vf' : '') + '">' + Q.opts.map((o, i) => '<button class="opt" data-i="' + i + '" type="button"><span class="key">' + letras[i] + '</span><span>' + esc(o.txt) + '</span></button>').join('') + '</div>' +
    '<div class="fb" hidden></div></article>';
  const btns = Array.from(ctx.body.querySelectorAll('.opt'));
  if (op.escolhido != null && btns[op.escolhido]) btns[op.escolhido].classList.add('picked');
  let feito = false;
  btns.forEach(b => b.onclick = () => {
    if (feito) return; feito = true;
    const i = +b.dataset.i, ok = Q.opts[i].ok;
    btns.forEach(x => { x.disabled = true; x.classList.remove('picked'); });
    if (teste){ b.classList.add('picked'); setTimeout(() => done(ok, Q, i), 320); return; }
    if (op.onResp) op.onResp(ok, Q, i);
    const ci = Q.opts.findIndex(o => o.ok);
    btns[ci].classList.add('right'); if (!ok) b.classList.add('wrong');
    const blank = ctx.body.querySelector('.blank');
    if (blank){ blank.textContent = Q.opts[ci].txt; blank.classList.add('filled'); }
    if (ok) acerto(); else erro(Q.id);
    const fb = ctx.body.querySelector('.fb');
    fb.hidden = false; fb.className = 'fb pop-in ' + (ok ? 'is-ok' : 'is-bad');
    fb.innerHTML = '<p class="fb-msg">' + esc(sorte(ok ? C.mensagens.certo : C.mensagens.errado)) + '</p>' + (Q.e ? '<p class="fb-e">' + esc(Q.e) + '</p>' : '') + '<button class="btn primary" type="button">Continuar</button>' +
      (!ok && C.licoes[it.m] ? '<button class="link-b" data-mat type="button">Rever a matéria deste tema</button>' : '');
    const nb = fb.querySelector('.btn');
    const mt = fb.querySelector('[data-mat]'); if (mt) mt.onclick = () => abrirMateria(it.m);
    nb.onclick = () => done(ok, Q, i);
    try { nb.focus({ preventScroll:true }); fb.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch(e){}
  });
}

function nomeMini(p){
  if (p.k === 'sprint') return C.classificar[p.set].titulo;
  if (p.k === 'ligar') return C.ligar[p.set].titulo;
  if (p.k === 'ordem') return C.ordenar[p.set].titulo;
  if (p.k === 'mapa') return C.figuras[p.set].titulo;
  return 'Desafio';
}
/* Um passo já feito: a tua resposta, a certa e a explicação (ou a matéria, ou o texto que escreveste) */
function htmlRevisto(x, titulo){
  if (x.p && x.p.k === 'licao'){
    const L = C.licoes[x.p.n], secs = [].concat(x.p.i).map(i => L.seccoes[i]).filter(Boolean);

  }
  if (x.p && x.p.k === 'escrita'){
    const dev = (C.escritas || []).find(e => e.id === x.p.id) || { pergunta:'', modelo:'' };
    return '<article class="mini pop-in"><p class="tag">' + esc(titulo) + ' · resposta escrita</p><h2 class="qtext longa">' + esc(dev.pergunta) + '</h2>' +
      (x.texto != null ? '<p class="col-h">A tua resposta</p><div class="caixa">' + (x.texto ? esc(x.texto) : '<span class="muted">(sem resposta)</span>') + '</div>' : '') +
      '<p class="col-h">Resposta-modelo</p><div class="caixa modelo">' + esc(dev.modelo) + '</div><p class="fb-msg">Marcaste ' + Math.round(x.c * 100) + '% dos pontos.</p></article>';
  }
  if (!x.Q) return '<article class="mini pop-in"><p class="tag">' + esc(titulo) + '</p><h2 class="qtext">' + esc(nomeMini(x.p)) + '</h2><p class="fb-msg">Já feito: ' + Math.round(x.c * 100) + '% certo.</p></article>';
  const Q = x.Q, letras = Q.t === 'vf' ? ['V','F'] : ['A','B','C','D'], it = ITENS[Q.id];
  return '<article class="q pop-in"><p class="tag">' + esc(titulo) + '</p>' + (it && it.doc ? htmlDoc(it.doc, false) : '') + '<h2 class="qtext' + (Q.q.length > 150 ? ' longa' : '') + '">' + fmtQ(Q.q) + '</h2><div class="opts' + (Q.t === 'vf' ? ' vf' : '') + '">' +
    Q.opts.map((o, i) => '<button class="opt' + (o.ok ? ' right' : i === x.i ? ' wrong' : '') + '" type="button" disabled><span class="key">' + letras[i] + '</span><span>' + esc(o.txt) + (i === x.i ? ' <b>← a tua resposta</b>' : '') + '</span></button>').join('') + '</div>' +
    '<div class="fb ' + (x.ok ? 'is-ok' : 'is-bad') + '"><p class="fb-msg">' + (x.ok ? 'Acertaste.' : 'Erraste.') + '</p>' + (Q.e ? '<p class="fb-e">' + esc(Q.e) + '</p>' : '') + '</div></article>';
}
/* Lista de todas as respostas, no fim de um mundo ou de um teste */
function htmlRespostas(res, titulo){

  return '<details class="respostas"><summary>' + esc(titulo) + (qs.length ? ' (' + qs.filter(x => x.ok).length + ' de ' + qs.length + ' certas)' : '') + '</summary><div class="revlist">' +
    res.map((x, j) => x.Q
      ? '<div class="revitem ' + (x.ok ? 'ok' : 'mal') + '"><p class="qq">' + (j + 1) + '. ' + (x.ok ? '✓ ' : '✗ ') + esc(x.Q.q.replace('___', '______')) + '</p><p class="' + (x.ok ? 'ce' : 'tu') + '">A tua resposta: ' + esc(x.Q.opts[x.i].txt) + '</p>' +
        (x.ok ? '' : '<p class="ce">Resposta certa: ' + esc(x.Q.opts.find(o => o.ok).txt) + '</p>') + (x.Q.e ? '<p>' + esc(x.Q.e) + '</p>' : '') + '</div>'
      : '<div class="revitem"><p class="qq">' + (j + 1) + '. ' + (x.p && x.p.k === 'escrita' ? 'Resposta escrita' : 'Desafio: ' + esc(nomeMini(x.p))) + '</p><p>' + Math.round(x.c * 100) + (x.p && x.p.k === 'escrita' ? '% dos pontos' : '% certo') + '</p></div>').join('') + '</div></details>';
}

/* ---------- Sequência de passos (mundos, minijogos, teste) ----------
   ← (ou o «voltar» do telemóvel) mostra os passos já feitos. No teste final pode mudar-se a resposta. */
function jogar(titulo, passos, fim, modo, chave, materiaN){
  const ctx = palco(titulo, modo, chave, materiaN);
  const teste = modo === 'teste';
  let k = 0, res = [], xp0 = S.xp, pend = null; // pend: pergunta atual já respondida, à espera de «Continuar»
  const sv = chave && S.prog[chave];
  if (sv){ passos = sv.passos.map(desPasso); k = sv.k; xp0 = S.xp - (sv.xp || 0); res = sv.res.map((x, j) => desRes(x, passos[j])); }
  const cred = () => res.reduce((t, x) => t + x.c, 0);
  const conta = () => passos.filter(p => p.k !== 'licao').length; // as partes de matéria não contam para a nota
  const gravar = () => { if (chave){ S.prog[chave] = { passos:passos.map(serPasso), k, cred:cred(), xp:S.xp - xp0, res:res.map(serRes) }; guardar(); } };
  const pararTimers = () => { TIMERS.forEach(clearInterval); TIMERS = []; };
  const recuar = j => { if (j > 0) mostrar(j - 1); else ctx.sair(); };
  const done = (c, extra) => { pend = null; res.push(Object.assign({ p:passos[k], c }, extra || {})); k++; gravar(); passo(); };
  function passo(){
    topo(); document.body.classList.remove('foco'); ctx.setMateria(materiaN);
    if (k >= passos.length){ if (chave){ delete S.prog[chave]; guardar(); } return fim({ cred:cred(), total:conta(), res, xp:S.xp - xp0 }); }
    ctx.prog(k / passos.length, (k + 1) + '/' + passos.length);
    ctx.setAnterior(k > 0, () => mostrar(k - 1));
    ctx.setVoltar(() => recuar(k));
    const p = passos[k];
    if (p.k === 'licao') telaParte(ctx, p, passos[k + 1], () => done(0));
    else if (p.k === 'q'){
      if (pend){
        ctx.body.innerHTML = htmlRevisto(pend, 'Pergunta ' + (k + 1)) + '<div class="acts"><button class="btn primary" id="rv-cont" type="button">Continuar</button></div>';
        $('#rv-cont').onclick = () => done(pend.ok ? 1 : 0, pend); return;
      }
      telaPergunta(ctx, p.it, (ok, Q, i) => done(ok ? 1 : 0, { ok, Q, i }), { onResp:(ok, Q, i) => { pend = { ok, Q, i, p }; } });
    }
    else if (p.k === 'escrita') telaEscrita(ctx, p.id, done);
    else if (p.k === 'ordem') telaOrdem(ctx, p.set, done);
    else if (p.k === 'mapa') telaMapa(ctx, p.set, null, null, c => done(c));
    else if (p.k === 'ligar') telaLigar(ctx, p.set, done);
    else if (p.k === 'sprint') telaSprint(ctx, p.set, done);
  }
  function mostrar(j){
    pararTimers(); topo();
    const x = res[j], ultimo = j + 1 >= k, ehMateria = x.p && x.p.k === 'licao';
    document.body.classList.toggle('foco', !!ehMateria); ctx.setMateria(ehMateria ? 0 : materiaN);
    const seguinte = () => ultimo ? passo() : mostrar(j + 1);
    const txtSeg = ultimo ? 'Voltar ao passo onde ias →' : 'Seguinte →';
    ctx.prog(j / passos.length, (j + 1) + '/' + passos.length);
    ctx.setAnterior(j > 0, () => mostrar(j - 1));
    ctx.setVoltar(() => recuar(j));
    if (teste && x.Q){ // no teste podes mudar a resposta, como num teste em papel
      telaPergunta(ctx, x.p.it, (ok, Q, i) => { Object.assign(x, { ok, Q, i, c:ok ? 1 : 0 }); gravar(); seguinte(); }, { Q:x.Q, escolhido:x.i, tag:'Pergunta ' + (j + 1) + ' · podes mudar a resposta' });
      ctx.body.querySelector('.q').insertAdjacentHTML('beforeend', '<div class="acts"><button class="btn ghost" id="rv-seg" type="button">' + (ultimo ? txtSeg : 'Seguinte sem mudar →') + '</button></div>');
    } else {
      ctx.body.innerHTML = htmlRevisto(x, 'Passo ' + (j + 1) + (ehMateria ? '' : ' · já feito')) + '<div class="acts"><button class="btn primary" id="rv-seg" type="button">' + txtSeg + '</button></div>';
    }
    $('#rv-seg').onclick = seguinte;
  }
  passo();
}

/* Passos de um mundo: parte de matéria → perguntas sobre essa parte (e, às vezes, uma resposta escrita) → parte seguinte…
   e, no fim, os desafios. Cada pergunta tem "s" (a secção onde a matéria é explicada), por isso nunca aparece antes dela. */
function passosMundo(n, comMateria){
  const m = C.mundos[n - 1], partes = partesMundo(n);
  const pools = partes.map(g => baralhar(C.perguntas.filter(p => p.m === n && g.indexOf(p.s) >= 0)));
  const total = pools.reduce((a, b) => a + b.length, 0);
  const quotas = pools.map(p => p.length ? Math.max(1, Math.round(m.nPerguntas * p.length / total)) : 0);
  const soma = () => quotas.reduce((a, b) => a + b, 0);
  while (soma() > m.nPerguntas){ const j = quotas.indexOf(Math.max.apply(null, quotas)); quotas[j]--; }
  while (soma() < m.nPerguntas){ let j = -1, folga = 0; pools.forEach((p, i) => { if (p.length - quotas[i] > folga){ folga = p.length - quotas[i]; j = i; } }); if (j < 0) break; quotas[j]++; }
  const escrita = sorte((C.escritas || []).filter(e => e.m === n));
  const passos = [];
  partes.forEach((g, j) => {
    if (comMateria) passos.push({ k:'licao', n, i:g, parte:j + 1, de:partes.length });
    pools[j].slice(0, quotas[j]).sort((a, b) => g.indexOf(a.s) - g.indexOf(b.s)).forEach(it => passos.push({ k:'q', it }));
    if (escrita && g.indexOf(escrita.s) >= 0) passos.push({ k:'escrita', id:escrita.id });
  });
  return passos.concat(m.especiais.map(e => Object.assign({}, e)));
}

function jogarMundo(n, soPerguntas){
  const m = C.mundos[n - 1];
  combo = 0;
  if (progOk('m' + n)) return jogar('Mundo ' + n + ' · ' + m.titulo, [], r => fimMundo(n, r), 'normal', 'm' + n, n);
  if (soPerguntas == null) return telaInicioMundo(n);
  jogar('Mundo ' + n + ' · ' + m.titulo, passosMundo(n, !soPerguntas), r => fimMundo(n, r), 'normal', 'm' + n, n);
}

function fimMundo(n, r){
  const pct = r.total ? r.cred / r.total : 0, est = estrelas(pct);
  const prev = infoMundo(n);
  const abriaAntes = n < NM && desbloqueado(n + 1);
  S.mundos[n] = { best:Math.max(prev.best || 0, pct), est:Math.max(prev.est || 0, est) };
  if (n < NM && pct >= 0.7 && S.abertos.indexOf(n + 1) < 0) S.abertos.push(n + 1);
  guardar();
  const abriuAgora = n < NM && !abriaAntes && desbloqueado(n + 1);
  const m = C.mundos[n - 1];
  let msg;
  if (est === 3) msg = 'Perfeito! Dominas este mundo.';
  else if (est === 2) msg = 'Muito bom! Falta pouco para as 3 estrelas.';
  else if (est === 1) msg = 'Passaste! Repete para ganhar mais estrelas.';
  else msg = 'Precisas de 70% para passar. Os erros já estão na revisão: cada tentativa fica mais fácil.';
  limpar(); topo();
  $app.innerHTML = '<div class="wrap"><section class="res pop-in"><p class="eyebrow">Mundo ' + n + ' · ' + esc(m.titulo) + '</p>' +
    estrelasHTML(est) + '<p class="big">' + Math.round(pct * 100) + '<small>%</small></p><h2>' + esc(msg) + '</h2>' +
    (abriuAgora ? '<p class="aviso">Desbloqueaste o Mundo ' + (n + 1) + ': <b>' + esc(C.mundos[n].titulo) + '</b></p>' : '') +
    '<div class="stats"><span>+' + r.xp + ' XP</span><span>melhor: ' + Math.round(S.mundos[n].best * 100) + '%</span></div>' + htmlRespostas(r.res, 'Ver as tuas respostas') +
    '<div class="acts">' + (n < NM && desbloqueado(n + 1) ? '<button class="btn primary" id="r-prox" type="button">Mundo ' + (n + 1) + '</button>' : '') +
    '<button class="btn" id="r-rep" type="button">Jogar outra vez</button><button class="btn ghost" id="r-ini" type="button">Voltar ao mapa</button></div></section></div>';
  const prox = $('#r-prox'); if (prox) prox.onclick = () => jogarMundo(n + 1);
  $('#r-rep').onclick = () => jogarMundo(n);
  $('#r-ini').onclick = inicio;
  if (est === 3) setTimeout(confetis, 250);
}

/* ---------- Classifica rápido ---------- */
function telaSprint(ctx, key, done){
  const set = C.classificar[key], DUR = 60;
  ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">Classifica rápido · 60 segundos</p><h2 class="qtext">' + esc(set.titulo) + '</h2><p class="lead">' + esc(set.instrucao) + '</p>' +
    '<ul class="hint">' + set.cats.map(c => '<li><b>' + esc(c.l) + '</b>: ' + esc(c.dica) + '</li>').join('') + '</ul>' +
    '<p class="lead small">Acertos seguidos fazem combo. Recorde atual: ' + (S.recordes[key] || 0) + ' certas.</p>' +
    '<button class="btn primary big" id="go" type="button">Começar</button></article>';
  $('#go').onclick = comecar;

  function comecar(){
    let pool = [], cur = null, certos = 0, total = 0, cmb = 0, maxc = 0, ativo = true;
    const errados = [], fimT = Date.now() + DUR * 1000;
    ctx.body.innerHTML = '<article class="sprint"><div class="sp-top"><div class="timer"><i id="tbar"></i></div><span class="sp-time" id="ttxt">60</span></div>' +
      '<div class="sp-stats"><span>Certas: <b id="sc">0</b></span><span class="combo" id="scombo"></span></div>' +
      '<div class="sp-card" id="scard"><p id="stxt"></p></div>' +
      '<div class="sp-btns n' + set.cats.length + '">' + set.cats.map(c => '<button class="btn sp-b" data-k="' + c.k + '" type="button">' + esc(c.l) + '</button>').join('') + '</div></article>';
    const card = $('#scard'), txt = $('#stxt');
    const anima = cls => { card.classList.remove('in', 'ok', 'bad'); void card.offsetWidth; card.classList.add(cls); };
    const novo = () => {
      if (!pool.length){ pool = baralhar(set.itens); if (pool.length > 1 && pool[pool.length - 1] === cur) pool.unshift(pool.pop()); }
      cur = pool.pop(); txt.textContent = cur.x;
    };
    ctx.body.querySelectorAll('.sp-b').forEach(b => b.onclick = () => {
      if (!ativo) return;
      total++;
      const ok = b.dataset.k === cur.c;
      if (ok){ certos++; cmb++; maxc = Math.max(maxc, cmb); acerto(); }
      else { cmb = 0; erro(cur.id); errados.push(cur); }
      anima(ok ? 'ok' : 'bad');
      $('#sc').textContent = certos;
      $('#scombo').textContent = cmb >= 2 ? 'Combo ×' + cmb : '';
      novo();
    });
    const tick = () => {
      const left = Math.max(0, fimT - Date.now());
      $('#tbar').style.width = (left / (DUR * 10)) + '%';
      $('#ttxt').textContent = Math.ceil(left / 1000);
      if (left <= 0) terminar();
    };
    const iv = setInterval(tick, 100); TIMERS.push(iv);
    novo(); anima('in'); tick();

    function terminar(){
      if (!ativo) return; ativo = false; clearInterval(iv);
      const rec = S.recordes[key] || 0, novoRec = certos > rec;
      if (novoRec){ S.recordes[key] = certos; guardar(); }
      const pct = total ? certos / total : 0;
      const unicos = errados.filter((x, i) => errados.indexOf(x) === i);
      const nomeCat = k => set.cats.find(c => c.k === k).l;
      ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">Tempo!</p><h2 class="qtext">' + certos + ' certas em ' + total + '</h2>' +
        '<div class="stats" style="justify-content:flex-start"><span>precisão ' + Math.round(pct * 100) + '%</span><span>maior combo ×' + maxc + '</span><span>' + (novoRec ? 'novo recorde!' : 'recorde: ' + rec) + '</span></div>' +
        (unicos.length ? '<div><p class="col-h">Para rever</p><ul class="lista-err">' + unicos.map(x => '<li>“' + esc(x.x) + '” → <b>' + esc(nomeCat(x.c)) + '</b></li>').join('') + '</ul></div>' : (total ? '<p class="fb-msg" style="color:var(--ok)">Sem erros. Impressionante!</p>' : '<p class="lead">Não respondeste a nenhuma frase. Tenta outra vez!</p>')) +
        '<button class="btn primary big" id="sp-ok" type="button">Continuar</button></article>';
      $('#sp-ok').onclick = () => done(pct);
    }
  }
}

/* ---------- Ordena o argumento ---------- */
function telaOrdem(ctx, key, done){
  const O = C.ordenar[key], L = O.linhas;
  let pecas = baralhar(L.map((_, i) => i));
  while (pecas.every((v, i) => v === i)) pecas = baralhar(pecas);
  let resp = [];
  const render = () => {
    ctx.body.innerHTML = '<article class="mini"><p class="tag">Ordena</p><h2 class="qtext">' + esc(O.titulo) + '</h2><p class="lead">' + esc(O.instrucao) + '</p>' +
      '<ol class="slots">' + L.map((_, j) => { const v = resp[j];
        return '<li class="slot ' + (v == null ? 'empty' : '') + '"><span class="sn">' + (j + 1) + '.</span>' +
          (v == null ? '<span class="ph">' + (j === resp.length ? 'Toca numa frase abaixo' : '') + '</span>' : '<button class="slot-b" data-j="' + j + '" type="button">' + esc(L[v]) + '</button>') + '</li>'; }).join('') + '</ol>' +
      '<div class="pecas">' + pecas.filter(i => resp.indexOf(i) < 0).map(i => '<button class="peca" data-i="' + i + '" type="button">' + esc(L[i]) + '</button>').join('') + '</div>' +
      '<div class="acts">' + (resp.length === L.length ? '<button class="btn primary" id="ver" type="button">Verificar</button>' : '') + (resp.length ? '<button class="btn ghost" id="lim" type="button">Recomeçar</button>' : '') + '</div>' +
      '<div class="fb" hidden></div></article>';
    ctx.body.querySelectorAll('.peca').forEach(b => b.onclick = () => { resp.push(+b.dataset.i); render(); });
    ctx.body.querySelectorAll('.slot-b').forEach(b => b.onclick = () => { resp.splice(+b.dataset.j, 1); render(); });
    const lim = $('#lim'); if (lim) lim.onclick = () => { resp = []; render(); };
    const ver = $('#ver'); if (ver) ver.onclick = verificar;
  };
  const verificar = () => {
    const slots = ctx.body.querySelectorAll('.slot');
    let hits = 0;
    resp.forEach((v, j) => { const ok = v === j; if (ok) hits++; slots[j].classList.add(ok ? 'right' : 'wrong'); });
    ctx.body.querySelectorAll('.slot-b').forEach(b => b.disabled = true);
    ctx.body.querySelector('.acts').innerHTML = '';
    const tudo = hits === L.length;
    if (tudo) acerto(); else erro();
    const fb = ctx.body.querySelector('.fb');
    fb.hidden = false; fb.className = 'fb pop-in ' + (tudo ? 'is-ok' : 'is-bad');
    fb.innerHTML = '<p class="fb-msg">' + (tudo ? 'Ordem perfeita!' : hits + ' de ' + L.length + ' no sítio certo. ' + esc(sorte(C.mensagens.errado))) + '</p>' +
      (tudo ? '' : '<p class="col-h">Ordem certa</p><ol class="ordem-certa">' + L.map(l => '<li>' + esc(l) + '</li>').join('') + '</ol>') +
      '<p class="fb-e">' + esc(O.nota) + '</p><button class="btn primary" type="button">Continuar</button>';
    fb.querySelector('button').onclick = () => done(hits / L.length);
    try { fb.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch(e){}
  };
  render();
}

/* ---------- Liga ---------- */
function telaLigar(ctx, key, done){
  const set = C.ligar[key], n = set.pares.length;
  const esq = baralhar(set.pares.map((_, i) => i)), dir = baralhar(set.pares.map((_, i) => i));
  let sel = null, falhas = 0; const feitos = [];
  ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">Liga</p><h2 class="qtext">' + esc(set.titulo) + '</h2><p class="lead">Toca primeiro num ' + esc(set.colA.toLowerCase()) + ' e depois no que lhe corresponde.</p>' +
    '<div class="lig"><div><p class="col-h">' + esc(set.colA) + '</p><div class="lig-a">' + esq.map(i => '<button class="lk a" data-i="' + i + '" type="button">' + esc(set.pares[i][0]) + '</button>').join('') + '</div></div>' +
    '<div><p class="col-h">' + esc(set.colB) + '</p><div class="lig-b">' + dir.map(i => '<button class="lk b" data-i="' + i + '" type="button"><span class="pr"></span>' + esc(set.pares[i][1]) + '</button>').join('') + '</div></div></div>' +
    '<div class="fb" hidden></div></article>';
  const A = Array.from(ctx.body.querySelectorAll('.lk.a')), B = Array.from(ctx.body.querySelectorAll('.lk.b'));
  const abana = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };
  A.forEach(b => b.onclick = () => {
    const i = +b.dataset.i; if (feitos.indexOf(i) >= 0) return;
    sel = i; A.forEach(x => x.classList.toggle('sel', x === b));
  });
  B.forEach(b => b.onclick = () => {
    const j = +b.dataset.i; if (feitos.indexOf(j) >= 0) return;
    if (sel == null){ A.forEach(abana); return; }
    const a = A.find(x => +x.dataset.i === sel);
    if (j === sel){
      const cor = 'm' + (feitos.length % 4); feitos.push(j);
      a.classList.remove('sel'); a.classList.add(cor); b.classList.add(cor); a.disabled = b.disabled = true;
      b.querySelector('.pr').textContent = set.pares[j][0] + ' ·';
      sel = null; acerto();
      if (feitos.length === n) acabar();
    } else { falhas++; erro(); abana(b); abana(a); }
  });
  function acabar(){
    const c = Math.max(0, (n - falhas) / n);
    const fb = ctx.body.querySelector('.fb');
    fb.hidden = false; fb.className = 'fb pop-in ' + (falhas ? 'is-info' : 'is-ok');
    fb.innerHTML = '<p class="fb-msg">' + (falhas ? 'Tudo ligado, com ' + falhas + (falhas === 1 ? ' tentativa errada.' : ' tentativas erradas.') : 'Tudo ligado à primeira!') + '</p><button class="btn primary" type="button">Continuar</button>';
    fb.querySelector('button').onclick = () => done(c);
    try { fb.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch(e){}
  }
}

/* =====================================================================
   REVISÃO DOS ERROS
   ===================================================================== */
function errosAtivos(){ return Object.keys(S.erros).filter(id => ITENS[id]); }
function revisao(){
  const ids = errosAtivos();
  if (!ids.length){
    limpar(); topo();
    $app.innerHTML = '<div class="wrap"><section class="res pop-in"><p class="eyebrow">Revisão dos erros</p><h2>Não tens perguntas erradas para rever.</h2><p class="lead">Quando errares uma pergunta num mundo, num minijogo ou no teste final, ela aparece aqui até a acertares 2 vezes seguidas.</p><div class="acts"><button class="btn primary" id="v-ini" type="button">Voltar ao início</button></div></section></div>';
    $('#v-ini').onclick = inicio; return;
  }
  combo = 0;
  const ctx = palco('Revisão dos erros');
  const totalIni = ids.length, feitas = [];
  let fila = baralhar(ids), atual = null, pend = null;
  const concluir = (ok, Q, i) => {
    const id = atual; feitas.push({ ok, Q, i }); atual = null; pend = null;
    if (ok){
      const e = S.erros[id] || { s:0 }; e.s = (e.s || 0) + 1;
      if (e.s >= 2){ delete S.erros[id]; toast('Dominada! Saiu da revisão.'); }
      else { S.erros[id] = e; fila.splice(Math.min(fila.length, 2 + Math.floor(Math.random() * 3)), 0, id); }
    } else {
      fila.splice(Math.min(fila.length, 2), 0, id);
    }
    guardar(); passo();
  };
  function mostrarFeita(j){
    topo();
    const ultimo = j + 1 >= feitas.length;
    ctx.setAnterior(j > 0, () => mostrarFeita(j - 1));
    ctx.setVoltar(() => j > 0 ? mostrarFeita(j - 1) : ctx.sair());
    ctx.body.innerHTML = htmlRevisto(feitas[j], 'Já respondida') + '<div class="acts"><button class="btn primary" id="rv-seg" type="button">' + (ultimo ? 'Voltar à pergunta onde ias →' : 'Seguinte →') + '</button></div>';
    $('#rv-seg').onclick = () => ultimo ? passo() : mostrarFeita(j + 1);
  }
  function passo(){
    topo();
    const faltam = errosAtivos().length;
    if (!atual && (!fila.length || !faltam)){
      limpar();
      $app.innerHTML = '<div class="wrap"><section class="res pop-in"><p class="eyebrow">Revisão dos erros</p><p class="big">' + totalIni + '</p><h2>Dominaste todas as perguntas que tinhas errado!</h2>' + htmlRespostas(feitas, 'Ver as tuas respostas') + '<div class="acts"><button class="btn primary" id="v-ini" type="button">Voltar ao início</button></div></section></div>';
      $('#v-ini').onclick = inicio; confetis(); return;
    }
    ctx.prog((totalIni - faltam) / totalIni, 'faltam ' + faltam);
    ctx.setAnterior(feitas.length > 0, () => mostrarFeita(feitas.length - 1));
    ctx.setVoltar(() => feitas.length ? mostrarFeita(feitas.length - 1) : ctx.sair());
    if (!atual) atual = fila.shift();
    ctx.setMateria(ITENS[atual].m);
    if (pend){
      ctx.body.innerHTML = htmlRevisto(pend, 'Pergunta atual') + '<div class="acts"><button class="btn primary" id="rv-cont" type="button">Continuar</button></div>';
      $('#rv-cont').onclick = () => concluir(pend.ok, pend.Q, pend.i); return;
    }
    telaPergunta(ctx, ITENS[atual], concluir, { onResp:(ok, Q, i) => { pend = { ok, Q, i }; } });
  }
  passo();
}

function testeFinal(){
  combo = 0;
  if (progOk('teste')) return jogar('Teste final · sem explicações até ao fim', [], fimTeste, 'teste', 'teste');
  const TF = C.testeFinal;
  const dest = baralhar(C.perguntas.filter(p => p.destaque)).slice(0, TF.minDestaque);
  const perg = dest.concat(baralhar(C.perguntas.filter(p => dest.indexOf(p) < 0)).slice(0, TF.perguntas - dest.length));
  const cls = baralhar(Object.values(ITENS).filter(it => it.t === 'cl')).slice(0, TF.classificar);
  const passos = baralhar(perg.concat(cls)).map(it => ({ k:'q', it }));

}
function fimTeste(r){
    const certas = r.res.filter(x => x.ok).length, erradas = r.res.filter(x => !x.ok);
    S.xp += certas * 10;
    erradas.forEach(x => { S.erros[x.Q.id] = { s:0 }; });
    S.teste = { melhor:Math.max(S.teste ? S.teste.melhor : 0, certas), ultima:certas };
    guardar();
    const msg = certas >= 18 ? 'Excelente! Estás pronto para o teste.' : certas >= 14 ? 'Muito bom! Revê as que falhaste e chegas lá acima.' : certas >= 10 ? 'Positiva! Usa a revisão dos erros para subir a nota.' : 'Ainda não chegaste à positiva, mas agora sabes exatamente o que rever.';

      }).join('') + '</div>' : '') +
      htmlRespostas(r.res, 'Ver todas as respostas') +
      '<div class="acts"><button class="btn primary" id="t-rep" type="button">Fazer outro teste</button>' + (erradas.length ? '<button class="btn" id="t-rev" type="button">Rever os erros</button>' : '') + '<button class="btn ghost" id="t-ini" type="button">Início</button></div></section></div>';
    $('#t-rep').onclick = testeFinal;
    const rv = $('#t-rev'); if (rv) rv.onclick = revisao;

    if (certas >= 18) setTimeout(confetis, 250);

/* Minijogo "Legenda o mapa/esquema": escolhe o nome de cada número (fica guardado se se usar aoMudar) */

    '<p class="small muted" id="mp-falta"></p><button class="btn primary big" id="mp-ok" type="button">Corrigir</button><div class="fb" hidden></div></article>';
